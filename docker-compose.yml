---
# BEAI — local development stack
# All image tags are pinned per docs/version-catalog.md (D25) — the LIVE catalog,
# not the design.md copy, which drifted. Never use `latest`.
# Run: docker compose up -d
# Stop: docker compose down
# Full teardown (remove volumes): docker compose down -v

# ---------------------------------------------------------------------------
# Shared runtime environment for every service built from ./api — `api`,
# `worker` and `scheduler` run the SAME image and must agree on where Postgres,
# Redis and Mailpit live. Defined once on purpose: three copies of this block
# is three chances for a change to land on one service and silently miss the
# others, and a worker pointed at the wrong database fails asynchronously,
# where nobody is watching.
# ---------------------------------------------------------------------------
x-api-environment: &api-environment
  # The BROWSER-facing origin, and the mirror image of the DB/Redis overrides
  # below: those replace localhost with compose service names because the calls
  # are container-to-container, while this one must NOT be a service name
  # because the consumer is a browser on the host.
  #
  # `APP_URL` is what `AppServiceProvider::forcePublicRootUrl()` builds every
  # absolute URL from. Left to the request's Host header, a signed profile-photo
  # URL came back as `http://api:8000/storage/...` — the compose service name,
  # which no browser can resolve. The response was 200 and the signature valid;
  # the image simply never loaded.
  #
  # Pinned here rather than left to `api/.env` because a stale checkout carrying
  # `APP_URL=http://localhost` (no port) reproduces the same broken URL, and the
  # port is something compose already knows.
  APP_URL: "http://localhost:${API_PORT:-8000}"
  # DB_CONNECTION is pinned here on purpose: without it the container inherits
  # whatever the developer's api/.env happens to say, and a stray
  # DB_CONNECTION=sqlite silently ignores every other override below — the
  # app then tries to open a SQLite file literally named "beai" and dies.
  DB_CONNECTION: pgsql
  # Pinned for the same reason as DB_CONNECTION, and it is not hypothetical:
  # api/.env currently says QUEUE_CONNECTION=database, and an env value beats
  # the config default this stack ships. Left alone, the worker would consume
  # the DATABASE queue while the health probe inspects REDIS — the probe would
  # then find an empty Redis queue and report healthy forever, no matter what
  # the worker was or was not doing. Two subsystems, two different queues, and
  # a green light over the top of it.
  QUEUE_CONNECTION: redis
  # Pinned to `redis` because CLAUDE.md's stack table binds cache AND session to
  # Redis 8, and that table is authoritative ("This stack table and D25 MUST
  # never diverge"). `config/cache.php:18` still defaults to `database` — a
  # Laravel scaffold default nobody revisited, already flagged as a real
  # divergence in this change's own design.md:369. Pinning `database` here
  # would not have preserved the status quo; it would have promoted an
  # unratified drift into an explicit, load-bearing deployment decision, which
  # is precisely the kind of thing that belongs in SDD rather than in a compose
  # comment.
  #
  # Safe for the scheduler lock: `onOneServer()` needs a `LockProvider`, and
  # `Illuminate\Cache\RedisStore` implements it just as `DatabaseStore` does
  # (verified — `RedisStore extends TaggableStore implements CanFlushLocks,
  # LockProvider`). `bootstrap/app.php`'s `withSchedule()` note was updated alongside this pin
  # and now deliberately names no store at all, which is the durable shape:
  # what the lock requires is that the store be SHARED across processes, and
  # `CACHE_STORE=file` is the setting that quietly turns it into no lock.
  CACHE_STORE: redis
  # Same table, same reasoning. Left unpinned, this was the third load-bearing
  # driver taking its value from api/.env by accident rather than by decision.
  SESSION_DRIVER: redis
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-beai}
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  # `smtp`, so local mail reaches the Mailpit service above. Without this it
  # resolves to config/mail.php's default of `log`, and the process that
  # actually sends operator alerts is the `worker` service below — a worker on
  # the `log` driver writes every alert into a container filesystem nobody
  # reads. That is the failure C12 flagged as CRITICAL, and it closes here.
  #
  # `smtp`, NOT `resend`. Resend is the production transport (C12 api PR5) and
  # is selected by the deployment environment, which has a real API key and a
  # verified sender domain. Pointing local development at it would send real
  # mail from a developer's machine on someone's account.
  MAIL_MAILER: smtp

# Postgres and Redis must both be healthy before anything that runs jobs starts.
x-api-depends-on: &api-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 + pgVector
  # Image: pgvector/pgvector:0.8.0-pg17 (D25)
  # The init.sql script creates both `beai` (dev) and `beai_test` (Pest) databases.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: beai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-beai}
    ports:
      # 5433 on the HOST, not 5432, and the default rather than an opt-in.
      #
      # A developer machine very often already runs a native PostgreSQL on
      # 5432. Docker publishes on the wildcard address while a native server
      # binds the specific loopback one, and the specific bind WINS — so with
      # both running, every `localhost:5432` connection silently reaches the
      # native server instead of this container. That failure is invisible:
      # the client connects, authenticates, and simply shows a different
      # database. It cost real time here (an OpenAPI export against the wrong
      # server, and a SQL client showing databases that were not the app's).
      #
      # 5433 makes the two addressable at once and unambiguous. The container's
      # own port is unchanged, so nothing inside the compose network moves:
      # services still reach it at `postgres:5432`. Override with POSTGRES_PORT
      # if you have no native server and prefer the standard port.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-beai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beai_network

  # ---------------------------------------------------------------------------
  # Redis 8
  # Image: redis:8.0-alpine (D25)
  # Used for: queue, cache, session, JWT denylist (C2+). Horizon is NOT installed
  # (ratified 2026-07-28) — workers run Laravel's native queue:work.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.0-alpine
    container_name: beai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - beai_network

  # ---------------------------------------------------------------------------
  # Mailpit — local mail catcher
  # Image: axllent/mailpit:v1.22 (D25)
  # SMTP: port 1025 | Web UI: port 8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: beai_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - beai_network

  # ---------------------------------------------------------------------------
  # App services — enabled once the Dockerfiles exist in each app directory.
  # Each app requires postgres + redis healthy before starting.
  # api: nginx on port 8000, forwarding to php-fpm on 127.0.0.1:9000 INSIDE the
  # container, both under supervisord — see the image CMD in api/Dockerfile and
  # the `fastcgi_pass` in api/docker/nginx.conf. Publish 8000, never 9000: fpm is
  # not reachable from outside the container, and publishing it once left the API
  # unreachable while the container still reported healthy.
  # This comment previously claimed the image ran `php artisan serve`. It did,
  # until b5b9f97 replaced it precisely because that is Laravel's DEVELOPMENT
  # server and handles one request at a time.
  # frontend SSR: Nitro node-server on port 3000.
  # backoffice SPA: nginx static serve on port 3001 (mapped from container 80).
  #
  # NOTE: These services use env_file pointing at each app's .env file.
  # Copy each app's .env.example to .env and fill in the values before running.
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: beai-api:local
    container_name: beai_api
    restart: unless-stopped
    volumes:
      # See `api_storage` at the foot of this file. Without it, everything the
      # `local` disk writes — proctoring snapshots above all — lives in the
      # container's writable layer and is destroyed by `--force-recreate`,
      # `down`, or any rebuild.
      - api_storage:/var/www/storage/app
    env_file:
      - path: ./api/.env
        required: false
    # Override DB/Redis to use compose service names (not localhost).
    environment: *api-environment
    ports:
      # nginx listens on 8000 inside the container and hands PHP to fpm on
      # 127.0.0.1:9000, which is container-local and must NOT be published
      # (see the `listen` and `fastcgi_pass` directives in api/docker/nginx.conf).
      # Publishing 9000 here once left the API unreachable from the host while
      # the container still reported healthy.
      - "${API_PORT:-8000}:8000"
    depends_on: *api-depends-on
    healthcheck:
      # Probe the real HTTP surface. The previous check ran `php-fpm -t`, which
      # only validates an fpm config file — it returned success even when nothing
      # was serving, making "healthy" meaningless for this container.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - beai_network

  # ---------------------------------------------------------------------------
  # Queue worker — consumes the Redis queue (async scoring, webhook delivery).
  #
  # Same image as `api`, different command. `beai:queue-work` is the ONLY
  # supported way to start a worker: it validates the runtime invariant before
  # the loop opens and structurally refuses `--tries`, because retry policy
  # belongs to each job, not to the worker.
  #
  # No `container_name`: a fixed name makes the service unscalable, and this is
  # precisely the service you scale — `--scale worker=0` to silence it locally,
  # or up when scoring throughput demands it.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: beai-api:local
    restart: unless-stopped
    volumes:
      # The SAME volume as `api`, not a second one. The request path writes a
      # snapshot and a queued job reads it back, so separate volumes would hand
      # the worker an empty directory and a failure that reads as corruption.
      - api_storage:/var/www/storage/app
    env_file:
      - path: ./api/.env
        required: false
    environment: *api-environment
    # Exec form on purpose: php runs as PID 1 and receives SIGTERM directly, so
    # the worker finishes its current job and exits cleanly instead of being
    # killed mid-job by a shell that never forwards the signal.
    command: ["php", "artisan", "beai:queue-work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The healthcheck below probes the `api` service, so the dependency is
      # declared rather than assumed. Without it the worker starts probing a
      # host that may not be listening yet and burns its retries on startup
      # ordering instead of on real failures.
      api:
        condition: service_healthy
    # 1290s = the worker's 1260s job timeout + 30s of headroom.
    #
    # Read this before "fixing" it: worst case, `docker compose down` can take
    # up to ~21 minutes while a scoring job is mid-flight. That is the accepted
    # cost of never force-killing a legitimate 20-minute job — not a bug, and
    # not a number to shrink because a teardown once felt slow. Shrinking it
    # means SIGKILL on a job that was working correctly, and a half-written
    # evaluation is far more expensive than a slow `down`.
    stop_grace_period: 1290s
    healthcheck:
      # The probe reads the BODY, not just the status code, and this is the
      # whole point rather than a stylistic preference.
      #
      # `GET /api/health/queue` returns **HTTP 200 for `degraded`**
      # (`QueueHealthController::__invoke()`), and `reservationStalled` — a worker
      # that is up but wedged on a stuck reserved job — is one of the three
      # inputs to `degraded`. A plain `curl -fsS` fails only on >= 400, so it
      # would have reported that container **healthy**: the exact failure this
      # check exists for, waved through. The only 503 the endpoint emits is
      # heartbeat staleness, i.e. "is the process looping" — which is precisely
      # the signal a bare `pgrep` already gives, over the network, for more
      # money.
      #
      # It keys on `queue.reservation_stalled` and NOT on `status`, because
      # `status` also goes `degraded` when `failed.count > 0` — a single
      # historical failed job would then pin this container unhealthy forever.
      #
      # Fails closed: curl error, unparseable body or a missing key all exit 1.
      #
      # Two known limits, stated rather than papered over. Both have the same
      # root cause — this probe asks the API about the SHARED queue, not this
      # container about itself:
      #   1. Under `--scale worker=3` all three replicas return byte-identical
      #      answers, so one wedged replica among healthy ones is invisible.
      #   2. Stop or break `api` and every worker flips unhealthy while it is
      #      consuming jobs perfectly well — and `dev.sh:wait_healthy` will fail
      #      the whole boot on it. `depends_on: api` below narrows the startup
      #      window; it does nothing for an API that dies later.
      # The real fix for both is a per-container heartbeat the worker does not
      # write today — worth building when replicas become real, not before.
      test:
        - CMD-SHELL
        - |
          body=$$(curl -fsS http://api:8000/api/health/queue) || exit 1
          printf '%s' "$$body" | php -r 'exit((json_decode(stream_get_contents(STDIN), true)["queue"]["reservation_stalled"] ?? true) ? 1 : 0);'
      interval: 15s
      timeout: 5s
      retries: 5
      # 60s, and deliberately NOT the 300s heartbeat TTL. An earlier revision
      # used 300s by analogy with `HEARTBEAT_TTL_SECONDS`, which was wrong twice
      # over: this probe keys on `queue.reservation_stalled`, not on the
      # heartbeat, and a freshly booted worker with nothing reserved answers
      # correctly straight away. Worse, 300s exceeded `wait_healthy`'s own 180s
      # budget in scripts/dev.sh — the container would still be reporting
      # `starting` when the script gave up on it.
      start_period: 60s
    networks:
      - beai_network

  # ---------------------------------------------------------------------------
  # Scheduler — runs Laravel's scheduled tasks (queue pruning, maintenance).
  #
  # `onOneServer()` is the guarantee; `replicas: 1` is only the default.
  #
  # Stated in that order on purpose. `deploy.replicas: 1` below is NOT a pin —
  # `docker compose up --scale scheduler=3` overrides it with no error and no
  # warning. What actually prevents a scheduled task from running twice is the
  # `->onOneServer()` chained on every task in `bootstrap/app.php`'s
  # `withSchedule()` block, backed by a lock in whichever cache store is
  # configured — a Redis key under this stack's `CACHE_STORE: redis`, not a
  # `cache_locks` row. The store is not named here on purpose; see the anchor's
  # note. An earlier revision of this comment claimed the replica count was the
  # guarantee, which directly contradicted that same block — two files asserting
  # opposite things about the same property is how a safety property gets
  # deleted by someone who read only the reassuring one.
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: beai-api:local
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: false
    environment: *api-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      # The SAME volume `api` and `worker` share, for the same reason and one
      # more. Nothing scheduled touches the local disk TODAY — all four tasks
      # (`queue:prune-failed`, `queue:prune-batches`, `model:prune
      # RefreshToken`, `ReconcileLlmUsage`) are database-only — so this is
      # latent rather than fixing a break.
      #
      # It is mounted anyway because the GDPR retention purge (product decision
      # 2) is by nature a SCHEDULED task that deletes files from this disk, and
      # a scheduler with its own empty volume would report a clean purge over
      # files it never saw. That is the failure mode the volume comment at the
      # foot of this file describes as "looking like corruption", except a
      # purge reports success while doing nothing — which is worse, because
      # nobody goes looking.
      - api_storage:/var/www/storage/app
    depends_on: *api-depends-on
    deploy:
      replicas: 1
    # Deliberately NO healthcheck, and the reasoning is worth keeping because
    # the obvious one is a trap.
    #
    # A `pgrep -f 'artisan schedule:work'` probe CANNOT FAIL. Docker runs
    # CMD-SHELL probes through `sh -c`, so that shell's own command line
    # contains the pattern and pgrep always matches at least itself. It would
    # report healthy with the scheduler long dead — worse than no probe, because
    # it looks like supervision.
    #
    # The bracket trick (`[a]rtisan`) dodges the self-match, but the check would
    # still be pointless here: `command:` is exec form, so php is PID 1, and
    # when PID 1 exits the CONTAINER exits. There is no "process died but the
    # container lives" state to detect — `restart: unless-stopped` above is the
    # actual supervision. `schedule:work` exposes no endpoint and writes no
    # heartbeat, so there is nothing else to interrogate.
    #
    # If real scheduler observability is wanted, the answer is a heartbeat
    # written by a scheduled task and read back, not a process probe.
    #
    # `disable: true` is required, and omitting the key is NOT equivalent —
    # verified by watching this container go unhealthy at t=75s on a real cold
    # start. This service runs the `api` image, whose Dockerfile declares its
    # own HEALTHCHECK (`curl -f http://localhost:8000/api/health`). With no
    # compose-level override the container inherits it and probes an HTTP
    # server that this command never starts, so it fails forever. `dev.sh`
    # waits on this service, so the whole boot would have failed on it.
    healthcheck:
      disable: true
    networks:
      - beai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: beai-frontend:local
    container_name: beai_frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      # RELATIVE, and that is the fix rather than a tidy-up.
      #
      # This was `http://api:8000/api` — right for SSR, which runs inside the
      # network, and wrong for the browser, which runs on the developer's
      # machine where `api` does not resolve. `pages/interview/[token].vue` is
      # `ssr: false`, so the BROWSER made that call, it failed on DNS, and
      # `[token].vue` routes every non-401 failure to `reason=403` — telling a
      # candidate their interview had expired when the fetch never left the
      # laptop.
      #
      # A NUXT_PUBLIC_* value is shipped to the browser by definition, so it
      # must be browser-reachable; inside the container `localhost` is the
      # container itself. One value cannot serve both, which is why the app now
      # proxies `/api` on its own origin (server/routes/api/[...].ts) exactly
      # as the backoffice already does through nginx. The browser makes no
      # cross-origin request at all.
      NUXT_PUBLIC_API_BASE: /api
      # Server-side only: where that proxy forwards. Never shipped to the
      # browser — doing so is the bug above.
      #
      # `NUXT_API_ORIGIN`, not `BEAI_API_ORIGIN`: Nuxt populates
      # `runtimeConfig.apiOrigin` from `NUXT_` + the upper-snake key AT RUNTIME,
      # and only from that name. The backoffice's nginx reads BEAI_API_ORIGIN
      # because nginx has no such convention — the two differ because the
      # runtimes differ, not by oversight. Verified: with the wrong name the
      # proxy answers 500 "BEAI_API_ORIGIN is not configured", which is exactly
      # the loud failure that guard exists to produce.
      NUXT_API_ORIGIN: "${BEAI_API_ORIGIN:-http://api:8000}"
      NUXT_PUBLIC_APP_ENV: local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Depends on `api`, not on postgres/redis. It previously gated on both
    # databases and on neither the API — but it holds no DB or Redis credential
    # and cannot be talking to either, while every request it makes ends up at
    # `api:8000`. The graph waited on what it does not use and not on what it
    # does, so SSR could render against an API that was not listening yet.
    #
    # The route to `api:8000` is NUXT_API_ORIGIN, not NUXT_PUBLIC_API_BASE: this
    # comment used to name the latter, which is now `/api` and holds no origin at
    # all. SSR resolves that relative path against its own origin, reaches
    # `server/routes/api/[...].ts`, and the proxy forwards. The conclusion —
    # depend on `api` — is unchanged; only the reason had gone stale, ninety
    # lines from the comment that made it stale.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The SSR runtime image (node:24.11-slim, pinned in docs/version-catalog.md
      # — never a bare major, which is what tag_pinned exists to reject) ships
      # NEITHER curl NOR wget, so the
      # previous curl-based probe could never succeed — the container reported
      # unhealthy forever while actually serving correctly. Node's global fetch
      # is always present, so use the runtime we already depend on.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      # 5s is correct and was measured, not guessed. If you find this container
      # sitting `unhealthy` while /health returns 200 from inside it, the probe
      # is NOT the cause — the Docker VM is out of resources.
      #
      # Seen 2026-08-27: `unhealthy`, 13 straight "exceeded timeout (5s)", and
      # a hand-run of the identical command exiting 0. It looked exactly like a
      # timeout that needed raising. It was not: 14 containers (including an
      # unrelated Supabase stack) and a dozen buildkit processes shared a
      # 3.8 GiB VM, and Docker's own log said "timed out STARTING health check"
      # — the container could not spawn a process at all, let alone fetch.
      # Raising this to 12s changed nothing, because nothing here was wrong.
      #
      # Diagnose with `docker stats --no-stream` and `docker ps | wc -l`
      # before touching this number. Node cold-starts in ~100ms and a localhost
      # fetch is instant; 5s is roughly fifty times the honest cost.
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - beai_network

  backoffice:
    build:
      context: ./backoffice
      args:
        # Baked into the JS bundle at build time — the `environment:` entry below
        # cannot change it, because this is a statically generated SPA. The `/api`
        # suffix is mandatory: the composables append `/auth/login` to it, and
        # Laravel's CORS middleware only covers `api/*`, so omitting it yields a
        # 404 with no CORS headers that the browser reports as a CORS error.
        # Relative on purpose. An absolute `http://localhost:8000/api` sends the
        # BROWSER straight at the api's published port, bypassing the nginx
        # proxy this image ships — so the proxy works and nothing uses it, and
        # if that host port is slow or unpublished every request hangs with no
        # error (seen 2026-08-27: /api/health was 200 in 0.3s through nginx on
        # :3001 and timed out on :8000, while login sat pending forever).
        #
        # It also silently undid the same-origin architecture production runs:
        # cross-origin here makes `beai_refresh` a THIRD-PARTY cookie, which is
        # exactly the shape WebKit blocks — the Safari session bug that
        # `backoffice-same-origin-api` was written to fix, reintroduced in local
        # dev where it would be blamed on anything but this line.
        NUXT_PUBLIC_API_BASE: "${BACKOFFICE_API_BASE:-/api}"
        # REQUIRED by the Dockerfile, which hard-fails without it (see its
        # `test -n "$BEAI_API_ORIGIN"` guard). Compose never passed it, so
        # `docker compose build backoffice` could not succeed at all — the
        # whole-stack path was broken while the infra-only `task up` path,
        # which never builds this image, stayed green and hid it.
        #
        # No `/api` suffix here, unlike NUXT_PUBLIC_API_BASE above: this is an
        # ORIGIN that nginx appends the request path to, not a base URL the
        # client concatenates onto. `api` is the compose service name, resolved
        # on the shared network — localhost inside this container is itself.
        BEAI_API_ORIGIN: "${BEAI_API_ORIGIN:-http://api:8000}"
      dockerfile: Dockerfile
    image: beai-backoffice:local
    container_name: beai_backoffice
    restart: unless-stopped
    env_file:
      - path: ./backoffice/.env
        required: false
    environment:
      # Inert for this service: the SPA is statically generated and bakes its API
      # base at build time (see build.args above). Kept correct anyway so it cannot
      # be copied elsewhere as if it were authoritative — and it was NOT correct:
      # it held an absolute URL that this app's own Dockerfile rejects outright
      # ("NUXT_PUBLIC_API_BASE must be RELATIVE"), because an absolute base makes
      # the api a different SITE on Railway, the refresh cookie third-party, and
      # Safari unusable. Inert at runtime is exactly why nothing caught it, and
      # "kept correct so nobody copies it" is a promise the value was breaking.
      NUXT_PUBLIC_API_BASE: /api
    ports:
      - "${BACKOFFICE_PORT:-3001}:80"
    # Same correction as `frontend`: it held no DB or Redis credential and was
    # gating on both. Strictly, nginx can serve the generated SPA with nothing
    # else running — but every screen it serves is useless until the API answers,
    # and the browser, not this container, is what calls it. Waiting on `api`
    # keeps `dev.sh` honest: when it says the stack is up, the stack works.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx answers /health with a 301 to /health/ (directory-style route from
      # the generated SPA). The previous probe used `wget --spider`, which does
      # not follow redirects, so it read the 301 as a failure and the container
      # reported unhealthy while serving correctly. `-L` follows the redirect.
      test: ["CMD-SHELL", "curl -fsSL http://localhost:80/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - beai_network

# ---------------------------------------------------------------------------
# Named volumes (data persists across `docker compose restart`)
# Use `docker compose down -v` to wipe volumes (destructive — resets databases).
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Uploaded files written through the `local` disk — proctoring snapshots,
  # transcripts, anything `FILESYSTEM_DISK=local` produces.
  #
  # Without this they live in the container's writable layer, which survives
  # `restart` and `up -d` but is DESTROYED by `--force-recreate`, `down`, and
  # every image rebuild. A developer checking that proctoring captured frames
  # would find them gone after any of those, with nothing to indicate the files
  # had ever existed.
  #
  # Shared by `api` and `worker` on purpose: the request path writes the file
  # and a queued job reads it back, so two separate volumes would give the
  # worker an empty directory and a failure that looks like corruption.
  #
  # Production is unaffected — Railway sets `FILESYSTEM_DISK=s3`, so nothing
  # is written to the local disk there at all.
  api_storage:
    driver: local

# ---------------------------------------------------------------------------
# Internal network — all services communicate over `beai_network`.
# ---------------------------------------------------------------------------
networks:
  beai_network:
    driver: bridge
