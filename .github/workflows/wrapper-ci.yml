---
# BEAI — Wrapper Cross-Stack CI
#
# Validates cross-repo consistency and compose config integrity.
# Does NOT re-run per-app unit/E2E suites (those belong to each app's own CI).
# Does NOT deploy — Railway deploy is manual and per-service.
#
# The app directories ARE git submodules with real remotes, and the checkout
# below fetches them recursively. The note that stood here said the opposite and
# deferred the submodule-pointer check "until real URLs exist" — they have
# existed for a long time, and the note outliving that fact is why nobody
# noticed the openapi gate below had never once run.
#
# This workflow validates, in the order the steps run:
# Two steps run BEFORE the lettered gates and are not part of the sequence:
# the lint of scripts/ci-guards.sh (the guard mechanism itself, checked before
# anything sources it) and the lint-and-run of scripts/docker-disk-check.sh
# with its own test suite. Both are listed here because a step absent from the
# index is a step nobody renumbers.
#
#   (a) docker compose config parses, and every image tag — compose services,
#       Dockerfile FROM bases, Dockerfile COPY --from= images and the images a
#       script pins for `docker run` alike — is pinned; this workflow's own
#       `uses:` references are SHA-pinned; and AGENTS.md is a symlink to
#       CLAUDE.md rather than a second copy of the rules
#   (b) the committed openapi.json is semantically identical across api/frontend/backoffice
#   (c) each app's check-client-drift.sh exits 0 (generated TS client matches openapi.json)
#   (d) the framework catalog, in full. Parity between the authored source and
#       the vendored copy; every declared role has BARS or a committed entry in
#       scripts/framework-known-gaps.txt; every declared role×competency PAIR
#       has BARS or an entry in scripts/framework-competency-gaps.txt; every
#       bars file names a declared role or a declared non-role catalogue; shape
#       completeness (3 indicators, every anchor level present); the anchor
#       length ceiling, per locale; cross-role anchor identity against its
#       closed baseline, both directions; roles/competencies locale SHAPE and
#       locale COMPLETENESS; cross-locale divergence; non-role locale coverage;
#       and the locale-gaps control file (nothing stale, no partial role, no
#       interleaving). All build-failing.
#
#       This entry listed three of those for a long time while the step ran
#       thirteen. The rule below binds here or it binds nowhere.
#   (e) every submodule pointer is reachable from a published remote ref
#   (f) the self-test: every guard that DECIDES — each one that can fail a
#       build — still rejects a known-bad fixture, including the five scan_*
#       guards used by (g) and the reality-check functions used by (h), both of
#       which run after it.
#
#       Stated narrowly on purpose. This line used to claim "every guard in
#       this file", which was never true: the control-file PARSERS
#       (known_gap_roles, known_gap_pairs, known_locale_gap_pairs,
#       known_crossrole_baseline_entries) and catalog_locale_coverage are
#       exercised only through the deciders that call them, not by rows of
#       their own. That is a deliberate boundary, not coverage — and claiming
#       more than the mechanism delivers is the exact defect this step exists
#       to catch, so the claim is the part that had to change. The index has to
#       be maintained like a gate, and that includes this line.
#   (g) no stale stack tokens (MySQL, Laravel 12, Sanctum, Horizon, npm/pnpm/yarn)
#   (h) docs/version-catalog.md matches reality, in both directions: every
#       image tag actually used (Dockerfile FROM bases, compose image:
#       references, and IMAGE= pins in scripts/) is cataloged, and every
#       cataloged tag is still used
#
# That list said "(a) compose (b) openapi (c) drift" long after (d) through (g)
# were added, and two orphaned banner blocks for (d) and (e) sat stacked above
# a step that was neither. In a file whose whole thesis is that a note
# outliving its fact is why nobody noticed, the index has to be maintained like
# a gate. Renumber it when you add a step.
#
# The GUARD MECHANISMS themselves are not in this file. They live in
# scripts/ci-guards.sh, which both the real gates and the self-test in (f)
# source. See the header of that file for why: a self-test holding its own copy
# of the thing under test proves the copy works.
#
# Triggers: develop, main, release/** and hotfix/**.
#
# It used to be develop only, justified as "releases handled by Git Flow". This
# is the ONLY workflow in the wrapper, so nothing re-ran these gates on a
# release: the branch where submodule pointers are bumped to release tags, and
# the branch that becomes production, got no cross-stack validation at all.
# hotfix/** is worse — by definition it ships straight to main, under pressure.

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

# Every step in this job reads: checkout, compose config, openapi/catalog
# comparison, submodule ancestry checks, self-test fixtures. None of it pushes
# a branch, opens a PR, writes a release, or calls an API that needs a token
# scope wider than reading the checked-out ref. `contents: read` is the only
# scope any step here uses — GITHUB_TOKEN is not referenced anywhere in this
# file (checkout and setup-bun do not need one). Set at the workflow level,
# not per-job, because there is exactly one job and it needs exactly this.
permissions:
  contents: read

jobs:
  wrapper-cross-stack:
    name: Cross-Stack Consistency
    runs-on: ubuntu-latest
    # GitHub's default is 360 (6h) — meant for jobs that build and deploy, not
    # for a validation pipeline that parses config and runs shell fixtures.
    # 20 minutes gives real headroom over normal run time (submodule checkout,
    # two `bun install --frozen-lockfile` runs, and step (f)'s few hundred
    # fixture assertions) without leaving a hang to burn hours of runner time
    # before anyone notices.
    timeout-minutes: 20

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Without this the submodules are empty directories, and every check
          # below that reads a file inside one fails on FileNotFoundError before
          # it can compare anything.
          #
          # The note that used to sit here said to add this "once .gitmodules
          # has real remote URLs". They have been real for a long time — so the
          # cross-stack openapi gate, which guards the single most drift-prone
          # artifact in a three-repository setup, has never once run.
          submodules: recursive
          # Full history, not the default depth-1. That depth applies to
          # submodules too, and in a shallow clone the pointer check below
          # cannot see the ancestry chain — so it reports a perfectly good pin
          # as unreachable the moment a submodule's branch advances past it,
          # which is the NORMAL state of a wrapper between bumps.
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Lint scripts/ci-guards.sh — the gate that file's own header promises.
      #
      # Before this step, that header said `shellcheck -s sh` and `dash -n`
      # "pass on this file" and told the reader to "verify both before
      # changing this paragraph" — an instruction to a HUMAN, checked by
      # NOTHING in CI. In a file whose entire thesis is that a note outliving
      # its fact is how defects survive, that was the one load-bearing claim
      # with no gate behind it. Not lettered with (a)-(h) below: those are
      # cross-stack consistency checks, this is a lint of the guard mechanism
      # itself, run once, ahead of anything that sources it.
      # -----------------------------------------------------------------------
      - name: Lint scripts/ci-guards.sh (shellcheck -s sh, dash -n)
        run: |
          shellcheck -s sh scripts/ci-guards.sh
          dash -n scripts/ci-guards.sh

      # -----------------------------------------------------------------------
      # The disk guard, linted and RUN.
      #
      # `-s bash` rather than `sh`: the script uses `set -o pipefail`, and the
      # test file adds `local` and `BASH_SOURCE` — none of them POSIX sh.
      # Checking them as sh would report style errors for features they are
      # entitled to use. ci-guards.sh stays POSIX because dash runs it.
      #
      # This comment used to say "bash arrays and `[[`". Neither file contains
      # either, so the justification for a lint dialect named features that
      # were not the reason — in the file whose thesis is that a note outliving
      # its fact is how defects survive.
      #
      # Running the tests here matters more than linting them. The script's
      # value is being BELIEVED when it speaks, and three of its guards
      # (minified JSON, an unreadable df, a du that fails while stat succeeds)
      # protect against reporting confident nonsense. Each is pinned by a test
      # that fails against the unguarded version — verified, not assumed — and
      # a guard nobody runs is a guard that rots.
      #
      # No Docker needed: every branch is reachable from a temporary HOME.
      # -----------------------------------------------------------------------
      - name: Lint and run the docker disk guard
        run: |
          # EVERY bash script under scripts/, discovered rather than listed.
          # e2e-container.sh was the one that named itself out of coverage by
          # simply never being added — and it carries the `printf %q` re-quoting
          # and the Bun installer pin, both exactly what shellcheck catches.
          # ci-guards.sh is excluded here because it is POSIX sh and gets its own
          # stricter `-s sh` + `dash -n` step above; checking it as bash would
          # pass on constructs that step exists to reject.
          BASH_SCRIPTS=$(find scripts -name '*.sh' ! -name 'ci-guards.sh' | sort)
          if [ -z "$BASH_SCRIPTS" ]; then
            echo "ERROR: no shell scripts found under scripts/ — zero files is a lint that FAILED TO RUN."
            exit 1
          fi
          echo "$BASH_SCRIPTS" | sed 's/^/  linting /'
          # shellcheck disable=SC2086
          shellcheck -s bash $BASH_SCRIPTS
          bash scripts/tests/docker-disk-check.test.sh

      # -----------------------------------------------------------------------
      # (a) docker compose config — validates the compose file parses cleanly
      #     and defines exactly 8 services: postgres, redis and mailpit, the
      #     three app services api, frontend and backoffice, and worker +
      #     scheduler.
      #
      #     This comment said 6 and named six. worker and scheduler are the two
      #     that actually run `queue:work` and `schedule:work` — which is the
      #     entire reason Horizon could be deferred, a decision guard (g) below
      #     exists to keep. Leaving them out of the count leaves the
      #     justification out of the file that depends on it.
      #
      #     And the count is now ASSERTED rather than claimed. `config -q`
      #     proves the file parses, not that anything is in it: delete
      #     `scheduler` and this step stayed green while the comment above it
      #     promised coverage. The expected set lives in
      #     scripts/ci-guards.sh (CI_EXPECTED_COMPOSE_SERVICES) so the self-test
      #     can run the same comparison against a deliberately broken list.
      # -----------------------------------------------------------------------
      - name: Validate docker compose config
        run: |
          . ./scripts/ci-guards.sh

          docker compose config -q

          ACTUAL_SERVICES=$(docker compose config --services)
          if ! compose_service_diff "$ACTUAL_SERVICES"; then
            echo "ERROR: docker-compose.yml does not define the expected service set."
            echo "  Guard (g) keeps Horizon deferred on the grounds that 'worker' and"
            echo "  'scheduler' exist and run queue:work / schedule:work. If that set has"
            echo "  legitimately changed, update CI_EXPECTED_COMPOSE_SERVICES in"
            echo "  scripts/ci-guards.sh in the same commit, and re-read (g)'s rationale."
            exit 1
          fi
          # Derived from CI_EXPECTED_COMPOSE_SERVICES, not hardcoded — a
          # count asserted by a comment is exactly the defect this step's own
          # header paragraph argues against; the count above it is CHECKED
          # (compose_service_diff), this line only reports how many.
          EXPECTED_COUNT=$(printf '%s\n' "$CI_EXPECTED_COMPOSE_SERVICES" | wc -w | tr -d ' ')
          echo "All $EXPECTED_COUNT compose services present: $ACTUAL_SERVICES" | tr '\n' ' '
          echo

          echo "Checking all pinned image tags (no 'latest' or bare-major allowed):"
          # `|| true` on a DISPLAY-only line. Actions runs every `run:` under
          # `bash -e`, so a grep that matches nothing returns 1 and kills the
          # step right here — before the real pinning assertion below ever
          # executes. Masked today only because compose emits six `image:`
          # lines; it stops being masked the moment every service is build-only
          # or the images move behind a comment, and then this is a red
          # pipeline with no reason printed. Same hazard step (d) already
          # guards, so it gets guarded here too — a rule that binds in one step
          # and not the next is a preference, not a rule.
          docker compose config | grep 'image:' | grep -v '#' || true

          # `tag_pinned` comes from scripts/ci-guards.sh — the SAME function the
          # Dockerfile loop below and the self-test in (f) call. It used to be
          # typed out here and typed out AGAIN in the self-test, which is how a
          # rule ends up with two implementations and only one of them right.
          #
          # The `image:` lines examined are COUNTED, not merely absent-of-
          # violation. `grep -E '^[[:space:]]*image:' | while read ...` matching ZERO
          # lines walks the loop zero times, exits 0, leaves /tmp/unpinned.txt
          # empty, and this step would announce "All compose image tags are
          # pinned" having examined NOTHING — a green gate over no evidence,
          # the exact shape guard (e)'s submodule check already refuses below
          # ("An empty list would walk the loop zero times ... a green gate
          # over no evidence"). Triggers here: a compose format change, a
          # service becoming build-only, or the `image:` key moving. Same
          # doctrine, same fix: assert a plausible minimum was actually
          # checked, and say how many. `compose_image_refs_present` comes from
          # scripts/ci-guards.sh — the SAME predicate the self-test in (f)
          # exercises against a deliberately empty count.
          # `|| true`: grep -c exits 1 when it matches nothing, and `set -e`
          # would kill the step right here — in exactly the zero-match case
          # this guard was added to report. The build would go red with no
          # reason printed, which is the failure the block below exists to
          # prevent. The count itself is the signal; grep's status is not.
          IMAGE_REFS=$(docker compose config | grep -cE '^[[:space:]]*image:' || true)
          if ! compose_image_refs_present "$IMAGE_REFS"; then
            echo "ERROR: found 0 'image:' references in \`docker compose config\` output."
            echo "  There is no evidence to check here, so this is a guard that FAILED TO RUN —"
            echo "  not a pass. If every service legitimately became build-only, this check"
            echo "  itself needs to change in the same commit, not silently pass over nothing."
            exit 1
          fi

          docker compose config | grep -E '^[[:space:]]*image:' | while read -r _ REF; do
            tag_pinned "$REF" || echo "UNPINNED:$REF"
          done > /tmp/unpinned.txt
          if [ -s /tmp/unpinned.txt ]; then
            echo "ERROR: floating image tag(s) in docker-compose — pin per D24/D25:"
            sed 's/^UNPINNED://' /tmp/unpinned.txt
            exit 1
          fi
          echo "All $IMAGE_REFS compose image tags are pinned."

          # Same rule, applied to the Dockerfile bases. `df_guard` prints the
          # first offending reference and exits non-zero; a file it cannot read
          # is a failure, not a pass.
          for DF in api/Dockerfile frontend/Dockerfile backoffice/Dockerfile; do
            if [ ! -f "$DF" ]; then
              echo "ERROR: $DF not found. The base-image check cannot verify what it cannot read."
              exit 1
            fi
            if ! OFFENDER=$(df_guard "$DF"); then
              echo "ERROR: $DF uses a floating base image: $OFFENDER. Pin it per D24/D25."
              exit 1
            fi
          done

          # And the SAME rule again, applied to `COPY --from=<image>`. This
          # construct takes an image reference exactly as FROM does — the
          # only difference is that df_guard never read it, so a floating tag
          # here (`COPY --from=composer:2`) was invisible to the guard whose
          # entire job is catching exactly that. `df_copy_from_guard` reuses
          # df_guard's own stage-exclusion helpers, so `COPY --from=builder`
          # (a stage, not an image) is still correctly skipped.
          for DF in api/Dockerfile frontend/Dockerfile backoffice/Dockerfile; do
            if ! OFFENDER=$(df_copy_from_guard "$DF"); then
              echo "ERROR: $DF uses a floating COPY --from= image: $OFFENDER. Pin it per D24/D25."
              exit 1
            fi
          done

          # And the same rule ONE more place: the images a script pins for
          # `docker run`. Step (h) was widened to count these as "used" and
          # this step was not, which meant a floating
          # `mcr.microsoft.com/playwright:latest` plus a matching catalog row
          # would have gone green through BOTH gates — over the 3.45GB image
          # that decides whether screenshot baselines reproduce. A rule that
          # binds in one step and not the next is a preference, not a rule.
          if ! SCRIPT_REFS=$(script_pinned_images scripts); then
            echo "ERROR: could not read scripts/ for the image refs it pins."
            exit 1
          fi
          # Minimum evidence, the same shape `compose_image_refs_present` uses
          # for compose and `USED_COUNT` uses in step (h). Without it, an empty
          # result — `find` matching nothing, or the IMAGE= convention moving —
          # walks the loop zero times and the step announces every script-pinned
          # image is pinned having examined none. This third source of "used"
          # images was widened without the guard the other two already had.
          SCRIPT_REF_COUNT=$(printf '%s\n' "$SCRIPT_REFS" | grep -c . || true)
          if [ "$SCRIPT_REF_COUNT" -eq 0 ]; then
            echo "ERROR: no IMAGE= pins found under scripts/ — expected at least the Playwright runner image."
            echo "  Zero references is a check that FAILED TO RUN, not a tree with nothing to pin."
            exit 1
          fi
          for REF in $SCRIPT_REFS; do
            if ! tag_pinned "$REF"; then
              echo "ERROR: a script pins a floating image tag: $REF. Pin it per D24/D25."
              exit 1
            fi
          done

          echo "All image tags are pinned — compose services, Dockerfile FROM bases, Dockerfile COPY --from= images, and script-pinned run images."

          # AGENTS.md must be a SYMLINK to CLAUDE.md, never a second copy.
          #
          # It was a copy. It drifted 103 lines over roughly a month, and the
          # review gate reads AGENTS.md — so reviews were judged against a
          # snapshot still claiming BEAI holds no candidate contact data and
          # that white-label was parked, both of which CLAUDE.md had already
          # reversed. Two files holding one truth is the defect this repo
          # rejects everywhere else; the rules themselves were the last place
          # still doing it.
          if [ ! -L AGENTS.md ]; then
            echo "ERROR: AGENTS.md is not a symlink. It must point at CLAUDE.md, not duplicate it —"
            echo "  a copy of the rules drifts, and the review gate reads AGENTS.md."
            exit 1
          fi
          AGENTS_TARGET=$(readlink AGENTS.md)
          if [ "$AGENTS_TARGET" != "CLAUDE.md" ]; then
            echo "ERROR: AGENTS.md points at '$AGENTS_TARGET', expected 'CLAUDE.md'."
            exit 1
          fi
          echo "AGENTS.md is a symlink to CLAUDE.md — one file, one truth."

          # Every repo agrees with itself about which version it is.
          #
          # The api asserts VERSION == composer.json == openapi.json in its own
          # CI. The two Nuxt apps asserted nothing and both drifted — patch
          # releases bumped package.json and left VERSION behind — and the
          # wrapper drifted the other way. Three repos, one released artifact
          # each, two answers each. This is the only place that sees all four.
          if ! VERSION_DRIFT=$(version_manifest_divergence . api backoffice frontend); then
            echo "ERROR: a repo has a VERSION file with no manifest, or no VERSION file at all."
            exit 1
          fi
          if [ -n "$VERSION_DRIFT" ]; then
            echo "ERROR: a repo disagrees with itself about its own version:"
            printf '%s\n' "$VERSION_DRIFT" | sed 's/^/  /'
            echo "  A release tag names ONE version. Move VERSION and the manifest together."
            exit 1
          fi
          echo "Every repo agrees with itself about its version."

          # This workflow's own `uses:` references, held to the same
          # immutability standard as every image tag above: a GitHub Actions
          # tag (`@v4`) is exactly as movable as a floating Docker tag, and
          # this file rejected `redis:8-alpine` for the same reason while
          # running under `actions/checkout@v4` itself. `workflow_actions_guard`
          # prints the first offending reference and exits non-zero.
          if ! OFFENDER=$(workflow_actions_guard .github/workflows/wrapper-ci.yml); then
            echo "ERROR: .github/workflows/wrapper-ci.yml uses an action not pinned to a commit SHA: $OFFENDER."
            echo "  Pin to the full 40-character commit SHA, with the human-readable version in a trailing comment."
            exit 1
          fi

          echo "This workflow's own 'uses:' references are all SHA-pinned."

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the patch, matching what frontend/Dockerfile and
          # backoffice/Dockerfile actually build with (`oven/bun:1.4.0`).
          #
          # Stated carefully, because the obvious argument for this is wrong.
          # '1.3' is NOT a violation of the rule step (a) enforces: `tag_pinned`
          # accepts a tag starting with a dotted version, exactly as
          # `axllent/mailpit:v1.22` does.
          #
          # This comment has now outlived its own fact TWICE — first pointing
          # at the archived D25, then still saying `1.3.14` after the pin moved
          # to 1.4.0 — in the file whose whole thesis is that a note surviving
          # its fact is how defects survive. The LIVE catalog is
          # `docs/version-catalog.md`; it pins `oven/bun:1.4.0` for both
          # Dockerfile build stages, and every 1.3 reference now survives only
          # in that file's prose explaining that the ARCHIVED D25 drifted.
          # There is nothing to reconcile: this line matches the source of
          # truth. If it stops matching, the fix is the comment AND the pin,
          # moved together.
          #
          # Why the patch is fixed HERE at all: `bun.lock` pins the app's
          # DEPENDENCIES, not the Bun binary that reads it. Without this the
          # wrapper could install deps and run codegen under a different Bun
          # than the image the apps are built in, and step (c) — which compares
          # generated TS clients — is exactly where that difference would
          # surface, attributed to client drift.
          #
          # Tightening, never loosening (D37). If Bun moves, move both
          # Dockerfiles and this line together with docs/version-catalog.md.
          bun-version: '1.4.0'

      # -----------------------------------------------------------------------
      # (b) openapi.json cross-repo consistency check
      #     The committed openapi.json in api/, frontend/, and backoffice/ MUST
      #     be semantically identical (same parsed JSON, whitespace-agnostic).
      #
      #     Mutual equality is NOT freshness (generated-client-truth-and-
      #     session-safety D2). All three copies can be identical and all
      #     three can be stale relative to the current `api` code — this
      #     check only proves the three agree with EACH OTHER, never that any
      #     one of them matches a live `scramble:export`. That is exactly the
      #     failure mode that let ten mistyped resources and a
      #     `ProfileResource.locale` staleness ship undetected: this gate was
      #     green throughout. Only `api/.github/workflows/ci.yml`'s
      #     `git diff --exit-code openapi.json` (run immediately after a
      #     fresh `scramble:export`) can catch that all three are stale at
      #     once — this job does not attempt to, and should not be read as if
      #     it does.
      # -----------------------------------------------------------------------
      - name: Verify openapi.json is identical across api/frontend/backoffice
        run: |
          . ./scripts/ci-guards.sh

          # `json_canonical_equal` from scripts/ci-guards.sh — one canonicaliser,
          # shared with the catalog gate in (d) and exercised by the self-test in
          # (f). Compared pairwise against api/, which is the producer: the two
          # consumers are copies of it, so naming it as the reference makes the
          # failure message point at the file that has to change.
          FAIL=0
          # "Cannot read" and "differs" are separated here for the same reason
          # (a), (d) and (e) separate them: a missing frontend/openapi.json
          # otherwise prints "differs from api/openapi.json" and sends whoever
          # is on call hunting for drift in a file that is not there. Still
          # red either way — but red pointing at the right thing.
          #
          # That separation used to stop at "missing". A file that EXISTS but
          # is not valid JSON fell through to the `elif json_canonical_equal`
          # branch, which could not tell "unreadable" from "differs" either —
          # both exited 1 — so it printed the same "differs from
          # api/openapi.json" wording for a file the guard never actually
          # compared. `json_canonical_equal` now exits 2 (not 1) for that
          # case specifically so this step can point at the right fact; the
          # exit code has to be captured explicitly ($?), because a plain
          # `if cmd; then ... else ...` only distinguishes zero from nonzero.
          JSON_CMP_ERR=$(mktemp)
          for APP in frontend backoffice; do
            if [ ! -f "$APP/openapi.json" ]; then
              echo "  ERROR: $APP/openapi.json does not exist."
              echo "    This is a file that could not be READ, not a snapshot that drifted."
              FAIL=1
              continue
            fi
            # Captured via if/else, not `cmd; STATUS=$?` on separate lines —
            # every `run:` block in this workflow executes under `bash -e`
            # (Actions' default, and explicit in step (f)), and a bare
            # nonzero-exiting command not inside an `if` condition aborts the
            # step right there, before its exit status is ever read.
            if json_canonical_equal api/openapi.json "$APP/openapi.json" 2>"$JSON_CMP_ERR"; then
              JSON_CMP_STATUS=0
            else
              JSON_CMP_STATUS=$?
            fi
            if [ "$JSON_CMP_STATUS" -eq 0 ]; then
              echo "  ok — $APP/openapi.json is semantically identical to api/openapi.json"
            elif [ "$JSON_CMP_STATUS" -eq 2 ]; then
              echo "  ERROR: could not compare $APP/openapi.json against api/openapi.json."
              echo "    This is a file the guard could NOT READ (missing or not valid JSON), not a snapshot that drifted."
              sed 's/^/    /' "$JSON_CMP_ERR"
              FAIL=1
            else
              echo "  $APP/openapi.json differs from api/openapi.json"
              FAIL=1
            fi
          done
          rm -f "$JSON_CMP_ERR"

          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: openapi.json cross-repo drift detected!"
            echo "The committed openapi.json must be identical in api/, frontend/, and backoffice/."
            echo "To fix: re-export from api (php artisan scramble:export), copy to frontend/ and backoffice/, regenerate typed clients, run full test suites green, commit."
            exit 1
          fi

          echo "openapi.json is semantically identical across all 3 repos."

      # -----------------------------------------------------------------------
      # (c) TS client drift check — each app's check-client-drift.sh must exit 0.
      #     Requires Bun and openapi-typescript to be available.
      # -----------------------------------------------------------------------
      - name: Install frontend deps (for drift check)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check frontend TS client drift
        working-directory: frontend
        run: bash scripts/check-client-drift.sh

      - name: Install backoffice deps (for drift check)
        working-directory: backoffice
        run: bun install --frozen-lockfile

      - name: Check backoffice TS client drift
        working-directory: backoffice
        run: bash scripts/check-client-drift.sh

      # -----------------------------------------------------------------------
      # (d) The framework catalog exists in two places, and must not drift —
      #     and must not be incomplete.
      #
      # docs/app_description/02-domain/framework is the AUTHORED source — a
      # human edits it, CLAUDE.md marks it binding. api/database/framework is a
      # vendored copy, because the API has to carry its own seed data: it
      # deploys alone, with no wrapper above it, and a catalog it cannot read is
      # a production database with no competencies, no roles and no BARS
      # anchors — one no project can be created against.
      #
      # Two copies of a binding artifact is a drift risk, so it gets the same
      # treatment openapi.json already has: compared here, not trusted to
      # discipline.
      #
      # Parity is only half the question, though, and this gate used to ask only
      # that half. See the completeness block inside the step — it enforces
      # role/pair/shape coverage now that SRX.json has been authored
      # (bars-catalogue-completion Phase 6), and will turn CI red the moment
      # any role or pair loses coverage again.
      # -----------------------------------------------------------------------
      - name: Verify the framework catalog matches its authored source and is complete
        run: |
          . ./scripts/ci-guards.sh

          # Locale dimension (framework-catalog-it-translations, design D1).
          # Every locale-aware guard below reads this — set here, once, so a
          # future locale (Italian first) is examined by every content guard
          # from the moment its first string lands, not from whenever someone
          # remembers to widen this line. "en" alone would make an "it" key
          # in the catalogue an "unknown-locale-it" CI failure the day content
          # PRs start landing — the ceiling is raised NOW, ahead of content,
          # on purpose.
          export CI_LOCALES="en it"

          SRC=docs/app_description/02-domain/framework
          VENDORED=api/database/framework
          FAIL=0
          # Loops below read from a redirected FILE, not `< <(...)`. Process
          # substitution is a bashism, and this step is held to the same POSIX
          # standard as scripts/ci-guards.sh — see that file's header. A plain
          # pipe would not do: the loop body sets FAIL, and the right-hand side
          # of a pipe is a subshell whose assignments are discarded.
          LIST=$(mktemp)

          for D in "$SRC" "$VENDORED"; do
            if [ ! -d "$D" ]; then
              echo "ERROR: $D not found. The catalog check cannot compare what it cannot read."
              exit 1
            fi
          done

          # Compared as PARSED JSON, like openapi.json: formatting is not the
          # contract, content is. `json_canonical_equal` is the shared
          # canonicaliser from scripts/ci-guards.sh, which also handles the
          # export-versus-assign trap that made the first version of this gate
          # report every single file as differing.
          #
          # Same "cannot read" vs "differs" split as step (b): exit 2 means
          # the guard could not read/parse one of the two copies, exit 1
          # means it read both and they disagree. Reporting a malformed
          # vendored JSON file as "differs" would send the next operator
          # diffing two files for a content change that a JSON syntax error
          # makes impossible to even compute.
          JSON_CMP_ERR=$(mktemp)
          (cd "$SRC" && find . -name '*.json' | sed 's|^\./||') > "$LIST"
          while IFS= read -r REL; do
            if [ ! -f "$VENDORED/$REL" ]; then
              echo "ERROR: $REL exists in the authored source but not in $VENDORED."
              FAIL=1
              continue
            fi
            # Captured via if/else — see step (b)'s identical comment on why
            # `cmd; STATUS=$?` on separate lines is unsafe under `bash -e`.
            if json_canonical_equal "$SRC/$REL" "$VENDORED/$REL" 2>"$JSON_CMP_ERR"; then
              JSON_CMP_STATUS=0
            else
              JSON_CMP_STATUS=$?
            fi
            if [ "$JSON_CMP_STATUS" -eq 2 ]; then
              echo "ERROR: could not compare $REL — the guard could NOT READ it (missing or not valid JSON)."
              sed 's/^/  /' "$JSON_CMP_ERR"
              FAIL=1
            elif [ "$JSON_CMP_STATUS" -ne 0 ]; then
              echo "ERROR: $REL differs between the authored source and $VENDORED."
              FAIL=1
            fi
          done < "$LIST"
          rm -f "$JSON_CMP_ERR"

          # And the reverse: a file vendored but no longer authored.
          (cd "$VENDORED" && find . -name '*.json' | sed 's|^\./||') > "$LIST"
          while IFS= read -r REL; do
            if [ ! -f "$SRC/$REL" ]; then
              echo "ERROR: $REL exists in $VENDORED but not in the authored source."
              FAIL=1
            fi
          done < "$LIST"

          # ------------------------------------------------------------------
          # COMPLETENESS — a different question from parity, and the one the
          # gate was blind to.
          #
          # Everything above proves the two copies AGREE. Both CAN be equally
          # wrong, and both WERE, until bars-catalogue-completion Phase 6:
          # roles.json declared FIVE roles (ICO, FLL, MLL, BUL, SRX) while
          # bars/ carried only FOUR files. SRX.json was absent from BOTH
          # trees, so a parity-only gate stayed green over a catalog missing
          # an entire role — nobody could be scored as SRX, and nothing said
          # so. bars/SRX.json now exists in both trees; this block is what
          # would catch the same class of defect again, for SRX or any role.
          #
          # Asserted against scripts/framework-known-gaps.txt rather than
          # absolutely, because both absolutes are wrong here. Failing
          # unconditionally leaves CI permanently red over 54 indicators of
          # expert assessment content nobody in a code change can author, and a
          # gate that cannot go green gets deleted — then it protects nothing,
          # which is the openapi gate's story repeated. Warning only is how the
          # incomplete catalog got here.
          #
          # So the list is enforced in BOTH directions, and the second one is
          # what keeps it from rotting:
          #
          #   a role missing BARS and NOT on the list  -> fail
          #   a role ON the list whose BARS now EXISTS -> fail
          #
          # An exemption that outlives its gap is a note outliving its fact,
          # which is this file's entire thesis. SRX.json landed in Phase 6
          # with its known-gaps entry deleted in the SAME commit; the same
          # rule holds for any future role whose bars file goes missing.
          #
          # The vocabulary is the runtime's own: FrameworkCatalogSeeder already
          # records this as FrameworkGap kind=role_no_bars,
          # status=pending_authoring. One fact, one name for it.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if [ ! -f "$TREE/roles.json" ]; then
              echo "ERROR: $TREE/roles.json not found. The completeness check has no role list to assert against."
              FAIL=1
              continue
            fi

            # Existence was already checked above, but existence is not
            # PARSEABILITY, and this branch is the difference. A non-zero return
            # means the role list could not be read at all — malformed JSON, a
            # shape that is not an object, no bun on PATH. That is not an empty
            # list and must never be reported as a clean catalog: the guard did
            # not pass, it failed to RUN. It used to fall straight through to
            # the success message.
            if catalog_unexpected_missing_bars "$TREE" > "$LIST"; then
              while IFS= read -r ROLE; do
                [ -n "$ROLE" ] || continue
                echo "ERROR: roles.json declares role '$ROLE' but $TREE/bars/$ROLE.json does not exist,"
                echo "  and '$ROLE' is not listed in scripts/framework-known-gaps.txt."
                echo "  A role with no BARS file has no behavioural anchors, so nobody can be scored on it."
                echo "  Author the file, or add '$ROLE' to the known-gaps list with the reason written beside it."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the completeness check could not read $TREE/roles.json."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed. See the"
              echo "  ci-guards message above for the cause (malformed JSON, wrong shape, or no bun)."
              FAIL=1
            fi

            # The exemption must not outlive the gap.
            catalog_stale_gap_exemptions "$TREE" > "$LIST"
            while IFS= read -r ROLE; do
              [ -n "$ROLE" ] || continue
              echo "ERROR: '$ROLE' is listed in scripts/framework-known-gaps.txt, but $TREE/bars/$ROLE.json EXISTS."
              echo "  The gap is closed and the exemption is now a false statement about the catalog."
              echo "  Delete the '$ROLE' entry from scripts/framework-known-gaps.txt."
              FAIL=1
            done < "$LIST"
          done

          # ------------------------------------------------------------------
          # PER-PAIR completeness (bars-coverage-visibility) — one level
          # finer than the role check just above. A role's BARS file can
          # exist and still be PARTIAL, and the check above is blind to that
          # — the file is there, so it passes. That was literally true until
          # bars-catalogue-completion: FLL and MLL anchored 8 of their 18
          # assigned competencies and BUL 8 of its 14, with a role-level
          # gate that saw nothing wrong. All 83 pairs are anchored now, so
          # this gate exists to catch the REGRESSION, not a current gap.
          #
          # Asks its question ONLY of roles whose bars file EXISTS. A role
          # with no bars file at all is the role-level check's business
          # above, via scripts/framework-known-gaps.txt — SRX was that case
          # until bars-catalogue-completion Phase 6 authored bars/SRX.json;
          # declaring its 18 pairs here too would have put it in both
          # control files and turned Phase 6 into a 19-line deletion instead
          # of a clean role-level resolution on the other file.
          #
          # scripts/framework-competency-gaps.txt is a SECOND file, not an
          # extension of the role-level list: known_gap_roles() reads the
          # FIRST whitespace field of a line, so a "FLL:PRS" entry there would
          # parse as a role code named "FLL:PRS" and corrupt that gate.
          #
          # Same two directions, same vocabulary discipline (competency_no_bars
          # — FrameworkCatalogSeeder's own name for this gap).
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if catalog_unexpected_missing_bars_pairs "$TREE" > "$LIST"; then
              while IFS= read -r PAIR; do
                [ -n "$PAIR" ] || continue
                echo "ERROR: $TREE declares role×competency pair '$PAIR' (roles.json), but its BARS file has no anchors for it,"
                echo "  and '$PAIR' is not listed in scripts/framework-competency-gaps.txt."
                echo "  A competency with no anchors for this role has no behavioural basis to be scored on."
                echo "  Author the anchors, or add '$PAIR' to the per-pair known-gaps list with the reason written beside it."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the per-pair completeness check could not read $TREE/roles.json or one of its bars files."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed. See the"
              echo "  ci-guards message above for the cause (malformed JSON, wrong shape, or no bun)."
              FAIL=1
            fi

            # The exemption must not outlive the gap, in any of its THREE
            # directions: the anchors were authored, the pair no longer
            # exists at all, or (the SRX shape) the role has no bars file at
            # all and the exemption belongs on the role-level list instead.
            # Guarded, like its sibling above. ci-guards.sh documents this
            # return value as meaningful — "the guard failed to run", never
            # "nothing to report" — and this caller ignored it. Under Actions'
            # `bash -e` an unparseable roles.json killed the step right here
            # with ZERO output: hits already written to $LIST were never
            # printed and the fix instructions never ran. Red with no reason is
            # the shape this file exists to prevent.
            if ! catalog_stale_competency_gap_exemptions "$TREE" > "$LIST"; then
              echo "ERROR: the stale-exemption check could not read $TREE/roles.json."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi
            while IFS= read -r PAIR; do
              [ -n "$PAIR" ] || continue
              # Status CAPTURED, not discarded with `|| true`.
              #
              # 1 means "not actually stale" — a legitimate answer with no
              # output. 2 means the tree could not be read, and that used to
              # land in the `*)` branch below and print "roles.json no longer
              # assigns that competency" — an instruction to delete a CORRECT
              # exemption, about a file nobody parsed. `|| true` flattened the
              # two into one empty string.
              if REASON=$(stale_competency_gap_exemption_reason "$TREE" "$PAIR"); then
                REASON_RC=0
              else
                REASON_RC=$?
              fi
              if [ "$REASON_RC" -eq 2 ]; then
                echo "ERROR: could not determine why '$PAIR' is exempt in $TREE — roles.json or its bars file could not be read."
                echo "  This is a guard that FAILED TO RUN, not a stale exemption. Fix the catalogue, do not delete the entry."
                FAIL=1
                continue
              fi
              case "$REASON" in
                role-level)
                  echo "ERROR: '$PAIR' is listed in scripts/framework-competency-gaps.txt, but its role has no BARS file at all in $TREE."
                  echo "  A role with no bars file is the ROLE-level gate's business (scripts/framework-known-gaps.txt), not this list's."
                  echo "  Move '$PAIR' — and every other pair for the same role — off scripts/framework-competency-gaps.txt; the role"
                  echo "  belongs on scripts/framework-known-gaps.txt instead (or already is)."
                  ;;
                anchored)
                  echo "ERROR: '$PAIR' is listed in scripts/framework-competency-gaps.txt, but its BARS anchors now exist in $TREE."
                  echo "  Delete the '$PAIR' entry from scripts/framework-competency-gaps.txt."
                  ;;
                orphaned)
                  echo "ERROR: '$PAIR' is listed in scripts/framework-competency-gaps.txt, but roles.json in $TREE no longer assigns that competency to that role."
                  echo "  Delete the '$PAIR' entry from scripts/framework-competency-gaps.txt."
                  ;;
                *)
                  # Named explicitly rather than folded into `orphaned`, which
                  # is what the catch-all used to do: an answer this step does
                  # not recognise is a guard drifting from its caller, and
                  # reporting it as a stale exemption would send someone to
                  # delete a correct entry.
                  echo "ERROR: stale_competency_gap_exemption_reason returned an unrecognised answer for '$PAIR' in $TREE: '$REASON'."
                  echo "  This is a guard that no longer agrees with its caller, not a verdict about the catalogue."
                  ;;
              esac
              FAIL=1
            done < "$LIST"
          done

          # ------------------------------------------------------------------
          # SHAPE completeness (bars-catalogue-completion) — one level finer
          # than "is this pair covered" (the per-pair check above). A
          # competency can be COVERED and still be a stub: an array with the
          # wrong count, an empty indicator, or a scale missing a level, all
          # satisfy `bars_competency_keys`'s only test (`length > 0`). This is
          # the check that would have caught it, run against every role whose
          # bars file exists — a role with none at all is the role-level
          # gate's business above, not this one's.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if [ ! -d "$TREE/bars" ]; then
              continue
            fi
            for BARS_FILE in "$TREE"/bars/*.json; do
              [ -e "$BARS_FILE" ] || continue
              ROLE=$(basename "$BARS_FILE" .json)
              if catalog_malformed_bars_entries "$TREE" "$ROLE" > "$LIST"; then
                while IFS= read -r ENTRY; do
                  [ -n "$ENTRY" ] || continue
                  echo "ERROR: $TREE/bars/$ROLE.json has a malformed anchor entry: '$ENTRY'."
                  echo "  Every anchored competency needs exactly 3 indicators, each with a non-empty 'indicator'"
                  echo "  and a 'scale' object with exactly keys 5, 3, 1 — all non-empty, no leading/trailing whitespace."
                  FAIL=1
                done < "$LIST"
              else
                echo "ERROR: the shape-completeness check could not read $TREE/bars/$ROLE.json."
                echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
                FAIL=1
              fi
            done
          done

          # ------------------------------------------------------------------
          # ANCHOR LENGTH (bars-catalogue-completion, Phase 5) — a MAXIMUM
          # only, blocking, on every role's committed anchors. No CI guard
          # checked anchor length at all until this one: Phase 4's own
          # apply-progress records a first draft where roughly half its new
          # anchors ran 19-26 words against the house-voice standard's own
          # "10-18 words, one sentence" rule
          # (framework-authoring/house-voice-and-anti-hedge-standard.md
          # §1.2), caught only by a throwaway script comparing them BY HAND
          # against Phase 3's already-measured anchors. That regression
          # would have shipped clean through every gate that existed then.
          #
          # The ceiling (18) needs no committed baseline the way the
          # cross-role check below does: measured directly, every bars file the
          # loop reads tops out at 18 words today. Written as "FLL, MLL, BUL and
          # SRX" until POTENTIAL.json joined `bars/*.json` — the loop is a glob,
          # so enumerating roles in the comment describes a narrower set than the
          # mechanism reads, and the enumeration is the part that rots.
          #
          # ICO is exempt — see `catalog_overlong_bars_anchors`'s own
          # comment in scripts/ci-guards.sh for why: a documented, different
          # two-sentence, 20-30-word register, not a defect in the
          # leader-file shape this guard exists to catch. The exemption lives
          # INSIDE that function, not as a role check here, so its self-test
          # in step (f) proves it against the SAME function this step calls.
          #
          # The floor (10 words) is NOT enforced here — see the non-blocking
          # report immediately below, same doctrine as the hedge-rate report
          # (house-voice-and-anti-hedge-standard.md §2.3).
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if [ ! -d "$TREE/bars" ]; then
              continue
            fi
            for BARS_FILE in "$TREE"/bars/*.json; do
              [ -e "$BARS_FILE" ] || continue
              ROLE=$(basename "$BARS_FILE" .json)
              # EVERY locale in CI_LOCALES, not just the default.
              #
              # Both functions take the locale as their third argument and
              # default it to `en`. This loop passed two arguments, so every
              # Italian anchor ever committed went unmeasured — while the
              # header above claimed the ceiling was enforced on the committed
              # anchors, `CI_ANCHOR_WORDCOUNT_MAX_IT` carried a MEASURED
              # ceiling of its own, and step (f) certified the `it` path
              # end-to-end against a fixture. A guard proven and never called
              # is a guard that does not exist, and this one had a self-test
              # vouching for it.
              for LOCALE in $CI_LOCALES; do
                if catalog_overlong_bars_anchors "$TREE" "$ROLE" "$LOCALE" > "$LIST"; then
                  while IFS= read -r ENTRY; do
                    [ -n "$ENTRY" ] || continue
                    echo "ERROR: $TREE/bars/$ROLE.json has a [$LOCALE] anchor over the ceiling: '$ENTRY' (ROLE:COMP:LEVEL:LOCALE:WORDCOUNT)."
                    echo "  house-voice-and-anti-hedge-standard.md §1.2: leader anchors run one sentence, 10-18 words (the it ceiling is measured separately)."
                    FAIL=1
                  done < "$LIST"
                else
                  CEILING_RC=$?
                  # 2 and 1 are different problems and both block, so the
                  # difference is the MESSAGE. Reporting "could not read
                  # FLL.json for locale [es]" the day someone adds a desirable
                  # locale accuses a file that is perfectly fine and sends
                  # whoever reads it to the wrong place.
                  if [ "$CEILING_RC" -eq 2 ]; then
                    echo "ERROR: no measured anchor ceiling for locale [$LOCALE] — $TREE/bars/$ROLE.json was not checked."
                    echo "  A ceiling is MEASURED, never guessed (see CI_ANCHOR_WORDCOUNT_MAX_IT for how the it one was derived)."
                    echo "  Measure it before that locale ships, or drop the locale from CI_LOCALES."
                  else
                    echo "ERROR: the anchor-length check could not read $TREE/bars/$ROLE.json for locale [$LOCALE]."
                    echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
                  fi
                  FAIL=1
                fi
              done

              # Non-blocking report — the floor. Same doctrine as the
              # hedge-rate line: printed for review, never a build failure.
              # Guarded like every sibling, and the distinction matters here:
              # the FINDINGS are non-blocking, the guard FAILING TO RUN is not.
              # `catalog_overlong_bars_anchors` returns 0 for an exempt role
              # WITHOUT reading the file, so a malformed exempt bars file
              # reaches this line unexamined — and a bare assignment under
              # `bash -e` would kill the step here, before cross-role, locale
              # shape, completeness, divergence and interleaving ever run. Red
              # with no reason is the outcome this step exists to prevent.
              # The floor is advisory, and its two failure modes are NOT the
              # same thing: exit 2 means no measured threshold exists for that
              # locale (a configuration state — the `it` floor is unmeasured
              # per design D3, and a floor is measured, never guessed), exit 1
              # means the tree could not be read (a defect). Collapsing them
              # would force a choice between failing the build on an unmeasured
              # locale and ignoring an unreadable tree.
              for LOCALE in $CI_LOCALES; do
                if SHORT=$(catalog_short_bars_anchors "$TREE" "$ROLE" "$LOCALE"); then
                  if [ -n "$SHORT" ]; then
                    echo "NOTE (non-blocking, not a failure): $TREE/bars/$ROLE.json has [$LOCALE] anchor(s) under the floor: $SHORT"
                  fi
                else
                  FLOOR_RC=$?
                  if [ "$FLOOR_RC" -eq 2 ]; then
                    echo "NOTE (non-blocking): no measured anchor floor for locale [$LOCALE] — not reported for $ROLE."
                  else
                    echo "ERROR: could not read $TREE/bars/$ROLE.json for the [$LOCALE] anchor floor report."
                    echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
                    FAIL=1
                  fi
                fi
              done
            done
          done

          # ------------------------------------------------------------------
          # The MIRROR direction: every bars/<X>.json must name a role
          # roles.json declares, or be a DECLARED non-role catalogue file.
          #
          # Every other completeness check runs one way — roles.json declares a
          # role, does its bars file exist. Nothing ran the reverse, so any
          # .json dropped into bars/ was silently promoted to a role: shape-
          # checked for 3 indicators, measured against the leader anchor
          # ceiling, made a peer in cross-role duplicate detection — while
          # getting zero pair coverage, zero locale-gap tracking and zero
          # role-level accounting. POTENTIAL.json is the real case: `potential`
          # is an ASSESSMENT TYPE carrying MTG and LAT, which no role declares.
          # Legitimate, and therefore DECLARED by name in ci-guards.sh rather
          # than inferred from a filename. A file nobody listed is a file
          # nobody decided on.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if UNDECLARED_BARS=$(bars_files_without_declared_role "$TREE"); then
              if [ -n "$UNDECLARED_BARS" ]; then
                printf '%s\n' "$UNDECLARED_BARS" | while IFS= read -r B; do
                  [ -n "$B" ] || continue
                  echo "ERROR: $TREE/bars/$B.json names neither a role declared in roles.json nor a declared non-role catalogue file."
                  echo "  Add the role, or list the file in CI_NON_ROLE_BARS_FILES with a reason."
                done
                FAIL=1
              fi
            else
              echo "ERROR: could not check $TREE/bars against roles.json — this is a guard that FAILED TO RUN."
              FAIL=1
            fi
          done

          # ...and the non-role catalogue files get locale coverage of their
          # own. Declaring POTENTIAL.json stops the mirror guard firing; it does
          # NOT give the file coverage, and treating the declaration as the fix
          # would be the "documented, therefore handled" move this file rejects
          # everywhere else. Every pair guard is keyed on role_competency_pairs,
          # and MTG and LAT are in no role, so nothing checked whether their
          # Italian exists. It does. Clean today is not the same as checked.
          for TREE in "$SRC" "$VENDORED"; do
            for LOCALE in $CI_LOCALES; do
              if NRB_GAPS=$(non_role_bars_locale_gaps "$TREE" "$LOCALE"); then
                if [ -n "$NRB_GAPS" ]; then
                  printf '%s\n' "$NRB_GAPS" | while IFS= read -r G; do
                    [ -n "$G" ] || continue
                    echo "ERROR: $TREE has an incomplete non-role competency: $G (LOCALE:FILE:COMPETENCY)."
                  done
                  FAIL=1
                fi
              else
                echo "ERROR: could not check $TREE non-role bars files for locale [$LOCALE] — this is a guard that FAILED TO RUN."
                FAIL=1
              fi
            done
          done

          # ------------------------------------------------------------------
          # CROSS-ROLE anchor identity (bars-catalogue-completion) — "FLL's
          # PRS is MLL's PRS with different words" is a comparison BETWEEN
          # roles, invisible to every check above (each reads one role's file
          # at a time). Enforced against scripts/framework-crossrole-baseline.txt
          # with the SAME both-direction doctrine as the two known-gaps files:
          # a new duplicate not on the baseline fails the build, and so does a
          # baseline entry whose duplicate is no longer real. The baseline is
          # closed — see that file's header — so every entry here should be one
          # the baseline already records, never a new one. Four entries today:
          # the two pre-existing English duplicates (BUL/MLL on INF, FLL/MLL on
          # RES) and their Italian counterparts, which are faithful translations
          # of duplicated source and therefore duplicated too. This sentence said
          # "two ... never more" after the Italian landed — the baseline's own
          # header had PREDICTED four and nobody came back to either.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if [ ! -d "$TREE/bars" ]; then
              continue
            fi
            if catalog_unexpected_crossrole_duplicates "$TREE" > "$LIST"; then
              while IFS= read -r ENTRY; do
                [ -n "$ENTRY" ] || continue
                echo "ERROR: $TREE has a cross-role anchor-identity duplicate not on scripts/framework-crossrole-baseline.txt: '$ENTRY'."
                echo "  Two roles share a byte-identical indicator or anchor string for the same competency — a reworded copy,"
                echo "  not role-specific content. Reword it, or (only if it predates this change) add it to the baseline with"
                echo "  the reason written beside it."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the cross-role duplicate check could not read $TREE/bars/*.json."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi

            # Guarded like its sibling above (and unlike this line used to be):
            # `catalog_stale_crossrole_baseline_entries` propagates
            # `catalog_crossrole_duplicates`'s "could not read $TREE/bars"
            # failure via `return 1`, same as `catalog_unexpected_missing_bars`
            # and every other completeness function this step calls. Called
            # bare, a read failure here would abort THIS STEP under `bash -e`
            # mid-loop, printing nothing — the exact "red with no reason"
            # outcome the guards above it are already written to avoid.
            if catalog_stale_crossrole_baseline_entries "$TREE" > "$LIST"; then
              while IFS= read -r ENTRY; do
                [ -n "$ENTRY" ] || continue
                echo "ERROR: '$ENTRY' is listed in scripts/framework-crossrole-baseline.txt, but $TREE no longer has that duplicate."
                echo "  The duplicate is resolved and the baseline entry is now a false statement about the catalog."
                echo "  Delete the '$ENTRY' entry from scripts/framework-crossrole-baseline.txt."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the stale cross-role baseline check could not read $TREE/bars/*.json."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi
          done

          # ------------------------------------------------------------------
          # roles.json / competencies.json locale-map SHAPE
          # (framework-catalog-it-translations design D2 row 8) — 50 strings
          # nothing else reads (role_keys/role_competency_pairs read only
          # `code`/`competencies`; catalog_malformed_bars_entries reads bars
          # files only). Without this check they carry the locale dimension
          # under zero content guards.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if catalog_meta_locale_shape "$TREE" > "$LIST"; then
              while IFS= read -r ENTRY; do
                [ -n "$ENTRY" ] || continue
                echo "ERROR: $TREE has a malformed roles.json/competencies.json locale field: '$ENTRY'."
                echo "  Every name/definition/responsibilities value must be a locale-map object {\"en\":...,\"it\":...}, 'en' mandatory."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the roles.json/competencies.json locale-shape check could not read $TREE."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi
          done

          # ------------------------------------------------------------------
          # roles.json / competencies.json locale COMPLETENESS — the gap the
          # shape check above deliberately leaves open. `catalog_meta_locale_
          # shape` only requires `en`; every other locale key is optional, so
          # a field authored `{"en": "..."}` alone passes it. That is exactly
          # how 50 strings (20 competencies x {name, definition}, 5 roles x
          # {name, responsibilities}) shipped to production with no `it`
          # value at all: `scripts/framework-locale-gaps.txt` and its four
          # guards track role x competency BARS PAIRS only and had nothing to
          # say about a roles.json/competencies.json FIELD, and the global
          # missing_translation FrameworkGap — scored over that same BARS
          # pair set — reported "it locale: all 83 of 83 role x competency
          # pairs translated" throughout, true about its own domain and
          # silent about this one. This is the guard that closes it.
          #
          # See catalog_meta_locale_completeness's own comment in
          # scripts/ci-guards.sh for how it decides which locales are
          # expected (CI_LOCALES, set once above — never derived from what
          # happens to be present, which would have passed the exact bug
          # this guard exists to catch) and the argument against giving this
          # a fourth control file the way scripts/framework-locale-gaps.txt
          # has one: 50 strings in two files, authored atomically whenever a
          # competency or role is added at all, have no legitimate half-
          # landed state to name — unlike the incrementally-authored BARS
          # catalog its siblings track. Blocking, unconditionally.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if catalog_meta_locale_completeness "$TREE" > "$LIST"; then
              while IFS= read -r ENTRY; do
                [ -n "$ENTRY" ] || continue
                echo "ERROR: $TREE has an incomplete roles.json/competencies.json translation: '$ENTRY'."
                echo "  Every name/definition value must carry a non-empty value for every locale in CI_LOCALES ($CI_LOCALES)."
                echo "  roles.json responsibilities is exempt ONLY while its own 'en' value is blank (role not yet authored, FrameworkGap kind=n)."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the roles.json/competencies.json locale-completeness check could not read $TREE."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed. See the"
              echo "  ci-guards message above for the cause (malformed JSON, a field that is not a locale map, or an absent en)."
              FAIL=1
            fi
          done

          # ------------------------------------------------------------------
          # CROSS-LOCALE duplicate divergence (framework-catalog-it-translations
          # design D2a) — the one mechanical fidelity check that exists: an
          # Italian pair diverging where the English is byte-identical (or
          # converging where English differs) means the "translation" changed
          # the source. Blocking, and empty today because the catalogue IS
          # fully translated: all 83 role x competency pairs carry `it` on every
          # indicator and every anchor, and scripts/framework-locale-gaps.txt
          # legitimately lists nothing.
          #
          # This comment has been wrong twice in opposite directions — first
          # "no `it` content" flatly, then "no `it` ANCHOR content", both
          # written while the anchors were in fact translated. Measured before
          # writing it a third time: 162 `:it:` anchor measurements on FLL
          # alone, 0 incomplete pairs in either tree, 0 exemptions listed.
          # An empty control file here means DONE, not NOT STARTED — and the
          # check stays wired either way, so the next content PR is covered from
          # its first commit rather than from whenever someone remembers to add
          # a gate for it.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            if [ ! -d "$TREE/bars" ]; then
              continue
            fi
            if catalog_crosslocale_duplicate_divergence "$TREE" > "$LIST"; then
              while IFS= read -r ENTRY; do
                [ -n "$ENTRY" ] || continue
                echo "ERROR: $TREE has a cross-locale duplicate divergence: '$ENTRY'."
                echo "  Either the Italian pair diverges where the English is identical (an improved/altered translation),"
                echo "  or it converges where the English differs (a flattened translation). Translate faithfully instead."
                FAIL=1
              done < "$LIST"
            else
              echo "ERROR: the cross-locale divergence check could not read $TREE/bars/*.json."
              echo "  This is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi
          done

          # ------------------------------------------------------------------
          # PARTIAL IT-COVERAGE control file (framework-catalog-it-translations
          # design D6) — scripts/framework-locale-gaps.txt, same both-direction
          # doctrine as the two siblings above, PLUS the whole-role rule: no
          # role may ship half-translated. Checked for `it` only today (the
          # one locale this change adds); a future locale adds its own loop
          # iteration, not a rewrite of this one.
          # ------------------------------------------------------------------
          for TREE in "$SRC" "$VENDORED"; do
            for LOCALE in it; do
              if catalog_unexpected_locale_gaps "$TREE" "$LOCALE" > "$LIST"; then
                while IFS= read -r PAIR; do
                  [ -n "$PAIR" ] || continue
                  echo "ERROR: '$PAIR' is an incomplete $LOCALE translation in $TREE, but is NOT listed in scripts/framework-locale-gaps.txt."
                  echo "  Either finish translating it, or add it to the control file."
                  FAIL=1
                done < "$LIST"
              else
                echo "ERROR: the locale-coverage check could not read $TREE."
                FAIL=1
              fi

              if catalog_stale_locale_gap_exemptions "$TREE" "$LOCALE" > "$LIST"; then
                while IFS= read -r PAIR; do
                  [ -n "$PAIR" ] || continue
                  echo "ERROR: '$PAIR' is listed in scripts/framework-locale-gaps.txt, but is now fully translated (or no longer declared) in $TREE."
                  echo "  Delete the '$PAIR' entry from scripts/framework-locale-gaps.txt."
                  FAIL=1
                done < "$LIST"
              else
                echo "ERROR: the stale locale-gap-exemption check could not read $TREE."
                FAIL=1
              fi
            done
          done

          # `else` for the same reason every sibling in this step has one: a
          # guard that could not RUN must not read as a catalogue that passed.
          # This branch used to be unreachable — the function ended on `rm -f`
          # and could not return non-zero, so it had no way to say it could not
          # read the tree, and reported `it:ICO:15/0` instead. It has two
          # `return 1` paths now, one per unreadable input, and this branch is
          # live.
          # Both trees, like every sibling in this step. Parity is proven
          # earlier here, so one tree would be sufficient in fact — but an
          # asymmetry with no stated reason reads as deliberate to the next
          # person, and checking the second tree costs nothing.
          for TREE in "$SRC" "$VENDORED"; do
            if VIOLATIONS=$(locale_gaps_whole_role_violations "$TREE"); then
              if [ -n "$VIOLATIONS" ]; then
                echo "$VIOLATIONS" | while IFS= read -r V; do
                  [ -n "$V" ] || continue
                  echo "ERROR: scripts/framework-locale-gaps.txt lists a PARTIAL role against $TREE: '$V' (LOCALE:ROLE:LISTED/FULL) — no role may ship half-translated."
                done
                FAIL=1
              fi
            else
              echo "ERROR: locale_gaps_whole_role_violations could not run against $TREE — this is a guard that FAILED TO RUN, not a catalog that passed."
              FAIL=1
            fi
          done

          if ! INTERLEAVED=$(locale_gaps_role_order_violations); then
            echo "ERROR: locale_gaps_role_order_violations could not run — this is a guard that FAILED TO RUN, not a catalog that passed."
            FAIL=1
          fi
          if [ -n "$INTERLEAVED" ]; then
            echo "ERROR: scripts/framework-locale-gaps.txt interleaves role '$INTERLEAVED' with another role's entries."
            FAIL=1
          fi

          rm -f "$LIST"
          [ "$FAIL" -eq 0 ] || {
            echo "To fix drift: cp -R docs/app_description/02-domain/framework/* api/database/framework/"
            echo "To fix a missing BARS file: author it under the AUTHORED source first, then vendor it."
            exit 1
          }
          echo "The framework catalog matches its authored source; every declared role AND every declared role×competency pair has BARS or a committed, non-stale known gap."

      # -----------------------------------------------------------------------
      # (e) Submodule pointers: is every pinned commit actually reachable?
      #
      # This was the gap the header named and left open, and adding release/**
      # and hotfix/** to the triggers made it sharper rather than smaller —
      # those are precisely the branches where pointers get bumped to release
      # tags. A trigger was added for the branch while the only check that
      # branch specifically needs was missing.
      #
      # A pointer to a commit that exists only on somebody's laptop clones as a
      # detached, unfetchable SHA: `git submodule update` fails for everyone
      # else, and nothing here would have said so.
      #
      # Reachable from ANY published remote ref — NOT from the tracking branch.
      # .gitmodules names `develop` for all three submodules, and this gate used
      # to demand ancestry of exactly origin/<that branch>. But on release/**
      # and hotfix/** the pointers are bumped to release TAGS, which live on the
      # submodule's `main`; a hotfix commit on main that has not yet been merged
      # back to develop is not an ancestor of origin/develop. The branch-locked
      # rule failed the very branches it was widened to protect.
      #
      # The cost is already in this repo's history: `git log` carries commits
      # titled "release: merge main back into develop so the tag is an
      # ancestor". The release process was reshaped to satisfy a gate. A hotfix
      # ships straight to main under pressure and cannot afford that reordering,
      # and making it the price of a green pipeline is how a gate gets disabled
      # rather than fixed.
      #
      # So ask the question the failure mode actually poses — can everybody else
      # FETCH this commit? — and nothing more. Reachability from any published
      # ref answers exactly that, on develop, on main, on a release tag's
      # branch, and on a hotfix.
      #
      # TAGS ARE READ, not merely fetched. The first version of this fix pulled
      # tags down with `--tags` and then asked `git branch -r --contains`, which
      # lists remote-tracking BRANCHES and nothing else — so the tags arrived
      # and were never consulted, while the comment beside it claimed they were.
      # A pointer at a tagged commit that is not an ancestor of any remote head
      # would have been reported unreachable: the release case this step was
      # widened for, failing again, one layer down.
      #
      # Both namespaces are fetched into refs/remotes/ci-verify/, and the
      # reachability question is asked of that namespace alone. Everything under
      # it demonstrably arrived from origin during THIS run, which is what makes
      # the answer mean what it says. Asking `refs/tags` directly would have
      # counted a purely local tag — one nobody else can fetch — as proof that
      # everybody else can fetch it.
      # -----------------------------------------------------------------------
      - name: Verify submodule pointers are reachable from a published remote ref
        run: |
          . ./scripts/ci-guards.sh

          FAIL=0
          SUBMODULES=$(mktemp)
          FETCH_ERR=$(mktemp)
          CONTAINS=$(mktemp)
          git submodule status | sed 's/^[[:space:]]*//' > "$SUBMODULES"

          # An empty list would walk the loop zero times and print "All
          # submodule pointers are reachable" having verified nothing — a green
          # gate over no evidence, which is the shape this whole file exists to
          # refuse. Not reproducible by deleting .gitmodules (git still reads
          # the index gitlinks), so this is the fail-closed doctrine applied
          # defensively rather than a demonstrated bug.
          if [ ! -s "$SUBMODULES" ]; then
            echo "ERROR: git submodule status returned nothing."
            echo "  There is no evidence to check here, so this is a guard that FAILED TO RUN."
            exit 1
          fi

          while read -r SHA P _; do
            SHA=${SHA#[-+U]}
            SHORT=$(printf '%.8s' "$SHA")

            # A fetch failure is NOT an unreachable pointer, and reporting it as
            # one sends whoever is on call looking for a bad submodule commit
            # when the actual fault is the network or the credentials. The two
            # outcomes get two messages. `|| true` used to collapse them into
            # the same red.
            if ! submodule_fetch_published_refs "$P" 2>"$FETCH_ERR"; then
              echo "ERROR: could not fetch $P from origin — reachability is UNVERIFIED, not disproven."
              echo "  This is an infrastructure failure (network, credentials, or a renamed remote),"
              echo "  NOT evidence that the pinned commit is bad. Do not go looking for a bad pointer."
              sed 's/^/    /' "$FETCH_ERR"
              FAIL=1
              continue
            fi

            # The predicate itself lives in scripts/ci-guards.sh, where the
            # self-test in (f) can run it against a throwaway repo. It used to
            # be written out here, which is why (f) had no reachability row at
            # all — the one guard in this file with no way to go red.
            if commit_reachable_from_remote "$P" "$SHA" > "$CONTAINS"; then
              REACHABLE=yes
            else
              REACHABLE=no
            fi
            CONTAINED=$(tr '\n' ' ' < "$CONTAINS")

            submodule_clear_verify_refs "$P"

            if [ "$REACHABLE" = yes ]; then
              echo "  ok — $P at $SHORT, reachable from: $CONTAINED"
            else
              echo "ERROR: $P is pinned at $SHA, which is NOT reachable from any remote branch or tag."
              echo "  The pointer references a commit nobody else can fetch."
              FAIL=1
            fi
          done < "$SUBMODULES"

          rm -f "$SUBMODULES" "$FETCH_ERR" "$CONTAINS"
          [ "$FAIL" -eq 0 ] || exit 1
          echo "All submodule pointers are reachable."

      # -----------------------------------------------------------------------
      # (f) Self-test: prove the guards can FAIL.
      #
      # Every defect fixed in this file was the same shape — a check whose text
      # stated the rule while its mechanism excluded the violation. Reading
      # cannot find those. Only running the guard against a deliberately broken
      # input can, and that is what this step does.
      #
      # A guard with no red test is a guard trusted on faith. Three of them
      # here had never once gone red, and all three were broken.
      #
      # It sources scripts/ci-guards.sh — the SAME file every real gate above
      # sources. It used to re-type `tag_pinned`, the Dockerfile guard, the
      # Bun-only regex, the Sanctum pipeline and the JSON canonicaliser, so what
      # it proved was that the COPIES could fail. Change a real gate, or
      # fat-finger it, and this step stayed green over the broken original —
      # the exact "text stated the rule while its mechanism excluded the
      # violation" shape, reintroduced by the fix for it. A self-test that owns
      # a private copy of the thing under test is not a self-test.
      # -----------------------------------------------------------------------
      - name: Self-test — each guard must reject a known-bad fixture
        run: |
          # shellcheck disable=SC2016,SC2026,SC2059
          # All three are deliberate, and all three are about CONSTRUCTING
          # fixtures rather than running anything. SC2016: `$BUILDPLATFORM` and
          # a backticked `npm install` must reach the fixture LITERALLY, so
          # single quotes are the point. SC2026: the '"'"' dance is how a single
          # quote gets embedded in a single-quoted string. SC2059: `printf "$3"`
          # is intentional — the fixture argument IS the format string, because
          # it carries the \n escapes that turn one argument into a multi-line
          # Dockerfile. With these silenced, `shellcheck -s sh` is clean on this
          # block, which is what lets the POSIX claim in scripts/ci-guards.sh be
          # checked rather than asserted.
          set -e
          . ./scripts/ci-guards.sh

          # Same locale ceiling as step (d) — a SEPARATE shell process, so it
          # is not inherited; every locale-aware self-test row below needs it
          # set explicitly, the same "'en' alone would make an 'it' key an
          # unknown-locale failure" reasoning as step (d)'s own comment.
          export CI_LOCALES="en it"

          FIXTURE=$(mktemp -d)
          FAILED=0

          expect_caught() {
            # $1 = what is being tested, $2 = scan output (non-empty means caught)
            if [ -z "$2" ]; then
              echo "SELF-TEST FAILED: the $1 guard did NOT reject its known-bad fixture."
              echo "  The guard is decorative: it cannot detect the thing it exists to detect."
              FAILED=1
            else
              echo "  ok — $1 guard rejects a known violation"
            fi
          }

          # Each scanner fixture gets its OWN directory. The scanners carry the
          # real --include lists now rather than a self-test-local narrowing, so
          # a violating README dropped beside a clean NOTES.md would be found by
          # the false-positive row and fail it for the wrong reason.
          mkdir -p "$FIXTURE/bun-bad" "$FIXTURE/bun-heading" "$FIXTURE/bun-docker" \
                   "$FIXTURE/bun-prose" "$FIXTURE/bun-yaml-comment" \
                   "$FIXTURE/sanctum-bad" "$FIXTURE/sanctum-prose"

          # Bun-only: a real command, and a runner invocation.
          printf 'npm install\nnpx nuxi typecheck\n' > "$FIXTURE/bun-bad/README.md"
          expect_caught "Bun-only" "$(scan_bun_only "$FIXTURE/bun-bad")"

          # A MARKDOWN HEADING that instructs the reader to run npm. This is the
          # row that was missing while the guard was silently dropping it: the
          # comment filter treated a leading '#' as a comment in every file
          # type, but in Markdown it opens a heading. Markdown was added to this
          # guard precisely because both READMEs once shipped `npm install` as
          # their first instruction — the exact shape that was being deleted.
          printf '# npm install\n\nThen run the dev server.\n' > "$FIXTURE/bun-heading/README.md"
          expect_caught "Bun-only (Markdown heading)" "$(scan_bun_only "$FIXTURE/bun-heading")"

          # Dockerfiles ARE the install and build path for both Nuxt apps, and
          # they were not in the file list at all while the comment beside the
          # real gate read "No carve-outs."
          printf 'FROM oven/bun:1.4.0 AS builder\nRUN npm ci\n' > "$FIXTURE/bun-docker/Dockerfile"
          expect_caught "Bun-only (Dockerfile)" "$(scan_bun_only "$FIXTURE/bun-docker")"

          # Bun-only must NOT reject prose that merely NAMES the banned tools.
          printf 'npm, pnpm and yarn are not used here. Use bun.\n' > "$FIXTURE/bun-prose/NOTES.md"
          FALSE=$(scan_bun_only "$FIXTURE/bun-prose")
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the Bun-only guard rejects prose that merely NAMES the banned tools:"
            echo "$FALSE"
            FAILED=1
          else
            echo "  ok — Bun-only guard tolerates documentation of the rule"
          fi

          # ...and must still tolerate a real COMMENT, in a file type where '#'
          # really is one. This is the hit the exemption was added for: the
          # comment in each submodule's CI explaining why it STOPPED using npm.
          printf 'steps:\n  # was `npm install -g bun`, now setup-bun\n  - uses: oven-sh/setup-bun@v2\n' \
            > "$FIXTURE/bun-yaml-comment/ci.yml"
          FALSE=$(scan_bun_only "$FIXTURE/bun-yaml-comment")
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the Bun-only guard rejects a commented-out command in YAML:"
            echo "$FALSE"
            FAILED=1
          else
            echo "  ok — Bun-only guard tolerates a YAML comment describing the old command"
          fi

          # Image pinning — the same `tag_pinned` the compose gate and the
          # Dockerfile guard call, asserted on the forms that used to slip
          # through: a bare major with a suffix, and a variant that carries its
          # own version. Plus digests, which it used to REJECT.
          for BAD in redis:8-alpine node:24-alpine3.19 postgres:17 nginx:latest node; do
            if tag_pinned "$BAD"; then
              echo "SELF-TEST FAILED: the image-pin rule accepted $BAD."
              FAILED=1
            fi
          done
          for GOOD in redis:8.0-alpine pgvector/pgvector:0.8.0-pg17 axllent/mailpit:v1.22 beai-api:local \
                      node@sha256:9a1f2c3d4e5b6a7889900aabbccddeeff00112233445566778899aabbccddeeff \
                      node:24.11-slim@sha256:9a1f2c3d4e5b6a7889900aabbccddeeff00112233445566778899aabbccddeeff; do
            if ! tag_pinned "$GOOD"; then
              echo "SELF-TEST FAILED: the image-pin rule rejected $GOOD."
              FAILED=1
            fi
          done
          echo "  ok — image-pin rule: 5 rejected, 6 accepted (digests included)"

          # openapi drift: a single changed value anywhere in the document,
          # through the same `json_canonical_equal` the real gate uses.
          mkdir -p "$FIXTURE/a" "$FIXTURE/b"
          printf '{"paths":{"/x":{"get":{"summary":"one"}}}}' > "$FIXTURE/a/openapi.json"
          printf '{"paths":{"/x":{"get":{"summary":"two"}}}}' > "$FIXTURE/b/openapi.json"
          if json_canonical_equal "$FIXTURE/a/openapi.json" "$FIXTURE/b/openapi.json"; then
            echo "SELF-TEST FAILED: the openapi-drift guard called two different documents identical."
            FAILED=1
          else
            echo "  ok — openapi-drift guard rejects a known violation"
          fi

          # ...and must distinguish "not valid JSON" from "differs" — its own
          # docblock in scripts/ci-guards.sh claims exit 1 "including when
          # either file is missing or is not valid JSON" (now exit 2 for that
          # half), and that half had NO row here before this fix. An
          # uncaught JSON.parse throw and a real content mismatch used to
          # both exit 1, so a malformed file was reported with the exact same
          # wording as real drift — this is the row that proves the guard
          # itself, not just its callers, tells the two apart.
          printf '{"paths":{"/x":{"get":{"summary":"one"}' > "$FIXTURE/a/openapi-malformed.json"
          # Captured via if/else — see step (b)'s comment on why `cmd;
          # STATUS=$?` on separate lines is unsafe under `bash -e` (this
          # step sets it explicitly above, and Actions defaults to it too).
          if json_canonical_equal "$FIXTURE/a/openapi.json" "$FIXTURE/a/openapi-malformed.json" 2>/dev/null; then
            JSON_CMP_STATUS=0
          else
            JSON_CMP_STATUS=$?
          fi
          if [ "$JSON_CMP_STATUS" -eq 2 ]; then
            echo "  ok — openapi-drift guard distinguishes invalid JSON (exit 2) from real drift (exit 1)"
          else
            echo "SELF-TEST FAILED: the openapi-drift guard reported invalid JSON with exit $JSON_CMP_STATUS, not the distinct exit 2 for 'could not read'."
            FAILED=1
          fi

          # Sanctum — the sharpest rule in the standards ("JWT, NOT Sanctum")
          # and the most fragile mechanism in this repo: a -l pass piped through
          # xargs into a second grep. Untested, it was one pipe away from
          # silently passing everything.
          printf '{"require":{"laravel/sanctum":"^4.0"}}\n' > "$FIXTURE/sanctum-bad/composer.json"
          expect_caught "Sanctum" "$(scan_sanctum "$FIXTURE/sanctum-bad")"

          # ...and must still tolerate the phrasing the standards themselves use.
          printf 'Auth is JWT — NOT Sanctum.\n' > "$FIXTURE/sanctum-prose/composer.json"
          FALSE=$(scan_sanctum "$FIXTURE/sanctum-prose")
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the Sanctum guard rejects the standards' own wording:"
            echo "$FALSE"
            FAILED=1
          else
            echo "  ok — Sanctum guard tolerates 'NOT Sanctum'"
          fi

          # MySQL/MariaDB — via `scan_mysql`, which carries the real six
          # --include patterns, three --exclude-dir and five path filters. The
          # copy that used to live here was `grep -rl --include="*.php"`: adding
          # `--exclude-dir=api` to the real gate would have left this row green
          # over a guard that no longer looked at the API at all.
          mkdir -p "$FIXTURE/mysql-bad" "$FIXTURE/mysql-ok/api/config"
          printf "'"'"'mysql'"'"' => ['"'"'driver'"'"' => '"'"'mysql'"'"'],\n" > "$FIXTURE/mysql-bad/db.php"
          expect_caught "MySQL/MariaDB" "$(scan_mysql "$FIXTURE/mysql-bad")"

          # ...and must NOT flag the legitimate hit it excludes by path.
          # Laravel's stock config ships a block for every driver it supports.
          printf "'"'"'mysql'"'"' => ['"'"'driver'"'"' => '"'"'mysql'"'"'],\n" \
            > "$FIXTURE/mysql-ok/api/config/database.php"
          FALSE=$(scan_mysql "$FIXTURE/mysql-ok")
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the MySQL guard flags api/config/database.php, which it excludes by path:"
            echo "$FALSE"
            FAILED=1
          else
            echo "  ok — MySQL guard tolerates Laravel's stock multi-driver config"
          fi

          # Laravel 12 (we are on 13) — via `scan_laravel12`. The copy here used
          # `--include="notes.md"`, which is not a rule anybody wrote; it was a
          # fixture filename standing in for three real include patterns.
          mkdir -p "$FIXTURE/l12-bad" "$FIXTURE/l12-ok/legacy-demo"
          printf 'Laravel 12\n' > "$FIXTURE/l12-bad/notes.md"
          expect_caught "Laravel-12" "$(scan_laravel12 "$FIXTURE/l12-bad")"

          printf 'Laravel 12\n' > "$FIXTURE/l12-ok/legacy-demo/notes.md"
          FALSE=$(scan_laravel12 "$FIXTURE/l12-ok")
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the Laravel-12 guard flags legacy-demo, which it excludes by path:"
            echo "$FALSE"
            FAILED=1
          else
            echo "  ok — Laravel-12 guard tolerates the excluded legacy-demo tree"
          fi

          # The pgsql pin — a POSITIVE assertion, so its failure mode is the
          # line being ABSENT rather than present, and BOTH directions have to
          # be asserted. The row here used to check that a grep for
          # "DB_CONNECTION: pgsql" failed on a fixture that had never contained
          # the string. Of course it did. That exercised no mechanism at all and
          # would have stayed green with the guard deleted.
          printf 'services:\n  api:\n    environment:\n      DB_CONNECTION: mysql\n' \
            > "$FIXTURE/compose-wrong.yml"
          printf 'services:\n  api:\n    environment:\n      DB_CONNECTION: pgsql\n' \
            > "$FIXTURE/compose-right.yml"
          if compose_pins_pgsql "$FIXTURE/compose-wrong.yml"; then
            echo "SELF-TEST FAILED: the pgsql-pin check passed a compose file pinning mysql."
            FAILED=1
          else
            echo "  ok — pgsql-pin check rejects a compose file that pins another driver"
          fi
          if compose_pins_pgsql "$FIXTURE/compose-right.yml"; then
            echo "  ok — pgsql-pin check accepts a compose file that pins pgsql"
          else
            echo "SELF-TEST FAILED: the pgsql-pin check rejected a compose file that DOES pin pgsql."
            echo "  Inverted or dead: it cannot tell the two apart."
            FAILED=1
          fi

          # The compose service SET. `docker compose config -q` proves the file
          # parses and nothing more, so the "all 8 services" claim was asserted
          # by nothing — and guard (g) keeps Horizon deferred on the grounds
          # that two of those eight exist.
          if compose_service_diff "$CI_EXPECTED_COMPOSE_SERVICES" >/dev/null; then
            echo "  ok — compose service-set check accepts the expected set"
          else
            echo "SELF-TEST FAILED: the compose service-set check rejected its own expected set."
            FAILED=1
          fi
          BROKEN=$(printf '%s' "$CI_EXPECTED_COMPOSE_SERVICES" | sed 's/ scheduler//')
          if compose_service_diff "$BROKEN" >/dev/null; then
            echo "SELF-TEST FAILED: the compose service-set check accepted a set with 'scheduler' deleted."
            FAILED=1
          else
            echo "  ok — compose service-set check rejects a set with a service deleted"
          fi

          # The image-pin step's minimum-evidence guard: feed it the exact
          # zero-line count a compose-format change, a build-only service, or
          # the `image:` key moving would produce, and prove it now REJECTS
          # that (this is the row (f)'s own header promises for every guard —
          # a check whose text stated the rule while its mechanism excluded
          # the violation is exactly what an empty grep result used to be
          # here, before `compose_image_refs_present` existed).
          if compose_image_refs_present 0; then
            echo "SELF-TEST FAILED: the image-ref count guard accepted a count of 0 'image:' lines."
            echo "  This is the exact hazard it exists to catch: a green gate over no evidence."
            FAILED=1
          else
            echo "  ok — image-ref count guard rejects a count of 0 'image:' lines"
          fi
          if compose_image_refs_present 6; then
            echo "  ok — image-ref count guard accepts a plausible nonzero count"
          else
            echo "SELF-TEST FAILED: the image-ref count guard rejected a plausible nonzero count (6)."
            FAILED=1
          fi

          # The Dockerfile base-image guard, against every real Dockerfile idiom.
          # Each row here exists because an earlier version of that guard got it
          # wrong — the multi-stage reference, the BuildKit --platform flag, and
          # lowercase `from` all broke CI or slipped through, and only running
          # them showed it.
          df_case() {
            printf "$3" > "$FIXTURE/Dockerfile.case"
            if OFFENDER=$(df_guard "$FIXTURE/Dockerfile.case"); then GOT=pass; else GOT=fail; fi
            if [ "$GOT" = "$2" ]; then
              echo "  ok — Dockerfile guard: $1"
            else
              echo "SELF-TEST FAILED: Dockerfile guard on '$1' expected $2, got $GOT (offender: ${OFFENDER:-none})."
              FAILED=1
            fi
          }

          df_case "a pinned base"              pass 'FROM node:24.11-slim AS runtime\n'
          df_case "a floating base"            fail 'FROM node:24-slim AS runtime\n'
          df_case "a multi-stage reference"    pass 'FROM node:24.11-slim AS builder\nFROM builder AS runtime\n'
          df_case "a floating SECOND stage"    fail 'FROM node:24.11-slim AS builder\nFROM node:24-slim AS runtime\n'
          df_case "a --platform flag"          pass 'FROM --platform=$BUILDPLATFORM node:24.11-slim AS b\n'
          df_case "--platform + floating"      fail 'FROM --platform=$BUILDPLATFORM node:24-slim AS b\n'
          df_case "lowercase from"             fail 'from node:24-slim as runtime\n'
          df_case "a versioned VARIANT"        fail 'FROM node:24-alpine3.19\n'
          df_case "the :local convention"      pass 'FROM beai-api:local\n'
          # The row that was missing, and the hole it left open: `FROM node` has
          # no colon and no slash, so the old skip rule read it as a stage name
          # and waved it through. `FROM node` IS `node:latest` — the guard's
          # primary defect class, passing.
          df_case "an UNTAGGED base"           fail 'FROM node\n'
          df_case "untagged, stage declared later" fail 'FROM ubuntu\nFROM node:24.11-slim AS runtime\n'
          # ...while a bare word that IS a declared stage must still pass, which
          # is the whole reason the old rule existed. Case-insensitively,
          # because Docker lowercases stage names.
          df_case "a stage referenced by name" pass 'FROM node:24.11-slim AS Builder\nFROM builder AS runtime\n'
          # A digest is the strongest pin there is. Both guards used to call it
          # floating, because "the tag" was read as everything after the last
          # colon and a digest's hex has no dots in it.
          df_case "a digest pin"               pass 'FROM node@sha256:9a1f2c3d4e5b6a7889900aabbccddeeff00112233445566778899aabbccddeeff AS runtime\n'
          # `scratch` is Docker's reserved empty base, not an image reference.
          # It has no tag and cannot float.
          df_case "the scratch base"           pass 'FROM node:24.11-slim AS b\nFROM scratch AS runtime\n'

          # A missing file must FAIL, not pass quietly.
          if df_guard "$FIXTURE/Dockerfile.absent" >/dev/null; then
            echo "SELF-TEST FAILED: the Dockerfile guard passed on a file that does not exist."
            FAILED=1
          else
            echo "  ok — Dockerfile guard: a missing file"
          fi

          # ------------------------------------------------------------------
          # COPY --from= pinning — the SAME `df_copy_from_guard` the real
          # gate in step (a) calls, against fixtures built to trip it. This
          # is the construct df_guard never read at all: `COPY --from=latest`
          # and `COPY --from=composer:2` were floating tags hiding in plain
          # sight in api/Dockerfile while step (a) checked every FROM line
          # around them. Both directions proven — a floating image rejected,
          # a pinned image and a declared stage both accepted — the same
          # discipline df_guard's own rows above already follow.
          # ------------------------------------------------------------------
          df_copy_from_case() {
            printf "$3" > "$FIXTURE/Dockerfile.copyfrom.case"
            if OFFENDER=$(df_copy_from_guard "$FIXTURE/Dockerfile.copyfrom.case"); then GOT=pass; else GOT=fail; fi
            if [ "$GOT" = "$2" ]; then
              echo "  ok — COPY --from= guard: $1"
            else
              echo "SELF-TEST FAILED: COPY --from= guard on '$1' expected $2, got $GOT (offender: ${OFFENDER:-none})."
              FAILED=1
            fi
          }

          df_copy_from_case "a pinned image" \
            pass 'FROM alpine:3.20.3\nCOPY --from=composer:2.10.2 /usr/bin/composer /usr/bin/composer\n'
          # The exact api/Dockerfile shape before this fix: a bare-major tag,
          # not caught by anything, because nothing read COPY --from= at all.
          df_copy_from_case "a floating image (bare major)" \
            fail 'FROM alpine:3.20.3\nCOPY --from=composer:2 /usr/bin/composer /usr/bin/composer\n'
          df_copy_from_case "a floating image (latest)" \
            fail 'FROM alpine:3.20.3\nCOPY --from=mlocati/php-extension-installer:latest /usr/bin/install-php-extensions /usr/local/bin/\n'
          df_copy_from_case "a stage reference" \
            pass 'FROM alpine:3.20.3 AS builder\nFROM alpine:3.20.3 AS runtime\nCOPY --from=builder /app /app\n'
          # --from is not positional like FROM's reference — --chown can sit
          # on either side of it, and both orders must parse identically.
          df_copy_from_case "--from before --chown" \
            pass 'FROM alpine:3.20.3 AS builder\nFROM alpine:3.20.3 AS runtime\nCOPY --from=builder --chown=1000:1000 /app /app\n'
          df_copy_from_case "--from after --chown" \
            pass 'FROM alpine:3.20.3 AS builder\nFROM alpine:3.20.3 AS runtime\nCOPY --chown=1000:1000 --from=builder /app /app\n'
          # A COPY with no --from= at all copies from the build context, not
          # another stage or image — out of scope for this guard entirely.
          df_copy_from_case "a plain COPY with no --from=" \
            pass 'FROM alpine:3.20.3\nCOPY . .\n'

          if df_copy_from_guard "$FIXTURE/Dockerfile.copyfrom.absent" >/dev/null; then
            echo "SELF-TEST FAILED: the COPY --from= guard passed on a file that does not exist."
            FAILED=1
          else
            echo "  ok — COPY --from= guard: a missing file"
          fi

          # ...and every real Dockerfile in this repo must be clean, right
          # now — same discipline as every other control check proved
          # against the real tree above.
          for DF in api/Dockerfile frontend/Dockerfile backoffice/Dockerfile; do
            if ! REAL_OFFENDER=$(df_copy_from_guard "$DF"); then
              echo "SELF-TEST FAILED: $DF has a floating COPY --from= image: $REAL_OFFENDER."
              FAILED=1
            fi
          done
          echo "  ok — every committed Dockerfile's COPY --from= images are pinned"

          # ------------------------------------------------------------------
          # GitHub Actions `uses:` SHA-pinning — the SAME `workflow_action_pinned`
          # and `workflow_actions_guard` the real gate in step (a) calls. This
          # workflow ran under `actions/checkout@v4` and `oven-sh/setup-bun@v2`
          # while rejecting `redis:8-alpine` for the identical reason, one
          # section above. Both directions proven: a floating tag/branch/short
          # SHA rejected, a full commit SHA accepted.
          # ------------------------------------------------------------------
          for BAD in 'actions/checkout@v4' 'actions/checkout@main' \
                     'actions/checkout@11d5960' 'actions/checkout'; do
            if workflow_action_pinned "$BAD"; then
              echo "SELF-TEST FAILED: the action-pin rule accepted $BAD."
              FAILED=1
            fi
          done
          for GOOD in 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' \
                      'oven-sh/setup-bun@0C5077E51419868618AEAA5FE8019C62421857D6'; do
            if ! workflow_action_pinned "$GOOD"; then
              echo "SELF-TEST FAILED: the action-pin rule rejected $GOOD."
              FAILED=1
            fi
          done
          echo "  ok — action-pin rule: 4 rejected, 2 accepted (case-insensitive hex, full 40 chars only)"

          mkdir -p "$FIXTURE/wf-good" "$FIXTURE/wf-bad"
          printf 'jobs:\n  x:\n    steps:\n      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0\n      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0\n' \
            > "$FIXTURE/wf-good/ci.yml"
          printf 'jobs:\n  x:\n    steps:\n      - uses: actions/checkout@v4\n' \
            > "$FIXTURE/wf-bad/ci.yml"

          if OFFENDER=$(workflow_actions_guard "$FIXTURE/wf-bad/ci.yml"); then
            echo "SELF-TEST FAILED: the workflow actions guard accepted a floating tag ref: actions/checkout@v4."
            FAILED=1
          else
            echo "  ok — workflow actions guard rejects a floating tag ref (offender: $OFFENDER)"
          fi

          if workflow_actions_guard "$FIXTURE/wf-good/ci.yml" >/dev/null; then
            echo "  ok — workflow actions guard accepts fully SHA-pinned refs"
          else
            echo "SELF-TEST FAILED: the workflow actions guard rejected fully SHA-pinned refs."
            FAILED=1
          fi

          if workflow_actions_guard "$FIXTURE/wf-absent.yml" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the workflow actions guard passed on a file that does not exist."
            FAILED=1
          else
            echo "  ok — workflow actions guard fails closed on a missing file"
          fi

          # ...and this workflow file itself must be clean, right now — same
          # discipline as every other control check proved against the real
          # tree above.
          if OFFENDER=$(workflow_actions_guard .github/workflows/wrapper-ci.yml); then
            echo "  ok — .github/workflows/wrapper-ci.yml has every 'uses:' reference SHA-pinned"
          else
            echo "SELF-TEST FAILED: .github/workflows/wrapper-ci.yml has an unpinned 'uses:' reference: $OFFENDER"
            FAILED=1
          fi

          # The catalog gate: it must reject real drift, and must NOT reject two
          # files whose CONTENT is identical but whose bytes differ. That second
          # row is not padding — the first version of this gate reported every
          # file as differing because it never exported its variables, and only
          # a same-content fixture proves the comparison actually compares.
          printf '{"ICO":{"name":"Contributor"}}' > "$FIXTURE/cat-a.json"
          printf '{ "ICO" : { "name" : "Contributor" } }\n' > "$FIXTURE/cat-b.json"
          printf '{"ICO":{"name":"CHANGED"}}' > "$FIXTURE/cat-c.json"

          if json_canonical_equal "$FIXTURE/cat-a.json" "$FIXTURE/cat-b.json"; then
            echo "  ok — catalog gate ignores formatting"
          else
            echo "SELF-TEST FAILED: the catalog gate reported identical content as drift."
            FAILED=1
          fi

          if json_canonical_equal "$FIXTURE/cat-a.json" "$FIXTURE/cat-c.json"; then
            echo "SELF-TEST FAILED: the catalog gate accepted a real content change."
            FAILED=1
          else
            echo "  ok — catalog gate rejects a real content change"
          fi

          # Catalog COMPLETENESS, which parity cannot see: a role declared with
          # no BARS file behind it. This is the row that would have caught the
          # missing SRX.json years of green pipelines did not.
          #
          # Three branches, because the gate has three answers and only proving
          # one of them is how a known-gaps list turns into a mute switch. The
          # fixture list stands in for scripts/framework-known-gaps.txt via
          # CI_KNOWN_GAPS_FILE, so this exercises the SAME functions the real
          # gate calls, against a list whose contents this step controls.
          mkdir -p "$FIXTURE/cat-complete/bars" "$FIXTURE/cat-incomplete/bars" \
                   "$FIXTURE/cat-closed-gap/bars"
          printf '{"ICO":{"name":"Contributor"},"SRX":{"name":"Senior Executive"}}' \
            > "$FIXTURE/cat-complete/roles.json"
          printf '{}' > "$FIXTURE/cat-complete/bars/ICO.json"
          printf '{}' > "$FIXTURE/cat-complete/bars/SRX.json"
          cp "$FIXTURE/cat-complete/roles.json" "$FIXTURE/cat-incomplete/roles.json"
          printf '{}' > "$FIXTURE/cat-incomplete/bars/ICO.json"
          # Same list, but the exempted role's file has since been authored.
          cp "$FIXTURE/cat-complete/roles.json" "$FIXTURE/cat-closed-gap/roles.json"
          printf '{}' > "$FIXTURE/cat-closed-gap/bars/ICO.json"
          printf '{}' > "$FIXTURE/cat-closed-gap/bars/SRX.json"

          printf '# fixture list\nSRX   trailing comment must not be parsed\n' \
            > "$FIXTURE/known-gaps.txt"
          REAL_KNOWN_GAPS_FILE="$CI_KNOWN_GAPS_FILE"
          CI_KNOWN_GAPS_FILE="$FIXTURE/known-gaps.txt"
          export CI_KNOWN_GAPS_FILE

          # Branch 1 — a role missing BARS that is NOT on the list. Must fail.
          # BUL is not exempted anywhere, so adding it to roles.json is a
          # brand-new undeclared gap.
          printf '{"ICO":{"name":"Contributor"},"SRX":{"name":"Senior Executive"},"BUL":{"name":"Business Unit Leader"}}' \
            > "$FIXTURE/cat-incomplete/roles.json"
          expect_caught "unexempted-missing-BARS" "$(catalog_unexpected_missing_bars "$FIXTURE/cat-incomplete")"

          # Branch 2 — the exempted role alone. Must PASS: this is the state the
          # repository is actually in, and the gate has to be able to go green
          # in it or it will be deleted rather than obeyed.
          printf '{"ICO":{"name":"Contributor"},"SRX":{"name":"Senior Executive"}}' \
            > "$FIXTURE/cat-incomplete/roles.json"
          UNEXEMPTED=$(catalog_unexpected_missing_bars "$FIXTURE/cat-incomplete") || { echo "SELF-TEST FAILED: catalog_unexpected_missing_bars could not run."; FAILED=1; }
          if [ -n "$UNEXEMPTED" ]; then
            echo "SELF-TEST FAILED: the completeness check rejected a role covered by the known-gaps list: $UNEXEMPTED"
            FAILED=1
          else
            echo "  ok — completeness check accepts a role on the known-gaps list"
          fi

          # Branch 3 — the exemption outliving its gap. Must fail, or the list
          # accumulates permanent lies about the catalog.
          expect_caught "stale-gap-exemption" "$(catalog_stale_gap_exemptions "$FIXTURE/cat-closed-gap")"

          # ...and a fully authored catalog with nothing exempted must be clean
          # on both counts at once.
          printf '# fixture list, no entries\n' > "$FIXTURE/known-gaps.txt"
          MISSING="$(catalog_unexpected_missing_bars "$FIXTURE/cat-complete")$(catalog_stale_gap_exemptions "$FIXTURE/cat-complete")"
          if [ -n "$MISSING" ]; then
            echo "SELF-TEST FAILED: the completeness check flagged a complete catalog with an empty list: $MISSING"
            FAILED=1
          else
            echo "  ok — completeness check passes a complete catalog with an empty known-gaps list"
          fi

          # Point back at the committed list. Restored rather than unset,
          # because unsetting it would leave the functions reading an empty
          # path — a list with no entries, which is exactly the silently
          # permissive state this self-test exists to rule out.
          CI_KNOWN_GAPS_FILE="$REAL_KNOWN_GAPS_FILE"
          export CI_KNOWN_GAPS_FILE

          # The COMMITTED list must parse, and must not have rotted against the
          # real tree. Running it here as well as in (d) means a stale entry is
          # reported by the step whose job is proving guards work, not only by
          # the gate it would turn red.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            STALE=$(catalog_stale_gap_exemptions "$TREE") || { echo "SELF-TEST FAILED: catalog_stale_gap_exemptions could not run."; FAILED=1; }
            if [ -n "$STALE" ]; then
              echo "SELF-TEST FAILED: scripts/framework-known-gaps.txt exempts $STALE, but $TREE/bars/ now has the file."
              FAILED=1
            fi
          done
          echo "  ok — the committed known-gaps list has no entry that has outlived its gap"

          # ------------------------------------------------------------------
          # The per-pair competency coverage gate (bars-coverage-visibility).
          #
          # One level finer than the role-level fixtures above: a role's BARS
          # file can exist and still be PARTIAL, which the role-level check
          # cannot see — the file is there, so it passes. That was the real
          # state until bars-catalogue-completion (FLL/MLL 8 of 18, BUL 8 of
          # 14); every pair is anchored now, so these rows guard the
          # regression path.
          #
          # Every row below is required — "a guard nobody has watched fail is
          # not a guard".
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/pair-incomplete/bars" "$FIXTURE/pair-closed-gap/bars" \
                   "$FIXTURE/pair-empty-anchor/bars" "$FIXTURE/pair-orphan/bars" \
                   "$FIXTURE/pair-no-file/bars" "$FIXTURE/pair-malformed-bars/bars" \
                   "$FIXTURE/pair-malformed-comp/bars"

          REAL_COMPETENCY_GAPS_FILE="$CI_COMPETENCY_GAPS_FILE"

          # pair-incomplete: FLL declares [STG, PRS]; bars has STG only; the
          # fixture list exempts FLL:PRS. This is the state the real tree is
          # actually in for its partial-file roles, and the gate has to be
          # ABLE to go green in it or it will be deleted, not obeyed.
          printf '{"FLL":{"name":"Front Line Leader","competencies":["STG","PRS"]}}' \
            > "$FIXTURE/pair-incomplete/roles.json"
          printf '{"STG":["a","b","c"]}' > "$FIXTURE/pair-incomplete/bars/FLL.json"
          printf 'FLL:PRS\n' > "$FIXTURE/pair-gaps.txt"
          CI_COMPETENCY_GAPS_FILE="$FIXTURE/pair-gaps.txt"
          export CI_COMPETENCY_GAPS_FILE

          UNEXEMPTED=$(catalog_unexpected_missing_bars_pairs "$FIXTURE/pair-incomplete") || { echo "SELF-TEST FAILED: catalog_unexpected_missing_bars_pairs could not run."; FAILED=1; }
          if [ -n "$UNEXEMPTED" ]; then
            echo "SELF-TEST FAILED: the pair gate rejected a pair covered by the per-pair known-gaps list: $UNEXEMPTED"
            FAILED=1
          else
            echo "  ok — pair gate accepts a partial-file pair covered by the known-gaps list"
          fi

          # ...same tree, the list emptied: FLL:PRS is now an UNDECLARED gap.
          printf '# empty\n' > "$FIXTURE/pair-gaps.txt"
          expect_caught "pair-incomplete (list emptied)" \
            "$(catalog_unexpected_missing_bars_pairs "$FIXTURE/pair-incomplete")"

          # pair-closed-gap: the anchors have SINCE been authored, but the
          # exemption was never deleted.
          printf '{"FLL":{"name":"Front Line Leader","competencies":["STG","PRS"]}}' \
            > "$FIXTURE/pair-closed-gap/roles.json"
          printf '{"STG":["a","b","c"],"PRS":["d","e","f"]}' \
            > "$FIXTURE/pair-closed-gap/bars/FLL.json"
          printf 'FLL:PRS\n' > "$FIXTURE/pair-gaps.txt"
          expect_caught "pair-closed-gap" \
            "$(catalog_stale_competency_gap_exemptions "$FIXTURE/pair-closed-gap")"

          # Same fixture, one level finer: `stale_competency_gap_exemption_reason`
          # must name THIS pair's shape as "anchored" specifically — the
          # self-test header claims every guard rejects a known-bad fixture,
          # but until now only the "role-level" branch (below) was ever
          # exercised through this function. Calls the SAME function step (d)
          # calls, against the SAME fixture already proven above to be the
          # anchored shape — not a re-typed copy with its own filter.
          expect_caught "stale_competency_gap_exemption_reason names the anchored shape" \
            "$(stale_competency_gap_exemption_reason "$FIXTURE/pair-closed-gap" 'FLL:PRS' 2>/dev/null | grep -x 'anchored')"

          # pair-empty-anchor: "PRS": [] is a stub, not coverage — proves the
          # empty-array rule. No exemption listed, so it must be caught as a
          # plain undeclared gap, not silently accepted as covered.
          printf '{"FLL":{"name":"Front Line Leader","competencies":["STG","PRS"]}}' \
            > "$FIXTURE/pair-empty-anchor/roles.json"
          printf '{"STG":["a","b","c"],"PRS":[]}' > "$FIXTURE/pair-empty-anchor/bars/FLL.json"
          printf '# empty\n' > "$FIXTURE/pair-gaps.txt"
          expect_caught "pair-empty-anchor" \
            "$(catalog_unexpected_missing_bars_pairs "$FIXTURE/pair-empty-anchor")"

          # pair-orphan: roles.json no longer assigns PRS to FLL at all, but
          # the exemption was never deleted — proves the stale check's SECOND
          # direction (the pair itself is gone, not just anchored).
          printf '{"FLL":{"name":"Front Line Leader","competencies":["STG"]}}' \
            > "$FIXTURE/pair-orphan/roles.json"
          printf '{"STG":["a","b","c"]}' > "$FIXTURE/pair-orphan/bars/FLL.json"
          printf 'FLL:PRS\n' > "$FIXTURE/pair-gaps.txt"
          expect_caught "pair-orphan" \
            "$(catalog_stale_competency_gap_exemptions "$FIXTURE/pair-orphan")"

          # Same fixture, same reasoning as the anchored row above: proves
          # `stale_competency_gap_exemption_reason` itself names this pair's
          # shape "orphaned" — the second of the three shapes, against the
          # real function, not a duplicate with a narrower filter.
          expect_caught "stale_competency_gap_exemption_reason names the orphaned shape" \
            "$(stale_competency_gap_exemption_reason "$FIXTURE/pair-orphan" 'FLL:PRS' 2>/dev/null | grep -x 'orphaned')"

          # pair-role-no-file-exemption: the THIRD stale shape, caught by
          # NEITHER of the first two directions before this fix — a pair
          # naming a role that IS declared in roles.json (with the
          # competency assigned) but has NO bars/<ROLE>.json at all (this
          # was SRX's actual shape before bars-catalogue-completion Phase 6
          # authored bars/SRX.json; the fixture below keeps the SRX name for
          # continuity with that history, it is not a claim about the real
          # tree today). Proved BY CONSTRUCTION, all three cases in one
          # fixture: the mute case now caught, and the two already-caught
          # shapes stay caught.
          #   SRX:PRS -> role declared, competency assigned, no bars file at
          #              all -> the exact mute case. Must now be CAUGHT.
          #   ZZZ:PRS -> role does not exist in roles.json at all -> already
          #              caught (Direction 2, pair not declared).
          #   FLL     -> malformed line (no ':'), matches no declared pair
          #              -> already caught (Direction 2).
          mkdir -p "$FIXTURE/pair-role-no-file-exemption/bars"
          printf '{"SRX":{"name":"Senior Executive","competencies":["PRS"]}}' \
            > "$FIXTURE/pair-role-no-file-exemption/roles.json"
          printf 'SRX:PRS\nZZZ:PRS\nFLL\n' > "$FIXTURE/pair-gaps.txt"
          SRX_SHAPE_STALE=$(catalog_stale_competency_gap_exemptions "$FIXTURE/pair-role-no-file-exemption") || { echo "SELF-TEST FAILED: catalog_stale_competency_gap_exemptions could not run."; FAILED=1; }
          if printf '%s\n' "$SRX_SHAPE_STALE" | grep -qxF 'SRX:PRS' \
            && printf '%s\n' "$SRX_SHAPE_STALE" | grep -qxF 'ZZZ:PRS' \
            && printf '%s\n' "$SRX_SHAPE_STALE" | grep -qxF 'FLL'; then
            echo "  ok — stale-exemption guard catches a role-declared-but-no-bars-file exemption (SRX's shape), and still catches a nonexistent-role and a malformed-line entry in the same file"
          else
            echo "SELF-TEST FAILED: the stale-exemption guard did not catch all three shapes (SRX:PRS role-with-no-bars-file, ZZZ:PRS nonexistent-role, FLL malformed-line)."
            echo "  Got: $SRX_SHAPE_STALE"
            FAILED=1
          fi
          # ...and the pair-level MISSING gate must still stay silent on it —
          # this is a STALE-exemption defect, not an undeclared-gap one.
          SRX_SHAPE_UNEXPECTED=$(catalog_unexpected_missing_bars_pairs "$FIXTURE/pair-role-no-file-exemption") || { echo "SELF-TEST FAILED: catalog_unexpected_missing_bars_pairs could not run."; FAILED=1; }
          if [ -n "$SRX_SHAPE_UNEXPECTED" ]; then
            echo "SELF-TEST FAILED: the pair-level missing-bars gate reported a role with no bars file at all: $SRX_SHAPE_UNEXPECTED"
            FAILED=1
          else
            echo "  ok — the pair-level missing-bars gate stays silent on a role with no bars file (role-level gate's business, per pair-no-file below)"
          fi
          expect_caught "stale_competency_gap_exemption_reason names the role-level shape" \
            "$(stale_competency_gap_exemption_reason "$FIXTURE/pair-role-no-file-exemption" 'SRX:PRS' 2>/dev/null | grep -x 'role-level')"

          # The FOURTH contract, and the one step (d) branches on: for a pair
          # that is NOT actually stale — the `pair-incomplete` fixture above,
          # where FLL:PRS is a live, uncovered gap — the function must return
          # 1 AND print nothing. Both halves are asserted: printing something on
          # a "not stale" answer would tell an operator to delete an exemption
          # that is doing its job, and returning 0 would report a live gap as a
          # stale entry.
          #
          # Step (d) reads exit 1 as "not stale" and exit 2 as "could not read",
          # which is why 1 has to mean exactly one thing here. It used to
          # capture with `|| true`, flattening both into an empty string — and
          # this comment described that call site for a while after it was gone.
          #
          # Captured as `if VAR=$(cmd); then ... else ...`, the same shape (d)
          # itself uses: a bare `VAR=$(cmd)` would abort THIS script under
          # `set -e` the instant the function legitimately returns 1, printing
          # nothing and explaining nothing.
          if CI_SCGER_LIVE_OUT=$(stale_competency_gap_exemption_reason "$FIXTURE/pair-incomplete" 'FLL:PRS' 2>/dev/null); then
            CI_SCGER_LIVE_STATUS=0
          else
            CI_SCGER_LIVE_STATUS=$?
          fi
          if [ "$CI_SCGER_LIVE_STATUS" -eq 1 ] && [ -z "$CI_SCGER_LIVE_OUT" ]; then
            echo "  ok — stale_competency_gap_exemption_reason returns 1 with no output for a live (not-stale) gap"
          else
            echo "SELF-TEST FAILED: stale_competency_gap_exemption_reason did not honor the return-1/no-output contract for a live gap."
            echo "  Got: status=$CI_SCGER_LIVE_STATUS output='$CI_SCGER_LIVE_OUT'"
            FAILED=1
          fi

          # pair-no-file: a role with NO bars file at all. The pair gate must
          # emit NOTHING for it — that absence is the role-level gate's
          # question, and reporting it twice in two vocabularies is its own
          # defect, not extra safety.
          printf '{"SRX":{"name":"Senior Executive","competencies":["STG"]}}' \
            > "$FIXTURE/pair-no-file/roles.json"
          printf '# empty\n' > "$FIXTURE/pair-gaps.txt"
          NOFILE=$(catalog_missing_bars_pairs "$FIXTURE/pair-no-file") || { echo "SELF-TEST FAILED: catalog_missing_bars_pairs could not run."; FAILED=1; }
          if [ -n "$NOFILE" ]; then
            echo "SELF-TEST FAILED: the pair gate reported pairs for a role with no bars file at all: $NOFILE"
            echo "  That absence is the role-level gate's question, not this one's."
            FAILED=1
          else
            echo "  ok — pair gate stays silent on a role with no bars file (role-level gate's business)"
          fi

          # pair-malformed — bars/<ROLE>.json itself is an ARRAY, not an
          # object keyed by competency code. Must be non-zero, and the
          # failure must reach catalog_unexpected_missing_bars_pairs, not be
          # absorbed one layer up — mirrors the role-level `catalog_missing_bars`
          # / `catalog_unexpected_missing_bars` fail-closed rows below in this
          # same step (named, not line-numbered: numbers drift, names do not).
          printf '{"FLL":{"name":"Front Line Leader","competencies":["STG"]}}' \
            > "$FIXTURE/pair-malformed-bars/roles.json"
          printf '["not","an","object"]' > "$FIXTURE/pair-malformed-bars/bars/FLL.json"
          if catalog_missing_bars_pairs "$FIXTURE/pair-malformed-bars" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the pair gate reported SUCCESS on a bars file that is an ARRAY."
            FAILED=1
          else
            echo "  ok — pair gate fails closed when a bars file is not an object"
          fi
          if catalog_unexpected_missing_bars_pairs "$FIXTURE/pair-malformed-bars" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_unexpected_missing_bars_pairs swallowed a malformed bars file."
            FAILED=1
          else
            echo "  ok — the malformed-bars-file failure propagates to the function step (d) calls"
          fi

          # pair-malformed — roles.json's "competencies" is a STRING, not an
          # array. Must be non-zero.
          printf '{"FLL":{"name":"Front Line Leader","competencies":"STG"}}' \
            > "$FIXTURE/pair-malformed-comp/roles.json"
          if catalog_missing_bars_pairs "$FIXTURE/pair-malformed-comp" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the pair gate reported SUCCESS when a role's competencies field is not an ARRAY."
            FAILED=1
          else
            echo "  ok — pair gate fails closed when roles.json's competencies field is not an array"
          fi

          CI_COMPETENCY_GAPS_FILE="$REAL_COMPETENCY_GAPS_FILE"
          export CI_COMPETENCY_GAPS_FILE

          # The COMMITTED per-pair list must parse and must not have rotted
          # against the real tree, in both directions, on both trees — same
          # discipline as the role-level list just above.
          #
          # Both calls guarded with `if VAR=$(cmd); then ... else ...`, not
          # bare `VAR=$(cmd)`: both functions propagate a genuine "could not
          # read" failure via `return 1` (same contract catalog_unexpected_
          # missing_bars documents), and this whole step runs under `set -e`
          # (top of this step). A bare command substitution consuming either
          # one would abort THIS SELF-TEST mid-loop, printing nothing, the
          # instant it ever hit that failure — silent, unexplained, and the
          # same "note outliving its fact" defect class as the step (d) call
          # site this fix mirrors.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            if STALE=$(catalog_stale_competency_gap_exemptions "$TREE"); then
              if [ -n "$STALE" ]; then
                echo "SELF-TEST FAILED: scripts/framework-competency-gaps.txt exempts $STALE, but $TREE now covers it (or no longer declares it)."
                FAILED=1
              fi
            else
              echo "SELF-TEST FAILED: the per-pair stale-exemption check could not read $TREE."
              FAILED=1
            fi
            if UNDECLARED=$(catalog_unexpected_missing_bars_pairs "$TREE"); then
              if [ -n "$UNDECLARED" ]; then
                echo "SELF-TEST FAILED: $TREE has an undeclared role×competency gap not on scripts/framework-competency-gaps.txt: $UNDECLARED"
                FAILED=1
              fi
            else
              echo "SELF-TEST FAILED: the per-pair completeness check could not read $TREE."
              FAILED=1
            fi
          done
          echo "  ok — the committed per-pair known-gaps list matches the real tree in both directions"

          # ------------------------------------------------------------------
          # "Entries are grouped by role" (ci-pipeline spec's own
          # reviewability requirement) — previously true only by INSPECTION,
          # with no automated check anywhere. A fixture with roles
          # deliberately INTERLEAVED (FLL, then MLL, then back to FLL) proves
          # the guard actually detects the violation, then the COMMITTED file
          # is asserted clean the same way every other control-file property
          # above is.
          # ------------------------------------------------------------------
          printf 'FLL:PRS\nMLL:PRS\nFLL:JDG\n' > "$FIXTURE/pair-gaps.txt"
          CI_COMPETENCY_GAPS_FILE="$FIXTURE/pair-gaps.txt"
          export CI_COMPETENCY_GAPS_FILE
          expect_caught "per-pair known-gaps role grouping" \
            "$(competency_gaps_role_order_violations)"

          CI_COMPETENCY_GAPS_FILE="$REAL_COMPETENCY_GAPS_FILE"
          export CI_COMPETENCY_GAPS_FILE
          GROUPING_VIOLATIONS=$(competency_gaps_role_order_violations)
          if [ -n "$GROUPING_VIOLATIONS" ]; then
            echo "SELF-TEST FAILED: scripts/framework-competency-gaps.txt interleaves role(s): $GROUPING_VIOLATIONS"
            echo "  Every role's entries must be one contiguous block (ci-pipeline spec: 'entries are grouped by role')."
            FAILED=1
          else
            echo "  ok — the committed per-pair known-gaps list groups every role's entries contiguously"
          fi

          # ------------------------------------------------------------------
          # Shape completeness (bars-catalogue-completion): `bars_competency_keys`
          # calls a competency "covered" the moment its array is non-empty — a
          # one-indicator stub with an empty anchor passes it. This is the row
          # that proves `catalog_malformed_bars_entries` catches what that
          # cheaper test cannot, against a fixture carrying every distinct
          # malformed shape at once (one CALL, one fixture — a competency-per-
          # defect layout so a regression in any single check shows up as its
          # OWN named line rather than being masked by the others).
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/shape-bad/bars" "$FIXTURE/shape-good/bars"
          # Locale-map shape (framework-catalog-it-translations design D1):
          # every leaf is now {"en": "..."}, not a bare string. GOOD_ENTRY
          # below is the well-formed baseline every OTHER entry in this
          # fixture is a deliberate one-field mutation of.
          GOOD_ENTRY='{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"Great"},"3":{"en":"Ok"},"1":{"en":"Bad"}}}'
          printf '{
            "WRONGCOUNT": [%s, %s],
            "EMPTYIND": [{"indicator":{"en":""},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}, %s, %s],
            "WHITESPACE": [{"indicator":{"en":" leading space"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}, %s, %s],
            "MISSINGLEVEL": [{"indicator":{"en":"x"},"scale":{"5":{"en":"a"},"3":{"en":"b"}}}, %s, %s],
            "EXTRALEVEL": [{"indicator":{"en":"x"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"},"2":{"en":"d"}}}, %s, %s],
            "OLDSHAPE": [{"indicator":"bare string, pre-migration shape","scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}, %s, %s],
            "NOEN": [{"indicator":{"it":"solo italiano"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}, %s, %s],
            "UNKNOWNLOCALE": [{"indicator":{"en":"x","fr":"y"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}, %s, %s],
            "EMPTYARRAY": [],
            "OK": [%s, %s, %s]
          }' "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" \
             "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" \
             "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" \
             > "$FIXTURE/shape-bad/bars/TST.json"

          SHAPE_BAD=$(catalog_malformed_bars_entries "$FIXTURE/shape-bad" TST) || { echo "SELF-TEST FAILED: catalog_malformed_bars_entries could not run."; FAILED=1; }
          SHAPE_OK=1
          for REASON in "TST:WRONGCOUNT:count-2" "TST:EMPTYIND:missing-en" \
                        "TST:WHITESPACE:missing-en" "TST:MISSINGLEVEL:malformed-entry" \
                        "TST:EXTRALEVEL:malformed-entry" "TST:OLDSHAPE:not-a-locale-map" \
                        "TST:NOEN:missing-en" "TST:UNKNOWNLOCALE:unknown-locale-fr"; do
            if ! printf '%s\n' "$SHAPE_BAD" | grep -qxF "$REASON"; then
              echo "SELF-TEST FAILED: the shape guard did not report '$REASON' for its known-bad fixture."
              FAILED=1
              SHAPE_OK=0
            fi
          done
          if printf '%s\n' "$SHAPE_BAD" | grep -qxF 'TST:OK:malformed-entry'; then
            echo "SELF-TEST FAILED: the shape guard flagged 'TST:OK', a fully well-formed entry."
            FAILED=1
            SHAPE_OK=0
          fi
          if printf '%s\n' "$SHAPE_BAD" | grep -q '^TST:EMPTYARRAY:'; then
            echo "SELF-TEST FAILED: the shape guard flagged 'TST:EMPTYARRAY' — an empty array is a coverage stub"
            echo "  ('bars_competency_keys' already treats it as uncovered), not a malformed DECLARED entry."
            FAILED=1
            SHAPE_OK=0
          fi
          [ "$SHAPE_OK" -eq 1 ] && echo "  ok — shape guard catches wrong-count, empty-indicator, leading-whitespace, missing-level, extra-level, the pre-migration bare-string shape, a missing 'en' key and an unknown locale key — and leaves well-formed entries and coverage stubs alone"

          printf '{"OK": [%s, %s, %s]}' "$GOOD_ENTRY" "$GOOD_ENTRY" "$GOOD_ENTRY" > "$FIXTURE/shape-good/bars/TST.json"
          FALSE=$(catalog_malformed_bars_entries "$FIXTURE/shape-good" TST) || { echo "SELF-TEST FAILED: catalog_malformed_bars_entries could not run."; FAILED=1; }
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the shape guard flagged a fully well-formed bars file: $FALSE"
            FAILED=1
          else
            echo "  ok — shape guard passes a fully well-formed bars file"
          fi

          if catalog_malformed_bars_entries "$FIXTURE/shape-good" NOFILE >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the shape guard reported SUCCESS on a bars file that does not exist."
            FAILED=1
          else
            echo "  ok — shape guard fails closed on a missing bars file"
          fi

          # ...and the committed catalogue (both trees) must be shape-clean —
          # all 83 declared role×competency pairs.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            for BARS_FILE in "$TREE"/bars/*.json; do
              [ -e "$BARS_FILE" ] || continue
              ROLE=$(basename "$BARS_FILE" .json)
              MALFORMED=$(catalog_malformed_bars_entries "$TREE" "$ROLE") || { echo "SELF-TEST FAILED: catalog_malformed_bars_entries could not run."; FAILED=1; }
              if [ -n "$MALFORMED" ]; then
                echo "SELF-TEST FAILED: $TREE/bars/$ROLE.json has malformed entries: $MALFORMED"
                FAILED=1
              fi
            done
          done
          echo "  ok — the committed catalogue has no malformed anchor entries in either tree"

          # ------------------------------------------------------------------
          # Anchor word-count drift (bars-catalogue-completion, Phase 5): the
          # SAME function the real gate in step (d) calls,
          # `catalog_overlong_bars_anchors`, fed a fixture built to trip it —
          # one 19-word anchor, one word over the blocking ceiling. This is
          # the proof the max-18 guard actually FIRES. Phase 4's own
          # regression (anchors running 19-26 words) shipped clean through
          # every guard that existed before this one; a self-test that
          # re-typed a narrower length check here would prove a duplicate,
          # not this guard — this file's own header names that exact failure
          # shape.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/wc-long/bars" "$FIXTURE/wc-ico/bars" "$FIXTURE/wc-short/bars"

          WC_LONG_ANCHOR="Consistently drives results across every business unit in the organization even when individual markets face sudden and prolonged disruption"
          WC_OK_ANCHOR="Consistently drives results across every business unit in the organization even when individual markets face sudden prolonged disruption"
          printf '{"PRS": [{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"%s"},"3":{"en":"%s"},"1":{"en":"%s"}}}]}' \
            "$WC_LONG_ANCHOR" "$WC_OK_ANCHOR" "$WC_OK_ANCHOR" > "$FIXTURE/wc-long/bars/TST.json"

          expect_caught "anchor word-count ceiling (19-word fixture)" \
            "$(catalog_overlong_bars_anchors "$FIXTURE/wc-long" TST en)"
          WC_LONG_LINE=$(catalog_overlong_bars_anchors "$FIXTURE/wc-long" TST en) || { echo "SELF-TEST FAILED: catalog_overlong_bars_anchors could not run."; FAILED=1; }
          if [ "$WC_LONG_LINE" != "TST:PRS:5:en:19" ]; then
            echo "SELF-TEST FAILED: expected 'TST:PRS:5:en:19' from the 19-word fixture, got: $WC_LONG_LINE"
            FAILED=1
          else
            echo "  ok — the max-18 anchor guard reports the exact ROLE:COMP:LEVEL:LOCALE:WORDCOUNT for a 19-word anchor, and leaves its compliant 18-word siblings alone"
          fi

          # ICO exemption — the SAME fixture shape, deliberately over the
          # ceiling (22 words, ICO's own two-sentence register), called with
          # role ICO through the SAME function. Empty output proves the
          # exemption is a real skip INSIDE the function the real gate
          # calls, not a coincidence of a clean fixture. Also proven
          # LOCALE-BLIND (design D2 row 5): the same fixture, examined as
          # `it` with a deliberately LOW override ceiling that would
          # otherwise trip immediately, must still be empty.
          WC_ICO_ANCHOR="Recognizes symptoms that indicate underlying problems across multiple areas and consistently investigates root causes before proposing any corrective action for the team"
          printf '{"PRS": [{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"%s","it":"%s"},"3":{"en":"%s"},"1":{"en":"%s"}}}]}' \
            "$WC_ICO_ANCHOR" "$WC_ICO_ANCHOR" "$WC_ICO_ANCHOR" "$WC_ICO_ANCHOR" > "$FIXTURE/wc-ico/bars/ICO.json"
          FALSE=$(catalog_overlong_bars_anchors "$FIXTURE/wc-ico" ICO en) || { echo "SELF-TEST FAILED: catalog_overlong_bars_anchors could not run."; FAILED=1; }
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the max-18 guard fired on ICO, which is exempt (documented, different two-sentence register): $FALSE"
            FAILED=1
          else
            echo "  ok — the max-18 anchor guard exempts ICO explicitly, even against a fixture that would otherwise trip it"
          fi
          FALSE_IT=$(CI_ANCHOR_WORDCOUNT_MAX_IT=1 catalog_overlong_bars_anchors "$FIXTURE/wc-ico" ICO it)
          if [ -n "$FALSE_IT" ]; then
            echo "SELF-TEST FAILED: the max-18 guard's ICO exemption is not locale-blind — it examined an ICO 'it' anchor: $FALSE_IT"
            FAILED=1
          else
            echo "  ok — the max-18 anchor guard's ICO exemption is locale-blind: an ICO 'it' anchor is not examined even with a ceiling of 1"
          fi

          if catalog_overlong_bars_anchors "$FIXTURE/wc-long" NOFILE en >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the max-18 guard reported SUCCESS on a bars file that does not exist."
            FAILED=1
          else
            echo "  ok — max-18 guard fails closed on a missing bars file for a non-exempt role"
          fi

          # Per-locale ceiling, and fail-closed when unconfigured (design D3).
          #
          # The fail-closed half is exercised against locale 'fr', NOT 'it'.
          # It used to use 'it', which worked only while the Italian ceiling
          # was unmeasured; the Phase 4 pilot measured it (26 words) and gave
          # CI_ANCHOR_WORDCOUNT_MAX_IT a default, so 'it' can no longer reach
          # that branch and the row started asserting the opposite of what it
          # claimed. 'fr' has no constant at all, which is the real condition
          # under test — and pointing at a locale nobody has measured also
          # proves the mechanism generalises past the one locale it was
          # written for, rather than being an it-shaped special case.
          #
          # With a self-test override ceiling of 15, the same 22-word IT
          # anchor must be CAUGHT.
          printf '{"PRS": [{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"%s","it":"%s"},"3":{"en":"%s"},"1":{"en":"%s"}}}]}' \
            "$WC_LONG_ANCHOR" "uno due tre quattro cinque sei sette otto nove dieci undici dodici tredici quattordici quindici sedici diciassette diciotto diciannove venti ventuno ventidue" \
            "$WC_OK_ANCHOR" "$WC_OK_ANCHOR" > "$FIXTURE/wc-long/bars/TST.json"
          if catalog_overlong_bars_anchors "$FIXTURE/wc-long" TST fr >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_overlong_bars_anchors returned SUCCESS for locale 'fr' with NO measured ceiling configured — it must fail closed (design D3)."
            FAILED=1
          else
            echo "  ok — catalog_overlong_bars_anchors fails closed on an unconfigured locale ceiling, rather than silently passing or reusing the EN number"
          fi
          WC_LONG_IT_LINE=$(CI_ANCHOR_WORDCOUNT_MAX_IT=15 catalog_overlong_bars_anchors "$FIXTURE/wc-long" TST it)
          if [ "$WC_LONG_IT_LINE" != "TST:PRS:5:it:22" ]; then
            echo "SELF-TEST FAILED: expected 'TST:PRS:5:it:22' from the 22-word IT fixture with an overridden ceiling of 15, got: $WC_LONG_IT_LINE"
            FAILED=1
          else
            echo "  ok — with a measured IT ceiling configured, an over-ceiling IT anchor is caught by the SAME function the real gate calls"
          fi

          # The line design D1 names ("the guard that would go silently
          # blind"): a non-string 'it' value under the new shape must HARD
          # FAIL, never silently continue past it.
          printf '{"PRS": [{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"ok text here"},"3":{"en":"ok"},"1":{"en":"ok","it":12345}}}]}' \
            > "$FIXTURE/wc-long/bars/BADTYPE.json"
          if bars_anchor_word_counts "$FIXTURE/wc-long" BADTYPE >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: bars_anchor_word_counts returned SUCCESS on a non-string 'it' anchor value — it must hard-fail (design D1), not silently skip it."
            FAILED=1
          else
            echo "  ok — bars_anchor_word_counts hard-fails on a non-string locale value instead of silently skipping it (the exact 'silently blind' defect design D1 names)"
          fi

          # The floor: NON-BLOCKING report in step (d), same doctrine as the
          # hedge-rate line — but the FUNCTION still has to actually detect a
          # short anchor when fed one.
          WC_SHORT_ANCHOR="Fails to plan ahead"
          printf '{"PRS": [{"indicator":{"en":"Do the thing"},"scale":{"5":{"en":"%s"},"3":{"en":"%s"},"1":{"en":"%s"}}}]}' \
            "$WC_OK_ANCHOR" "$WC_OK_ANCHOR" "$WC_SHORT_ANCHOR" > "$FIXTURE/wc-short/bars/TST.json"
          expect_caught "anchor word-count floor (non-blocking report)" \
            "$(catalog_short_bars_anchors "$FIXTURE/wc-short" TST en)"
          WC_SHORT_LINE=$(catalog_short_bars_anchors "$FIXTURE/wc-short" TST en) || { echo "SELF-TEST FAILED: catalog_short_bars_anchors could not run."; FAILED=1; }
          if [ "$WC_SHORT_LINE" != "TST:PRS:1:en:4" ]; then
            echo "SELF-TEST FAILED: expected 'TST:PRS:1:en:4' from the 4-word fixture, got: $WC_SHORT_LINE"
            FAILED=1
          else
            echo "  ok — the floor report names the exact ROLE:COMP:LEVEL:LOCALE:WORDCOUNT for a short anchor"
          fi

          if catalog_short_bars_anchors "$FIXTURE/wc-long" NOFILE en >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the floor report reported SUCCESS on a bars file that does not exist."
            FAILED=1
          else
            echo "  ok — floor report fails closed on a missing bars file"
          fi

          # ...and every bars file the glob reads (the leader files FLL, MLL,
          # BUL and SRX, materialised in bars-catalogue-completion Phase 6, plus
          # any declared non-role catalogue such as POTENTIAL.json — none staged,
          # none exempt from any gate) must be
          # clean against the blocking ceiling. ICO is skipped by the guard's
          # own exemption, not by this loop.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            for BARS_FILE in "$TREE"/bars/*.json; do
              [ -e "$BARS_FILE" ] || continue
              ROLE=$(basename "$BARS_FILE" .json)
              OVERLONG=$(catalog_overlong_bars_anchors "$TREE" "$ROLE") || { echo "SELF-TEST FAILED: could not read $TREE/bars/$ROLE.json for the anchor ceiling."; FAILED=1; }
              if [ -n "$OVERLONG" ]; then
                echo "SELF-TEST FAILED: $TREE/bars/$ROLE.json has anchor(s) over the 18-word ceiling: $OVERLONG"
                FAILED=1
              fi
            done
          done
          echo "  ok — the committed catalogue (ICO exempt) has no anchor over the 18-word ceiling"

          # ------------------------------------------------------------------
          # Cross-role anchor identity (bars-catalogue-completion): the same
          # function the real gate calls, against a fixture built to trip it —
          # two roles sharing one indicator string for the SAME competency —
          # and two fixtures built to prove it does NOT over-fire: the same
          # string reused for a DIFFERENT competency, and a string repeated
          # only WITHIN one role's own file.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/xrole-dup/bars" "$FIXTURE/xrole-clean/bars"
          printf '{"PRS": [{"indicator":{"en":"Shared sentence"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}]}' \
            > "$FIXTURE/xrole-dup/bars/AAA.json"
          printf '{"PRS": [{"indicator":{"en":"Shared sentence"},"scale":{"5":{"en":"d"},"3":{"en":"e"},"1":{"en":"f"}}}]}' \
            > "$FIXTURE/xrole-dup/bars/BBB.json"
          expect_caught "cross-role anchor identity" "$(catalog_crossrole_duplicates "$FIXTURE/xrole-dup")"
          DUP_LINE=$(catalog_crossrole_duplicates "$FIXTURE/xrole-dup") || { echo "SELF-TEST FAILED: catalog_crossrole_duplicates could not run."; FAILED=1; }
          if [ "$DUP_LINE" != "AAA:BBB:PRS:en:indicator" ]; then
            echo "SELF-TEST FAILED: expected 'AAA:BBB:PRS:en:indicator', got: $DUP_LINE"
            FAILED=1
          else
            echo "  ok — cross-role guard names the exact ROLE_A:ROLE_B:COMP:LOCALE:FIELD tuple, roles alphabetised"
          fi

          # Same string, DIFFERENT competency in each role — must NOT fire:
          # the guard's unit is per-competency, not a whole-catalogue string pool.
          printf '{"PRS": [{"indicator":{"en":"Shared sentence"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}]}' \
            > "$FIXTURE/xrole-clean/bars/AAA.json"
          printf '{"STG": [{"indicator":{"en":"Shared sentence"},"scale":{"5":{"en":"d"},"3":{"en":"e"},"1":{"en":"f"}}}]}' \
            > "$FIXTURE/xrole-clean/bars/BBB.json"
          FALSE=$(catalog_crossrole_duplicates "$FIXTURE/xrole-clean") || { echo "SELF-TEST FAILED: catalog_crossrole_duplicates could not run."; FAILED=1; }
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the cross-role guard fired on the same string under DIFFERENT competencies: $FALSE"
            FAILED=1
          else
            echo "  ok — cross-role guard does not fire on the same string under different competencies"
          fi

          # THE line design D1 names for this guard too: a non-locale-map
          # value used to be silently `continue`d past
          # (`typeof val !== "string" ... continue`), which under the new
          # shape would let the whole tree pass vacuously. It is now a hard
          # failure.
          mkdir -p "$FIXTURE/xrole-oldshape/bars"
          printf '{"PRS": [{"indicator":"bare string, pre-migration shape","scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}}]}' \
            > "$FIXTURE/xrole-oldshape/bars/AAA.json"
          if catalog_crossrole_duplicates "$FIXTURE/xrole-oldshape" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_crossrole_duplicates returned SUCCESS on a pre-migration bare-string indicator — it must hard-fail (design D1), not silently skip it."
            FAILED=1
          else
            echo "  ok — cross-role guard hard-fails on a non-locale-map value instead of silently skipping it (the exact 'silently blind' defect design D1 names)"
          fi

          # A string repeated twice WITHIN one role's own file must not fire —
          # "identical across roles" (the spec's own wording), not within one.
          # A DEDICATED, single-role fixture directory — reusing xrole-clean
          # (which already has AAA and BBB) would itself introduce a real
          # cross-role duplicate the moment a third file lands beside them,
          # testing nothing about the within-one-role case specifically.
          mkdir -p "$FIXTURE/xrole-within/bars"
          printf '{"PRS": [{"indicator":{"en":"Same sentence twice"},"scale":{"5":{"en":"a"},"3":{"en":"b"},"1":{"en":"c"}}},{"indicator":{"en":"Same sentence twice"},"scale":{"5":{"en":"d"},"3":{"en":"e"},"1":{"en":"f"}}}]}' \
            > "$FIXTURE/xrole-within/bars/AAA.json"
          FALSE=$(catalog_crossrole_duplicates "$FIXTURE/xrole-within") || { echo "SELF-TEST FAILED: catalog_crossrole_duplicates could not run."; FAILED=1; }
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the cross-role guard fired on a string repeated within a single role's own file: $FALSE"
            FAILED=1
          else
            echo "  ok — cross-role guard does not fire on a string repeated within a single role's own file"
          fi

          if catalog_crossrole_duplicates "$FIXTURE/no-such-dir" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the cross-role guard reported SUCCESS on a tree with no bars/ directory."
            FAILED=1
          else
            echo "  ok — cross-role guard fails closed on a missing bars/ directory"
          fi

          # The baseline exemption, both directions — same doctrine proof as
          # the known-gaps and competency-gaps fixtures above, against
          # CI_CROSSROLE_BASELINE_FILE's own override seam.
          REAL_CROSSROLE_BASELINE_FILE="$CI_CROSSROLE_BASELINE_FILE"
          printf 'AAA:BBB:PRS:en:indicator\n' > "$FIXTURE/xrole-baseline.txt"
          CI_CROSSROLE_BASELINE_FILE="$FIXTURE/xrole-baseline.txt"
          export CI_CROSSROLE_BASELINE_FILE

          UNEXPECTED=$(catalog_unexpected_crossrole_duplicates "$FIXTURE/xrole-dup") || { echo "SELF-TEST FAILED: catalog_unexpected_crossrole_duplicates could not run."; FAILED=1; }
          if [ -n "$UNEXPECTED" ]; then
            echo "SELF-TEST FAILED: the cross-role guard rejected a duplicate covered by the baseline: $UNEXPECTED"
            FAILED=1
          else
            echo "  ok — cross-role guard accepts a duplicate covered by the baseline"
          fi

          printf '# empty\n' > "$FIXTURE/xrole-baseline.txt"
          expect_caught "cross-role duplicate not on the baseline" \
            "$(catalog_unexpected_crossrole_duplicates "$FIXTURE/xrole-dup")"

          printf 'AAA:BBB:PRS:en:indicator\n' > "$FIXTURE/xrole-baseline.txt"
          expect_caught "stale cross-role baseline entry" \
            "$(catalog_stale_crossrole_baseline_entries "$FIXTURE/xrole-clean")"

          CI_CROSSROLE_BASELINE_FILE="$REAL_CROSSROLE_BASELINE_FILE"
          export CI_CROSSROLE_BASELINE_FILE

          # ...and the COMMITTED baseline must match the real tree in both
          # directions, on both trees — same discipline as every other
          # control file proved above. New pairs added by this change may
          # add ZERO entries: this must stay exactly the two pre-existing
          # duplicates the baseline's header names, forever.
          #
          # Same guard shape as the per-pair loop above, for the same reason:
          # both functions propagate `catalog_crossrole_duplicates`'s "could
          # not read $TREE/bars" failure via `return 1`, and a bare
          # `VAR=$(cmd)` would abort this self-test mid-loop under `set -e`.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            if NEW_DUP=$(catalog_unexpected_crossrole_duplicates "$TREE"); then
              if [ -n "$NEW_DUP" ]; then
                echo "SELF-TEST FAILED: $TREE has a cross-role duplicate not on scripts/framework-crossrole-baseline.txt: $NEW_DUP"
                FAILED=1
              fi
            else
              echo "SELF-TEST FAILED: the cross-role duplicate check could not read $TREE/bars/*.json."
              FAILED=1
            fi
            if STALE_DUP=$(catalog_stale_crossrole_baseline_entries "$TREE"); then
              if [ -n "$STALE_DUP" ]; then
                echo "SELF-TEST FAILED: scripts/framework-crossrole-baseline.txt has a stale entry against $TREE: $STALE_DUP"
                FAILED=1
              fi
            else
              echo "SELF-TEST FAILED: the stale cross-role baseline check could not read $TREE/bars/*.json."
              FAILED=1
            fi
          done
          echo "  ok — the committed cross-role baseline matches the real tree in both directions, on both trees"

          # ------------------------------------------------------------------
          # Cross-locale duplicate divergence (framework-catalog-it-translations
          # design D2a) — the SAME function catalog_crosslocale_duplicate_
          # divergence step (d) calls, fed fixtures built to trip BOTH
          # directions, plus a clean faithful-translation fixture that must
          # NOT fire.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/xlocale-diverge/bars" "$FIXTURE/xlocale-converge/bars" "$FIXTURE/xlocale-clean/bars"

          printf '{"INF": [{"indicator":{"en":"Identify the motives and objectives","it":"Individuare i motivi e gli obiettivi"},"scale":{"5":{"en":"a5"},"3":{"en":"a3"},"1":{"en":"a1"}}}]}' \
            > "$FIXTURE/xlocale-diverge/bars/AAA.json"
          printf '{"INF": [{"indicator":{"en":"Identify the motives and objectives","it":"COMPLETAMENTE DIVERSO"},"scale":{"5":{"en":"a5b"},"3":{"en":"a3b"},"1":{"en":"a1b"}}}]}' \
            > "$FIXTURE/xlocale-diverge/bars/BBB.json"
          expect_caught "cross-locale divergence (EN identical, IT diverges)" \
            "$(catalog_crosslocale_duplicate_divergence "$FIXTURE/xlocale-diverge")"
          DIVERGE_LINE=$(catalog_crosslocale_duplicate_divergence "$FIXTURE/xlocale-diverge") || { echo "SELF-TEST FAILED: catalog_crosslocale_duplicate_divergence could not run."; FAILED=1; }
          if [ "$DIVERGE_LINE" != "AAA:BBB:INF:indicator:diverges-though-en-identical" ]; then
            echo "SELF-TEST FAILED: expected 'AAA:BBB:INF:indicator:diverges-though-en-identical', got: $DIVERGE_LINE"
            FAILED=1
          else
            echo "  ok — cross-locale guard catches Italian diverging where English is byte-identical (an improved/altered translation)"
          fi

          printf '{"RES": [{"indicator":{"en":"Handle mistakes constructively","it":"Gestire gli errori in modo costruttivo"},"scale":{"5":{"en":"a5"},"3":{"en":"a3"},"1":{"en":"a1"}}}]}' \
            > "$FIXTURE/xlocale-converge/bars/AAA.json"
          printf '{"RES": [{"indicator":{"en":"A completely different English sentence","it":"Gestire gli errori in modo costruttivo"},"scale":{"5":{"en":"a5b"},"3":{"en":"a3b"},"1":{"en":"a1b"}}}]}' \
            > "$FIXTURE/xlocale-converge/bars/BBB.json"
          CONVERGE_LINE=$(catalog_crosslocale_duplicate_divergence "$FIXTURE/xlocale-converge") || { echo "SELF-TEST FAILED: catalog_crosslocale_duplicate_divergence could not run."; FAILED=1; }
          if [ "$CONVERGE_LINE" != "AAA:BBB:RES:indicator:converges-though-en-differs" ]; then
            echo "SELF-TEST FAILED: expected 'AAA:BBB:RES:indicator:converges-though-en-differs', got: $CONVERGE_LINE"
            FAILED=1
          else
            echo "  ok — cross-locale guard catches Italian converging where English differs (a flattened translation) — the mirror direction"
          fi

          printf '{"INF": [{"indicator":{"en":"Identify the motives and objectives","it":"Individuare i motivi e gli obiettivi"},"scale":{"5":{"en":"a5"},"3":{"en":"a3"},"1":{"en":"a1"}}}]}' \
            > "$FIXTURE/xlocale-clean/bars/AAA.json"
          printf '{"INF": [{"indicator":{"en":"Identify the motives and objectives","it":"Individuare i motivi e gli obiettivi"},"scale":{"5":{"en":"a5b"},"3":{"en":"a3b"},"1":{"en":"a1b"}}}]}' \
            > "$FIXTURE/xlocale-clean/bars/BBB.json"
          FALSE=$(catalog_crosslocale_duplicate_divergence "$FIXTURE/xlocale-clean") || { echo "SELF-TEST FAILED: catalog_crosslocale_duplicate_divergence could not run."; FAILED=1; }
          if [ -n "$FALSE" ]; then
            echo "SELF-TEST FAILED: the cross-locale guard fired on a faithful translation of an identical EN pair: $FALSE"
            FAILED=1
          else
            echo "  ok — cross-locale guard does not fire on a faithful translation (IT identical where EN is identical)"
          fi

          # ...and the committed catalogue (fully translated: metadata and anchors alike, in this
          # change) must be clean — empty output is the correct, current state.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            DIVERGENCE=$(catalog_crosslocale_duplicate_divergence "$TREE") || { echo "SELF-TEST FAILED: catalog_crosslocale_duplicate_divergence could not run."; FAILED=1; }
            if [ -n "$DIVERGENCE" ]; then
              echo "SELF-TEST FAILED: $TREE has a cross-locale divergence: $DIVERGENCE"
              FAILED=1
            fi
          done
          echo "  ok — the committed catalogue has no cross-locale divergence (metadata and anchors are both fully translated)"

          # ------------------------------------------------------------------
          # roles.json / competencies.json locale-map shape
          # (framework-catalog-it-translations design D2 row 8).
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/meta-shape-bad"
          printf '{"PRS": {"name": "bare string, pre-migration shape", "definition": {"en":"ok"}}, "STG": {"name": {"en":"ok"}, "definition": {"en":"ok","es":"unknown locale"}}}' \
            > "$FIXTURE/meta-shape-bad/competencies.json"
          printf '{"ICO": {"name": {"en":"Individual Contributor"}, "responsibilities": {"en":""}, "competencies": ["PRS","STG"]}, "FLL": {"name": {"en":"  "}, "responsibilities": {"en":"ok"}, "competencies": ["PRS"]}}' \
            > "$FIXTURE/meta-shape-bad/roles.json"
          META_BAD=$(catalog_meta_locale_shape "$FIXTURE/meta-shape-bad") || { echo "SELF-TEST FAILED: catalog_meta_locale_shape could not run."; FAILED=1; }
          META_OK=1
          for REASON in "COMPETENCIES:PRS:name:not-a-locale-map" "COMPETENCIES:STG:definition:unknown-locale-es" "ROLES:FLL:name:missing-en"; do
            if ! printf '%s\n' "$META_BAD" | grep -qxF "$REASON"; then
              echo "SELF-TEST FAILED: the meta-locale-shape guard did not report '$REASON' for its known-bad fixture."
              FAILED=1
              META_OK=0
            fi
          done
          if printf '%s\n' "$META_BAD" | grep -q '^ROLES:ICO:responsibilities:'; then
            echo "SELF-TEST FAILED: the meta-locale-shape guard flagged ICO's empty EN responsibilities — a blank 'en' is the documented, legitimate 'not yet authored' sentinel for this ONE field."
            FAILED=1
            META_OK=0
          fi
          [ "$META_OK" -eq 1 ] && echo "  ok — meta-locale-shape guard catches a bare-string field, an unknown locale key and a whitespace-only name — and allows a blank EN responsibilities (the documented fill-empty sentinel) alone"

          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            SHAPE=$(catalog_meta_locale_shape "$TREE") || { echo "SELF-TEST FAILED: catalog_meta_locale_shape could not run."; FAILED=1; }
            if [ -n "$SHAPE" ]; then
              echo "SELF-TEST FAILED: $TREE has a malformed roles.json/competencies.json locale field: $SHAPE"
              FAILED=1
            fi
          done
          echo "  ok — the committed roles.json/competencies.json are locale-shape-clean in both trees"

          # ------------------------------------------------------------------
          # roles.json / competencies.json locale COMPLETENESS — the 50-
          # string gap. Two directions: the guard must CATCH a field missing
          # a locale CI_LOCALES expects (while still honoring the
          # responsibilities blank-en sentinel, not contradicting it), and
          # it must FAIL CLOSED — nonzero exit, not a clean report — on input
          # too malformed to even ask the question of.
          #
          # Calls catalog_meta_locale_completeness directly — the SAME
          # function the real gate in step (d) calls — against fixtures
          # built to trip it, not a re-typed narrower copy of its logic.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/meta-completeness-bad"
          printf '{"PRS": {"name": {"en":"Problem Solving"}, "definition": {"en":"d","it":"d"}}, "STG": {"name": {"en":"Strategy","it":"Strategia"}, "definition": {"en":"d"}}}' \
            > "$FIXTURE/meta-completeness-bad/competencies.json"
          printf '{"ICO": {"name": {"en":"Individual Contributor","it":"Collaboratore individuale"}, "responsibilities": {"en":""}, "competencies": ["PRS"]}, "FLL": {"name": {"en":"Front Line Leader"}, "responsibilities": {"en":"x","it":"x"}, "competencies": ["PRS"]}, "MLL": {"name": {"en":"x","it":"x"}, "responsibilities": {"en":"authored, no it yet"}, "competencies": ["PRS"]}}' \
            > "$FIXTURE/meta-completeness-bad/roles.json"
          COMPLETE_BAD=$(catalog_meta_locale_completeness "$FIXTURE/meta-completeness-bad") || { echo "SELF-TEST FAILED: catalog_meta_locale_completeness could not run."; FAILED=1; }
          COMPLETE_OK=1
          for REASON in "COMPETENCIES:PRS:name:missing-it" "COMPETENCIES:STG:definition:missing-it" "ROLES:FLL:name:missing-it" "ROLES:MLL:responsibilities:missing-it"; do
            if ! printf '%s\n' "$COMPLETE_BAD" | grep -qxF "$REASON"; then
              echo "SELF-TEST FAILED: the meta-locale-completeness guard did not report '$REASON' for its known-bad fixture. Got:"
              printf '%s\n' "$COMPLETE_BAD"
              FAILED=1
              COMPLETE_OK=0
            fi
          done
          if printf '%s\n' "$COMPLETE_BAD" | grep -q '^ROLES:ICO:responsibilities:'; then
            echo "SELF-TEST FAILED: the meta-locale-completeness guard flagged ICO's blank-EN responsibilities as an incomplete translation — a blank 'en' is the documented 'role not yet authored' sentinel (FrameworkGap kind=n), and this guard must agree with catalog_meta_locale_shape's own decision to skip it, not contradict it."
            FAILED=1
            COMPLETE_OK=0
          fi
          [ "$COMPLETE_OK" -eq 1 ] && echo "  ok — meta-locale-completeness guard catches a competency name and definition each missing 'it', a role name missing 'it', and an AUTHORED responsibilities field missing 'it' — and still leaves the blank-EN 'not yet authored' sentinel alone"

          mkdir -p "$FIXTURE/meta-completeness-notobject" "$FIXTURE/meta-completeness-noen"
          printf '{"PRS": {"name": "bare string, pre-migration shape", "definition": {"en":"d","it":"d"}}}' \
            > "$FIXTURE/meta-completeness-notobject/competencies.json"
          printf '{"ICO": {"name": {"en":"x","it":"x"}, "responsibilities": {"en":"x","it":"x"}, "competencies": []}}' \
            > "$FIXTURE/meta-completeness-notobject/roles.json"
          if catalog_meta_locale_completeness "$FIXTURE/meta-completeness-notobject" >"$FIXTURE/meta-completeness-notobject.out" 2>"$FIXTURE/meta-completeness-notobject.err"; then
            echo "SELF-TEST FAILED: the meta-locale-completeness guard returned SUCCESS on a translatable field that is a bare string, not a locale-map object. It must fail closed instead of reading malformed input as complete. stdout was:"
            cat "$FIXTURE/meta-completeness-notobject.out"
            FAILED=1
          else
            echo "  ok — meta-locale-completeness guard fails closed (nonzero exit) on a translatable field that is not an object:"
            sed 's/^/    /' "$FIXTURE/meta-completeness-notobject.err"
          fi

          printf '{"PRS": {"name": {"en":"Problem Solving","it":"x"}, "definition": {"en":"d","it":"d"}}}' \
            > "$FIXTURE/meta-completeness-noen/competencies.json"
          printf '{"ICO": {"name": {"en":"x","it":"x"}, "responsibilities": {"it":"present but en is entirely absent"}, "competencies": []}}' \
            > "$FIXTURE/meta-completeness-noen/roles.json"
          if catalog_meta_locale_completeness "$FIXTURE/meta-completeness-noen" >"$FIXTURE/meta-completeness-noen.out" 2>"$FIXTURE/meta-completeness-noen.err"; then
            echo "SELF-TEST FAILED: the meta-locale-completeness guard returned SUCCESS on a responsibilities field with no 'en' key at all (not even a blank one — the sentinel requires en to be PRESENT and empty, not absent). It must fail closed. stdout was:"
            cat "$FIXTURE/meta-completeness-noen.out"
            FAILED=1
          else
            echo "  ok — meta-locale-completeness guard fails closed (nonzero exit) on a field whose 'en' is absent rather than blank:"
            sed 's/^/    /' "$FIXTURE/meta-completeness-noen.err"
          fi

          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            COMPLETE=$(catalog_meta_locale_completeness "$TREE") || { echo "SELF-TEST FAILED: could not read $TREE for locale-map completeness."; FAILED=1; }
            if [ -n "$COMPLETE" ]; then
              echo "SELF-TEST FAILED: $TREE has an incomplete roles.json/competencies.json translation: $COMPLETE"
              FAILED=1
            fi
          done
          echo "  ok — the committed roles.json/competencies.json are fully translated (en+it) in both trees"

          # ------------------------------------------------------------------
          # Partial IT-coverage control file (framework-catalog-it-translations
          # design D6) — scripts/framework-locale-gaps.txt's own both-direction
          # doctrine, plus the whole-role rule, against CI_LOCALE_GAPS_FILE's
          # override seam (same pattern as CI_KNOWN_GAPS_FILE/CI_COMPETENCY_
          # GAPS_FILE above).
          # ------------------------------------------------------------------
          REAL_LOCALE_GAPS_FILE="$CI_LOCALE_GAPS_FILE"

          # Built against a FIXTURE tree with a deliberately un-translated pair,
          # NOT against the real catalogue.
          #
          # This row used to point at docs/app_description/02-domain/framework
          # with a near-empty gaps list, which worked only while the real
          # catalogue had untranslated pairs to find. The moment Italian
          # coverage reached 83/83 the row could not catch anything and started
          # asserting nothing at all — the same defect this repo has now hit
          # five separate times: a check that depends on the data being
          # incomplete stops verifying the instant you complete it. Manufacture
          # the precondition; never borrow it from the tree under test.
          mkdir -p "$FIXTURE/locale-undeclared/bars"
          printf '{"ICO":{"name":{"en":"Individual Contributor","it":"Collaboratore individuale"},"responsibilities":{"en":"x","it":"x"},"competencies":["PRS","STG"]}}' \
            > "$FIXTURE/locale-undeclared/roles.json"
          printf '{"PRS":{"name":{"en":"Problem Solving","it":"Problem solving"},"definition":{"en":"d","it":"d"}},"STG":{"name":{"en":"Strategy","it":"Strategia"},"definition":{"en":"d","it":"d"}}}' \
            > "$FIXTURE/locale-undeclared/competencies.json"
          # PRS fully translated; STG has EN only — an incomplete pair.
          printf '{"PRS":[{"indicator":{"en":"a","it":"a"},"scale":{"5":{"en":"a","it":"a"},"3":{"en":"a","it":"a"},"1":{"en":"a","it":"a"}}},{"indicator":{"en":"b","it":"b"},"scale":{"5":{"en":"b","it":"b"},"3":{"en":"b","it":"b"},"1":{"en":"b","it":"b"}}},{"indicator":{"en":"c","it":"c"},"scale":{"5":{"en":"c","it":"c"},"3":{"en":"c","it":"c"},"1":{"en":"c","it":"c"}}}],"STG":[{"indicator":{"en":"d"},"scale":{"5":{"en":"d"},"3":{"en":"d"},"1":{"en":"d"}}},{"indicator":{"en":"e"},"scale":{"5":{"en":"e"},"3":{"en":"e"},"1":{"en":"e"}}},{"indicator":{"en":"f"},"scale":{"5":{"en":"f"},"3":{"en":"f"},"1":{"en":"f"}}}]}' \
            > "$FIXTURE/locale-undeclared/bars/ICO.json"
          printf 'it:ICO:PRS\n' > "$FIXTURE/locale-gaps-partial.txt"
          CI_LOCALE_GAPS_FILE="$FIXTURE/locale-gaps-partial.txt"
          export CI_LOCALE_GAPS_FILE
          UNDECLARED=$(catalog_unexpected_locale_gaps "$FIXTURE/locale-undeclared" it) || { echo "SELF-TEST FAILED: catalog_unexpected_locale_gaps could not run."; FAILED=1; }
          if ! printf '%s\n' "$UNDECLARED" | grep -qxF 'it:ICO:STG'; then
            echo "SELF-TEST FAILED: catalog_unexpected_locale_gaps did not catch the fixture's incomplete, undeclared pair it:ICO:STG. Got: $UNDECLARED"
            FAILED=1
          else
            echo "  ok — catalog_unexpected_locale_gaps catches an incomplete pair not listed in the control file"
          fi

          printf 'it:ICO:PRS\nit:ZZZ:NOPE\n' > "$FIXTURE/locale-gaps-stale.txt"
          CI_LOCALE_GAPS_FILE="$FIXTURE/locale-gaps-stale.txt"
          export CI_LOCALE_GAPS_FILE
          # The FIXTURE tree, not the live catalogue. Same rule the row above
          # states and these three rows then broke: manufacture the
          # precondition, never borrow it from the tree under test.
          STALE=$(catalog_stale_locale_gap_exemptions "$FIXTURE/locale-undeclared" it) || { echo "SELF-TEST FAILED: catalog_stale_locale_gap_exemptions could not run."; FAILED=1; }
          if ! printf '%s\n' "$STALE" | grep -qxF 'it:ZZZ:NOPE'; then
            echo "SELF-TEST FAILED: catalog_stale_locale_gap_exemptions did not catch an exemption for a pair that no longer exists: $STALE"
            FAILED=1
          else
            echo "  ok — catalog_stale_locale_gap_exemptions catches an exemption for a nonexistent/now-complete pair"
          fi

          # ICO has exactly two competencies in the fixture, and only one is
          # listed — a partial role, manufactured here rather than borrowed.
          # The expectation used to read `it:ICO:2/15`, which hardcoded the LIVE
          # catalogue's competency count into a self-test: correct today, and a
          # false failure attributed to the guard the day the catalogue
          # legitimately changes.
          printf 'it:ICO:PRS\n' > "$FIXTURE/locale-gaps-partial-role.txt"
          CI_LOCALE_GAPS_FILE="$FIXTURE/locale-gaps-partial-role.txt"
          export CI_LOCALE_GAPS_FILE
          WHOLE_ROLE=$(locale_gaps_whole_role_violations "$FIXTURE/locale-undeclared") || { echo "SELF-TEST FAILED: locale_gaps_whole_role_violations could not run."; FAILED=1; }
          if [ "$WHOLE_ROLE" != "it:ICO:1/2" ]; then
            echo "SELF-TEST FAILED: expected 'it:ICO:1/2' from a role listed with 1 of its 2 pairs, got: $WHOLE_ROLE"
            FAILED=1
          else
            echo "  ok — locale_gaps_whole_role_violations catches a role listed with neither 0 nor its full pair count (no role may ship half-translated)"
          fi

          printf 'it:ICO:PRS\nit:FLL:PRS\nit:ICO:STG\n' > "$FIXTURE/locale-gaps-interleaved.txt"
          CI_LOCALE_GAPS_FILE="$FIXTURE/locale-gaps-interleaved.txt"
          export CI_LOCALE_GAPS_FILE
          INTERLEAVED=$(locale_gaps_role_order_violations) || { echo "SELF-TEST FAILED: locale_gaps_role_order_violations could not run."; FAILED=1; }
          if [ "$INTERLEAVED" != "ICO" ]; then
            echo "SELF-TEST FAILED: expected 'ICO' from an interleaved fixture, got: $INTERLEAVED"
            FAILED=1
          else
            echo "  ok — locale_gaps_role_order_violations catches roles whose entries are not grouped contiguously"
          fi

          CI_LOCALE_GAPS_FILE="$REAL_LOCALE_GAPS_FILE"
          export CI_LOCALE_GAPS_FILE

          # ...and the COMMITTED control file must round-trip cleanly against
          # the real tree, in both directions, on both trees — all 83 pairs
          # listed, none stale, no role partially listed, no interleaving.
          for TREE in docs/app_description/02-domain/framework api/database/framework; do
            UNDECLARED=$(catalog_unexpected_locale_gaps "$TREE" it) || { echo "SELF-TEST FAILED: could not read $TREE for locale coverage."; FAILED=1; }
            if [ -n "$UNDECLARED" ]; then
              echo "SELF-TEST FAILED: $TREE has an incomplete IT pair not listed in scripts/framework-locale-gaps.txt: $UNDECLARED"
              FAILED=1
            fi
            STALE=$(catalog_stale_locale_gap_exemptions "$TREE" it) || { echo "SELF-TEST FAILED: could not read $TREE for stale locale-gap exemptions."; FAILED=1; }
            if [ -n "$STALE" ]; then
              echo "SELF-TEST FAILED: scripts/framework-locale-gaps.txt has a stale entry against $TREE: $STALE"
              FAILED=1
            fi
          done
          WHOLE_ROLE=$(locale_gaps_whole_role_violations docs/app_description/02-domain/framework) || { echo "SELF-TEST FAILED: locale_gaps_whole_role_violations could not run against the committed tree."; FAILED=1; }
          if [ -n "$WHOLE_ROLE" ]; then
            echo "SELF-TEST FAILED: scripts/framework-locale-gaps.txt lists a partial role: $WHOLE_ROLE"
            FAILED=1
          fi
          INTERLEAVED=$(locale_gaps_role_order_violations) || { echo "SELF-TEST FAILED: locale_gaps_role_order_violations could not run."; FAILED=1; }
          if [ -n "$INTERLEAVED" ]; then
            echo "SELF-TEST FAILED: scripts/framework-locale-gaps.txt interleaves role '$INTERLEAVED' with another role's entries."
            FAILED=1
          fi
          # DERIVED, not typed. This line used to read "all 83 pairs listed
          # (no IT anchors translated yet)" while the control file listed ZERO
          # and every pair WAS translated — a hardcoded number and a hardcoded
          # claim, both false, printed by the step whose job is proving that
          # claims are backed by mechanism.
          LG_DECLARED=$(role_competency_pairs docs/app_description/02-domain/framework | grep -c . || true)
          LG_LISTED=$(known_locale_gap_pairs | grep -c . || true)
          echo "  ok — the committed scripts/framework-locale-gaps.txt round-trips cleanly: $LG_LISTED of $LG_DECLARED role x competency pairs listed as untranslated, none stale, no role partially listed, no interleaving"

          # ------------------------------------------------------------------
          # Guard (e): submodule pointer reachability.
          #
          # This guard had NO row here at all, while two statements in this
          # repository promised it did. It is the newest and most intricate
          # guard in the file and the one added specifically for release and
          # hotfix branches — exactly the profile of the three that "had never
          # once gone red, and all three were broken".
          #
          # A throwaway bare repo plays origin, so nothing here touches the
          # network or the real submodules.
          # ------------------------------------------------------------------
          REACH="$FIXTURE/reach"
          mkdir -p "$REACH"
          git init -q --bare "$REACH/origin.git"
          git clone -q "$REACH/origin.git" "$REACH/work" 2>/dev/null || true
          git -C "$REACH/work" checkout -q -b main
          git -C "$REACH/work" -c user.email=ci@beai -c user.name=ci \
            commit -q --allow-empty -m "published"
          PUBLISHED=$(git -C "$REACH/work" rev-parse HEAD)
          git -C "$REACH/work" push -q origin main
          # A release tag on a commit that main then moves off: reachable ONLY
          # via the tag. This is the case `git branch -r --contains` missed
          # while the comment beside it claimed tags were consulted.
          git -C "$REACH/work" -c user.email=ci@beai -c user.name=ci \
            commit -q --allow-empty -m "tagged release"
          TAGGED=$(git -C "$REACH/work" rev-parse HEAD)
          git -C "$REACH/work" tag ci-selftest-1.0.0
          git -C "$REACH/work" push -q origin ci-selftest-1.0.0
          git -C "$REACH/work" reset -q --hard "$PUBLISHED"
          # And a commit that was never pushed — but which DOES sit on a local
          # branch and a local tag. That detail is the whole test. An orphan on
          # no ref at all is rejected by any implementation, including a broken
          # one, so it cannot tell them apart: dropping the
          # refs/remotes/ci-verify argument would still have looked correct.
          # A commit on a LOCAL ref is the case that separates "published" from
          # "present on this disk", and it is the realistic one — a developer
          # with an unpushed feature branch, or a tag they made and forgot.
          git -C "$REACH/work" checkout -q -b ci-selftest-local-only
          git -C "$REACH/work" -c user.email=ci@beai -c user.name=ci \
            commit -q --allow-empty -m "never pushed"
          ORPHAN=$(git -C "$REACH/work" rev-parse HEAD)
          git -C "$REACH/work" tag ci-selftest-local-tag
          git -C "$REACH/work" checkout -q main

          if submodule_fetch_published_refs "$REACH/work" 2>/dev/null; then
            echo "  ok — reachability guard fetches published refs"
          else
            echo "SELF-TEST FAILED: the reachability guard could not fetch from a working origin."
            FAILED=1
          fi

          if commit_reachable_from_remote "$REACH/work" "$PUBLISHED" >/dev/null; then
            echo "  ok — reachability guard accepts a commit on a published branch"
          else
            echo "SELF-TEST FAILED: the reachability guard rejected a commit that IS on a published branch."
            FAILED=1
          fi

          if commit_reachable_from_remote "$REACH/work" "$TAGGED" >/dev/null; then
            echo "  ok — reachability guard accepts a commit reachable only via a published TAG"
          else
            echo "SELF-TEST FAILED: the reachability guard rejected a commit on a published tag."
            echo "  This is the release-pointer case the guard exists for: tags fetched but never read."
            FAILED=1
          fi

          if commit_reachable_from_remote "$REACH/work" "$ORPHAN" >/dev/null; then
            echo "SELF-TEST FAILED: the reachability guard ACCEPTED a commit that exists only on"
            echo "  LOCAL refs (branch ci-selftest-local-only, tag ci-selftest-local-tag)."
            echo "  A pointer at that commit clones as an unfetchable SHA for everybody else."
            echo "  Check that the question is still being asked of $CI_VERIFY_REFS and not of every ref."
            FAILED=1
          else
            echo "  ok — reachability guard rejects a commit that is only on local refs"
          fi

          submodule_clear_verify_refs "$REACH/work"
          if [ -n "$(git -C "$REACH/work" for-each-ref "$CI_VERIFY_REFS")" ]; then
            echo "SELF-TEST FAILED: the reachability guard left its verification refs behind."
            FAILED=1
          else
            echo "  ok — reachability guard cleans up its verification refs"
          fi

          # ------------------------------------------------------------------
          # The catalog completeness guard must FAIL CLOSED.
          #
          # It used to fail open: role_keys ran bun and dropped the exit status,
          # so malformed JSON — or no bun at all — produced an empty role list,
          # and an empty list reads as "nothing missing". A one-character
          # corruption in a binding artifact silently disabled the half of the
          # gate that exists because SRX.json was missing.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/cat-malformed/bars" "$FIXTURE/cat-array/bars"
          printf '{"ICO":{"name":"Contributor"},' > "$FIXTURE/cat-malformed/roles.json"
          printf '["ICO","SRX"]' > "$FIXTURE/cat-array/roles.json"

          if catalog_missing_bars "$FIXTURE/cat-malformed" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the completeness guard reported SUCCESS on unparseable roles.json."
            echo "  Fail-open: a corrupt binding artifact would read as a complete catalog."
            FAILED=1
          else
            echo "  ok — completeness guard fails closed on unparseable roles.json"
          fi

          if catalog_missing_bars "$FIXTURE/cat-array" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the completeness guard accepted an ARRAY as roles.json."
            echo "  Object.keys would emit 0,1,2 and send it hunting for bars/0.json."
            FAILED=1
          else
            echo "  ok — completeness guard rejects roles.json that is not an object"
          fi

          if catalog_missing_bars "$FIXTURE/cat-absent" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: the completeness guard reported SUCCESS on a missing roles.json."
            FAILED=1
          else
            echo "  ok — completeness guard fails closed on a missing roles.json"
          fi

          # ...and the same failure must reach the CALLER the real gate uses,
          # not be absorbed one layer up.
          if catalog_unexpected_missing_bars "$FIXTURE/cat-malformed" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_unexpected_missing_bars swallowed an unreadable role list."
            FAILED=1
          else
            echo "  ok — the read failure propagates to the function step (d) calls"
          fi

          # Horizon: present is a violation, a mention in prose is not.
          # BOTH manifests, because the real gate reads both and the copy here
          # read only composer.json — so it proved half the rule. composer.json
          # is what somebody edits; composer.lock is where a transitive pull-in
          # shows up, and that is the case nobody would notice by reading.
          mkdir -p "$FIXTURE/hz-json" "$FIXTURE/hz-lock"
          printf '{"require":{"laravel/horizon":"^5.0"}}' > "$FIXTURE/hz-json/composer.json"
          expect_caught "Horizon (composer.json)" "$(scan_horizon "$FIXTURE/hz-json")"
          printf '{"packages":[{"name":"laravel/horizon","version":"v5.30.0"}]}' > "$FIXTURE/hz-lock/composer.lock"
          expect_caught "Horizon (composer.lock)" "$(scan_horizon "$FIXTURE/hz-lock")"

          # ------------------------------------------------------------------
          # docs/version-catalog.md reality check (guard (h)) — the four
          # functions it is built from, individually, then both directions
          # of the real gate against a fixture built to trip each one.
          # ------------------------------------------------------------------
          mkdir -p "$FIXTURE/vc-good" "$FIXTURE/vc-bad"

          # catalog_dockerfile_images: a real pinned tag is returned; the
          # multi-stage reference to a declared stage is not; `scratch` is
          # not. Same fixture SHAPE as the df_guard rows above, this time
          # asserting the LIST of image refs rather than pass/fail.
          printf 'FROM node:24.11-slim AS builder\nFROM builder AS runtime\nFROM scratch AS scratch2\n' \
            > "$FIXTURE/vc-good/Dockerfile.multistage"
          GOT=$(catalog_dockerfile_images "$FIXTURE/vc-good/Dockerfile.multistage") || { echo "SELF-TEST FAILED: catalog_dockerfile_images could not run."; FAILED=1; }
          if [ "$GOT" = "node:24.11-slim" ]; then
            echo "  ok — catalog_dockerfile_images returns only the real image, not the stage reference or scratch"
          else
            echo "SELF-TEST FAILED: catalog_dockerfile_images expected 'node:24.11-slim', got: $GOT"
            FAILED=1
          fi
          if catalog_dockerfile_images "$FIXTURE/vc-good/Dockerfile.absent" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_dockerfile_images reported SUCCESS on a Dockerfile that does not exist."
            FAILED=1
          else
            echo "  ok — catalog_dockerfile_images fails closed on a missing Dockerfile"
          fi

          # compose_declared_images: a real tag is kept; the :local
          # build-only convention is excluded.
          COMPOSE_FIXTURE=$(printf 'services:\n  postgres:\n    image: pgvector/pgvector:0.8.0-pg17\n  api:\n    image: beai-api:local\n  worker:\n    image: beai-api:local\n')
          GOT=$(compose_declared_images "$COMPOSE_FIXTURE") || { echo "SELF-TEST FAILED: compose_declared_images could not run."; FAILED=1; }
          if [ "$GOT" = "pgvector/pgvector:0.8.0-pg17" ]; then
            echo "  ok — compose_declared_images keeps a real tag and excludes local build-only tags"
          else
            echo "SELF-TEST FAILED: compose_declared_images expected only 'pgvector/pgvector:0.8.0-pg17', got: $GOT"
            FAILED=1
          fi

          # version_catalog_images: reads exactly the Tag column of the
          # "Docker base images" table and stops at the NEXT heading — the
          # exact boundary a naive `/^## /,/^## /p` sed range gets wrong,
          # because the opening heading itself starts with "## " and would
          # close the range on its own line (see the function's own comment
          # in scripts/ci-guards.sh).
          #
          # The fixture carries a prose line WITH backticks on purpose. The
          # earlier one had none, so the single behaviour that can break the
          # real catalog was the one the fixture was built to avoid — and it
          # did break it: a paragraph mentioning `docs/version-catalog.md`
          # was read as an image tag, and step (h) reported three images
          # that do not exist. The parser reads the Tag COLUMN of table
          # rows, which is what its name has always claimed.
          printf '# Version Catalog\n\n## Docker base images\n\n| Image | Tag | Used in |\n|-------|-----|---------|\n| Redis | `redis:8.0-alpine` | compose |\n| Postgres | `pgvector/pgvector:0.8.0-pg17` | compose |\n\nSome prose, no backticks.\n\nProse that DOES carry backticks: `docs/version-catalog.md` names `docker compose config`.\n\n## Runtimes and frameworks\n\n| Component | Version |\n|-----------|---------|\n| PHP | `^8.5` |\n' \
            > "$FIXTURE/vc-good/version-catalog.md"
          GOT=$(version_catalog_images "$FIXTURE/vc-good/version-catalog.md") || { echo "SELF-TEST FAILED: version_catalog_images could not run."; FAILED=1; }
          EXPECTED=$(printf 'redis:8.0-alpine\npgvector/pgvector:0.8.0-pg17')
          if [ "$GOT" = "$EXPECTED" ]; then
            echo "  ok — version_catalog_images reads exactly the Docker base images table, stopping at the next heading"
          else
            echo "SELF-TEST FAILED: version_catalog_images expected:"
            echo "$EXPECTED"
            echo "  got:"
            echo "$GOT"
            FAILED=1
          fi
          if version_catalog_images "$FIXTURE/vc-good/absent.md" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: version_catalog_images reported SUCCESS on a file that does not exist."
            FAILED=1
          else
            echo "  ok — version_catalog_images fails closed on a missing file"
          fi

          # image_set_difference: the shared primitive both directions of
          # the catalog check use.
          GOT=$(image_set_difference "$(printf 'a\nb\nc')" "$(printf 'b\nc')")
          if [ "$GOT" = "a" ]; then
            echo "  ok — image_set_difference returns exactly the elements of the first set absent from the second"
          else
            echo "SELF-TEST FAILED: image_set_difference expected 'a', got: $GOT"
            FAILED=1
          fi

          # BOTH directions of the real gate (h), against fixtures built to
          # break EACH one independently — not a re-typed copy with a
          # narrower filter, the same functions step (h) calls.
          #
          # Direction 1 — a Dockerfile tag is bumped; the catalog row is not
          # updated in the same commit. Must be caught.
          printf 'FROM node:24.99-slim AS runtime\n' > "$FIXTURE/vc-bad/Dockerfile"
          printf '## Docker base images\n\n| Image | Tag | Used in |\n|-------|-----|---------|\n| Node | `node:24.11-slim` | frontend/Dockerfile |\n' \
            > "$FIXTURE/vc-bad/catalog-stale-dockerfile.md"
          USED=$(catalog_dockerfile_images "$FIXTURE/vc-bad/Dockerfile") || { echo "SELF-TEST FAILED: catalog_dockerfile_images could not run."; FAILED=1; }
          CATALOG=$(version_catalog_images "$FIXTURE/vc-bad/catalog-stale-dockerfile.md") || { echo "SELF-TEST FAILED: version_catalog_images could not run."; FAILED=1; }
          expect_caught "version-catalog direction 1 (used tag bumped, catalog row not updated)" \
            "$(image_set_difference "$USED" "$CATALOG")"

          # Direction 2 — a catalog row survives after the image it
          # described was dropped or renamed. Must be caught.
          printf 'FROM node:24.11-slim AS runtime\n' > "$FIXTURE/vc-bad/Dockerfile"
          printf '## Docker base images\n\n| Image | Tag | Used in |\n|-------|-----|---------|\n| Node | `node:24.11-slim` | frontend/Dockerfile |\n| Ghost | `ghost:1.0.0-old` | nowhere anymore |\n' \
            > "$FIXTURE/vc-bad/catalog-stale-row.md"
          USED=$(catalog_dockerfile_images "$FIXTURE/vc-bad/Dockerfile") || { echo "SELF-TEST FAILED: catalog_dockerfile_images could not run."; FAILED=1; }
          CATALOG=$(version_catalog_images "$FIXTURE/vc-bad/catalog-stale-row.md") || { echo "SELF-TEST FAILED: version_catalog_images could not run."; FAILED=1; }
          expect_caught "version-catalog direction 2 (catalog row no longer used anywhere)" \
            "$(image_set_difference "$CATALOG" "$USED")"

          # ...and a Dockerfile/catalog pair that agree must be silent in
          # both directions at once.
          printf '## Docker base images\n\n| Image | Tag | Used in |\n|-------|-----|---------|\n| Node | `node:24.11-slim` | frontend/Dockerfile |\n' \
            > "$FIXTURE/vc-bad/catalog-clean.md"
          USED=$(catalog_dockerfile_images "$FIXTURE/vc-bad/Dockerfile") || { echo "SELF-TEST FAILED: catalog_dockerfile_images could not run."; FAILED=1; }
          CATALOG=$(version_catalog_images "$FIXTURE/vc-bad/catalog-clean.md") || { echo "SELF-TEST FAILED: version_catalog_images could not run."; FAILED=1; }
          CLEAN="$(image_set_difference "$USED" "$CATALOG")$(image_set_difference "$CATALOG" "$USED")"
          if [ -n "$CLEAN" ]; then
            echo "SELF-TEST FAILED: the version-catalog guard flagged a Dockerfile and catalog that agree: $CLEAN"
            FAILED=1
          else
            echo "  ok — version-catalog guard is silent in both directions when Dockerfile and catalog agree"
          fi

          # ...and the COMMITTED docs/version-catalog.md must match the
          # real tree, in both directions, right now — same discipline as
          # every other control file proved above.
          REAL_USED=""
          for DF in api/Dockerfile frontend/Dockerfile backoffice/Dockerfile; do
            REAL_USED=$(printf '%s\n%s' "$REAL_USED" "$(catalog_dockerfile_images "$DF")")
          done
          # stderr to a file, not merged into stdout — the same shape step (h)
          # uses. Merging it fed `compose_declared_images` a string with
          # compose warnings interleaved, so this row proved the mechanism
          # against an input the real gate never produces. Harmless in practice
          # (a WARN line does not match `^[[:space:]]*image:`) and exactly the
          # defect this step is named after.
          if REAL_COMPOSE_CONFIG=$(docker compose config 2>"$FIXTURE/compose-config.err"); then
            REAL_USED=$(printf '%s\n%s' "$REAL_USED" "$(compose_declared_images "$REAL_COMPOSE_CONFIG")")
          else
            echo "SELF-TEST FAILED: 'docker compose config' failed while proving the committed catalog against reality."
            FAILED=1
          fi
          # ...and the images a SCRIPT pins for `docker run`. Without this the
          # catalog's "reality" was three Dockerfiles and compose, while the
          # repo also pins the 3.45GB Playwright image from
          # scripts/e2e-container.sh — so that pin could never be reported as
          # uncataloged, and cataloging it fired the stale-row check instead.
          if REAL_SCRIPTS=$(script_pinned_images scripts); then
            REAL_USED=$(printf '%s\n%s' "$REAL_USED" "$REAL_SCRIPTS")
          else
            echo "SELF-TEST FAILED: could not read scripts/ for the image refs it pins."
            FAILED=1
          fi
          REAL_USED=$(printf '%s\n' "$REAL_USED" | grep -v '^$' | sort -u)
          REAL_CATALOG=$(version_catalog_images docs/version-catalog.md) || { echo "SELF-TEST FAILED: version_catalog_images could not run."; FAILED=1; }
          REAL_MISSING=$(image_set_difference "$REAL_USED" "$REAL_CATALOG")
          REAL_STALE=$(image_set_difference "$REAL_CATALOG" "$REAL_USED")
          if [ -n "$REAL_MISSING$REAL_STALE" ]; then
            echo "SELF-TEST FAILED: docs/version-catalog.md does not match reality."
            if [ -n "$REAL_MISSING" ]; then
              echo "  used but not cataloged:"
              printf '%s\n' "$REAL_MISSING" | sed 's/^/    /'
            fi
            if [ -n "$REAL_STALE" ]; then
              echo "  cataloged but no longer used:"
              printf '%s\n' "$REAL_STALE" | sed 's/^/    /'
            fi
            FAILED=1
          else
            echo "  ok — the committed docs/version-catalog.md matches reality in both directions"
          fi

          # The floor's two failure codes are load-bearing for step (d): 2 is
          # "no measured threshold for this locale", 1 is "could not read".
          # Asserted, because the caller now branches on the difference and a
          # silent collapse back to 1 would turn every unmeasured locale into a
          # build failure.
          # Captured through `if`, not as a bare call followed by `$?`. This
          # step sets `set -e`, and the first call returns 2 BY DESIGN — a bare
          # call would kill the step right here, before script_pinned_images,
          # bun_version_divergence and `rm -rf "$FIXTURE"` ever ran, and the job
          # would go red with no diagnostic at all. Which is the outcome this
          # file exists to prevent, committed inside the assertion proving it.
          if catalog_short_bars_anchors docs/app_description/02-domain/framework FLL it >/dev/null 2>&1; then
            FLOOR_UNMEASURED_RC=0
          else
            FLOOR_UNMEASURED_RC=$?
          fi
          if catalog_short_bars_anchors "$FIXTURE/definitely-not-a-tree" FLL en >/dev/null 2>&1; then
            FLOOR_UNREADABLE_RC=0
          else
            FLOOR_UNREADABLE_RC=$?
          fi
          if [ "$FLOOR_UNMEASURED_RC" -eq 2 ] && [ "$FLOOR_UNREADABLE_RC" -eq 1 ]; then
            echo "  ok — catalog_short_bars_anchors separates an unmeasured locale (2) from an unreadable tree (1)"
          else
            echo "SELF-TEST FAILED: expected exit 2 for an unmeasured locale floor and 1 for an unreadable tree, got $FLOOR_UNMEASURED_RC and $FLOOR_UNREADABLE_RC."
            FAILED=1
          fi

          # The MISSING-FILE / NO-SUBJECT paths. Step (f) header claims it proves
          # "every guard in this file" against a known-bad fixture, and three
          # live `return 1` branches had no row: a guard that cannot find its
          # subject must not read as agreement, and until now nothing checked
          # that it does not. A header promising coverage the mechanism does not
          # deliver is the defect this whole step is named after.
          if compose_pins_pgsql "$FIXTURE/definitely-not-a-compose-file.yml" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: compose_pins_pgsql returned SUCCESS for a file that does not exist."
            FAILED=1
          else
            echo "  ok — compose_pins_pgsql fails closed on a missing file"
          fi
          if catalog_meta_locale_shape "$FIXTURE/definitely-not-a-tree" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_meta_locale_shape returned SUCCESS for a tree that does not exist."
            FAILED=1
          else
            echo "  ok — catalog_meta_locale_shape fails closed on an unreadable tree"
          fi
          printf 'This document names no runtime version at all.\n' > "$FIXTURE/no-bun-version.md"
          if bun_doc_divergence 1.4.0 "$FIXTURE/no-bun-version.md" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: bun_doc_divergence returned SUCCESS for a document naming no Bun version — silence there would read as agreement."
            FAILED=1
          else
            echo "  ok — bun_doc_divergence fails closed on a document naming no Bun version"
          fi

          # stale_competency_gap_exemption_reason: the UNREADABLE answer, which
          # is a fourth shape beside anchored/orphaned/role-level and used to be
          # indistinguishable from "orphaned" — so step (d) told an operator to
          # delete a correct exemption about a file nobody parsed.
          mkdir -p "$FIXTURE/reason-unreadable/bars"
          printf 'not json at all' > "$FIXTURE/reason-unreadable/roles.json"
          printf '{}' > "$FIXTURE/reason-unreadable/bars/FLL.json"
          if REASON_OUT=$(stale_competency_gap_exemption_reason "$FIXTURE/reason-unreadable" 'FLL:PRS' 2>/dev/null); then
            REASON_UNREADABLE_RC=0
          else
            REASON_UNREADABLE_RC=$?
          fi
          if [ "$REASON_UNREADABLE_RC" -eq 2 ] && [ -z "$REASON_OUT" ]; then
            echo "  ok — stale_competency_gap_exemption_reason returns 2 with NO verdict when roles.json cannot be read"
          else
            echo "SELF-TEST FAILED: expected exit 2 and no output for an unreadable roles.json, got rc=$REASON_UNREADABLE_RC out='$REASON_OUT'."
            FAILED=1
          fi

          # catalog_crosslocale_duplicate_divergence on the pre-migration shape.
          # Its docblock promised it failed closed here; it returned clean over a
          # tree it had never examined, while its cross-role sibling went red on
          # the identical input.
          mkdir -p "$FIXTURE/xlocale-bare/bars"
          printf '{"ICO":{"name":{"en":"x","it":"x"},"responsibilities":{"en":"x","it":"x"},"competencies":["PRS"]}}' \
            > "$FIXTURE/xlocale-bare/roles.json"
          printf '{"PRS":{"name":{"en":"x","it":"x"},"definition":{"en":"d","it":"d"}}}' \
            > "$FIXTURE/xlocale-bare/competencies.json"
          printf '{"PRS":[{"indicator":"bare string, pre-migration shape","scale":{"5":"bare","3":"bare","1":"bare"}}]}' \
            > "$FIXTURE/xlocale-bare/bars/ICO.json"
          if catalog_crosslocale_duplicate_divergence "$FIXTURE/xlocale-bare" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_crosslocale_duplicate_divergence returned SUCCESS on a bare-string bars file — the shape its own docblock says it fails closed on."
            FAILED=1
          else
            echo "  ok — catalog_crosslocale_duplicate_divergence fails closed on the pre-migration bare-string shape"
          fi

          # The anchor CEILING separates an unmeasured locale (2) from an
          # unreadable tree (1), the same split the floor already made. Without
          # it, adding a desirable locale to CI_LOCALES produced "could not read
          # FLL.json for locale [es]" — a red build accusing a healthy file.
          # Captured through `if`, for the reason spelled out at the floor
          # assertion ninety lines above — and broken here in the very next
          # assertion after writing it down. `es` returns 2 BY DESIGN, and under
          # this step's `set -e` a bare call would have killed the step at this
          # line: no assignment, no assertion, no `rm -rf "$FIXTURE"`, and a red
          # job with zero explanation. A rule written and then not applied one
          # screen later is a preference, which is this file's own phrase for it.
          if catalog_overlong_bars_anchors docs/app_description/02-domain/framework FLL es >/dev/null 2>&1; then
            CEILING_UNMEASURED_RC=0
          else
            CEILING_UNMEASURED_RC=$?
          fi
          if catalog_overlong_bars_anchors "$FIXTURE/definitely-not-a-tree" FLL en >/dev/null 2>&1; then
            CEILING_UNREADABLE_RC=0
          else
            CEILING_UNREADABLE_RC=$?
          fi
          if [ "$CEILING_UNMEASURED_RC" -eq 2 ] && [ "$CEILING_UNREADABLE_RC" -eq 1 ]; then
            echo "  ok — catalog_overlong_bars_anchors separates an unmeasured locale (2) from an unreadable tree (1)"
          else
            echo "SELF-TEST FAILED: expected 2 for an unmeasured locale and 1 for an unreadable tree, got $CEILING_UNMEASURED_RC and $CEILING_UNREADABLE_RC."
            FAILED=1
          fi

          # The control-file readers separate ABSENT from UNREADABLE. Both
          # returned 0, which made every caller's "could not read the control
          # file" branch dead code — delete the file and the interleaving check
          # reported clean, exactly as before the guard added to stop that.
          printf 'ICO:PRS\n' > "$FIXTURE/unreadable-gaps.txt"
          chmod 000 "$FIXTURE/unreadable-gaps.txt"
          if CI_COMPETENCY_GAPS_FILE="$FIXTURE/unreadable-gaps.txt" known_gap_pairs >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: known_gap_pairs returned SUCCESS for a control file it cannot read."
            FAILED=1
          else
            echo "  ok — known_gap_pairs fails closed on an unreadable control file"
          fi
          # ...and that a CONSUMER acts on it. Proving the reader alone would
          # have left the fix half-done: four callers discarded the status
          # through command substitution and four more through a pipeline,
          # which reports its LAST command — so the loop ran zero times over
          # nothing and the caller read that as "no entries". Silently green
          # over a file nobody could open.
          if CI_COMPETENCY_GAPS_FILE="$FIXTURE/unreadable-gaps.txt" \
             catalog_stale_competency_gap_exemptions docs/app_description/02-domain/framework >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: catalog_stale_competency_gap_exemptions reported clean over a control file it could not read."
            FAILED=1
          else
            echo "  ok — a stale-exemption consumer stops when its control file cannot be read"
          fi
          chmod 644 "$FIXTURE/unreadable-gaps.txt"
          if CI_COMPETENCY_GAPS_FILE="$FIXTURE/definitely-absent.txt" known_gap_pairs >/dev/null 2>&1; then
            echo "  ok — an ABSENT control file is still a legitimate empty list"
          else
            echo "SELF-TEST FAILED: known_gap_pairs must treat an absent control file as an empty list, not a failure."
            FAILED=1
          fi

          # version_manifest_divergence: red fixture, because the committed tree
          # is about to be made green and a guard proven only against green
          # proves nothing.
          mkdir -p "$FIXTURE/verdrift"
          printf '1.2.3\n' > "$FIXTURE/verdrift/VERSION"
          printf '{"name": "x", "version": "9.9.9"}' > "$FIXTURE/verdrift/package.json"
          VDRIFT=$(version_manifest_divergence "$FIXTURE/verdrift") || { echo "SELF-TEST FAILED: version_manifest_divergence could not run."; FAILED=1; }
          case "$VDRIFT" in
            *"says 9.9.9"*"says 1.2.3"*)
              echo "  ok — version_manifest_divergence catches a manifest disagreeing with VERSION" ;;
            *)
              echo "SELF-TEST FAILED: expected a 9.9.9-vs-1.2.3 divergence, got: $VDRIFT"
              FAILED=1 ;;
          esac
          mkdir -p "$FIXTURE/vernomanifest"
          printf '1.2.3\n' > "$FIXTURE/vernomanifest/VERSION"
          if version_manifest_divergence "$FIXTURE/vernomanifest" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: version_manifest_divergence returned SUCCESS for a repo with no manifest to compare — a version check that finds no version has not passed."
            FAILED=1
          else
            echo "  ok — version_manifest_divergence fails closed when there is nothing to compare against"
          fi

          # non_role_bars_locale_gaps: the coverage MTG and LAT had none of.
          mkdir -p "$FIXTURE/nonrole/bars"
          printf '{"MTG":[{"indicator":{"en":"a","it":"a"},"scale":{"5":{"en":"a"},"3":{"en":"a","it":"a"},"1":{"en":"a","it":"a"}}}]}' \
            > "$FIXTURE/nonrole/bars/POTENTIAL.json"
          NRB=$(non_role_bars_locale_gaps "$FIXTURE/nonrole" it) || { echo "SELF-TEST FAILED: non_role_bars_locale_gaps could not run."; FAILED=1; }
          if [ "$NRB" = "it:POTENTIAL:MTG" ]; then
            echo "  ok — non_role_bars_locale_gaps catches a non-role competency missing an anchor translation"
          else
            echo "SELF-TEST FAILED: expected 'it:POTENTIAL:MTG', got: $NRB"
            FAILED=1
          fi
          if non_role_bars_locale_gaps "$FIXTURE/definitely-not-a-tree" it >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: non_role_bars_locale_gaps returned SUCCESS for a tree that does not exist."
            FAILED=1
          else
            echo "  ok — non_role_bars_locale_gaps fails closed on an unreadable tree"
          fi

          # bars_files_without_declared_role: a red fixture, because the guard
          # passes on the committed tree only while POTENTIAL stays declared.
          mkdir -p "$FIXTURE/mirror/bars"
          printf '{"ICO":{"name":{"en":"x","it":"x"},"responsibilities":{"en":"x","it":"x"},"competencies":["PRS"]}}' \
            > "$FIXTURE/mirror/roles.json"
          printf '{}' > "$FIXTURE/mirror/bars/ICO.json"
          printf '{}' > "$FIXTURE/mirror/bars/POTENTIAL.json"
          printf '{}' > "$FIXTURE/mirror/bars/SCRATCH.json"
          MIRROR=$(bars_files_without_declared_role "$FIXTURE/mirror") || { echo "SELF-TEST FAILED: bars_files_without_declared_role could not run."; FAILED=1; }
          if [ "$MIRROR" = "SCRATCH" ]; then
            echo "  ok — bars_files_without_declared_role catches an undeclared bars file, and leaves a declared role and a declared non-role catalogue alone"
          else
            echo "SELF-TEST FAILED: expected exactly 'SCRATCH', got: $MIRROR"
            FAILED=1
          fi

          # script_pinned_images: a red fixture, because a guard whose only
          # evidence is the committed tree passes for the wrong reason the day
          # the convention it relies on is broken.
          mkdir -p "$FIXTURE/scriptpins"
          printf '#!/usr/bin/env bash\nIMAGE="example.com/thing:1.2.3"\ndocker run "$IMAGE"\n' \
            > "$FIXTURE/scriptpins/run.sh"
          printf '#!/usr/bin/env bash\n# mentions example.com/decoy:9 in prose, assigned to nothing\nOTHER=example.com/decoy:9\n' \
            > "$FIXTURE/scriptpins/decoy.sh"
          PINS=$(script_pinned_images "$FIXTURE/scriptpins") || { echo "SELF-TEST FAILED: script_pinned_images could not run."; FAILED=1; }
          if [ "$PINS" = "example.com/thing:1.2.3" ]; then
            echo "  ok — script_pinned_images reads an IMAGE= pin and ignores a ref that is merely mentioned"
          else
            echo "SELF-TEST FAILED: script_pinned_images expected exactly 'example.com/thing:1.2.3', got: $PINS"
            FAILED=1
          fi

          # bun_version_divergence: red fixture, then the live tree.
          mkdir -p "$FIXTURE/bunver"
          printf 'jobs:\n  x:\n    steps:\n      - with:\n          bun-version: %s\n' "'9.9.9'" \
            > "$FIXTURE/bunver/wf.yml"
          printf 'FROM oven/bun:1.4.0 AS builder\n' > "$FIXTURE/bunver/Dockerfile"
          DIVERGED=$(bun_version_divergence "$FIXTURE/bunver/wf.yml" "$FIXTURE/bunver/Dockerfile") || { echo "SELF-TEST FAILED: bun_version_divergence could not run."; FAILED=1; }
          if [ -n "$DIVERGED" ]; then
            echo "  ok — bun_version_divergence catches a workflow installing a different Bun than the image builds on"
          else
            echo "SELF-TEST FAILED: bun_version_divergence stayed silent on 9.9.9 vs oven/bun:1.4.0."
            FAILED=1
          fi
          # ...and the installer form, not only `FROM oven/bun:`.
          printf 'curl -fsSL https://bun.sh/install | bash -s bun-v1.2.9 >/dev/null\n' \
            > "$FIXTURE/bunver/installer.sh"
          DIVERGED_INSTALLER=$(bun_version_divergence "$FIXTURE/bunver/wf.yml" "$FIXTURE/bunver/installer.sh")
          if [ -n "$DIVERGED_INSTALLER" ]; then
            echo "  ok — bun_version_divergence reads the official-installer pin, not only a Dockerfile FROM"
          else
            echo "SELF-TEST FAILED: bun_version_divergence stayed silent on a script installing bun-v1.2.9 against bun-version 9.9.9."
            FAILED=1
          fi

          # TWO rows, because these are two different answers and the previous
          # single row conflated them: a file that declares no Bun stage is
          # silence, a file that does not exist is a failure. Rename any of the
          # four live subjects and the old shape went green having compared
          # nothing.
          printf 'FROM alpine:3.20\n' > "$FIXTURE/bunver/no-bun-stage.Dockerfile"
          if bun_version_divergence "$FIXTURE/bunver/wf.yml" "$FIXTURE/bunver/no-bun-stage.Dockerfile" >/dev/null 2>&1; then
            echo "  ok — bun_version_divergence is silent on a file that declares no Bun stage"
          else
            echo "SELF-TEST FAILED: bun_version_divergence must stay silent for a file with no oven/bun stage and no installer pin."
            FAILED=1
          fi
          if bun_version_divergence "$FIXTURE/bunver/wf.yml" "$FIXTURE/bunver/nonexistent" >/dev/null 2>&1; then
            echo "SELF-TEST FAILED: bun_version_divergence returned SUCCESS for a file that does not exist — a green gate over no evidence."
            FAILED=1
          else
            echo "  ok — bun_version_divergence fails closed on a missing subject"
          fi

          # ...and the committed tree, which is what the `Set up Bun` comment
          # has been asserting with nothing behind it.
          # ...and the PROSE documents, which were in no chain at all. CLAUDE.md's
          # toolchain line and docs/dev-setup.md are what a human reads first,
          # and both carried a stale Bun long after every machine-read pin had
          # moved. Finding that needed someone to notice; now it does not.
          printf 'Bun 1.4\n' > "$FIXTURE/bunver/doc-ok.md"
          printf 'Bun 1.3\n' > "$FIXTURE/bunver/doc-stale.md"
          if [ -n "$(bun_doc_divergence 1.4.0 "$FIXTURE/bunver/doc-stale.md")" ] \
            && [ -z "$(bun_doc_divergence 1.4.0 "$FIXTURE/bunver/doc-ok.md")" ]; then
            echo "  ok — bun_doc_divergence catches a stale prose version and accepts a shorter-but-compatible one"
          else
            echo "SELF-TEST FAILED: bun_doc_divergence did not separate 'Bun 1.3' from 'Bun 1.4' against a 1.4.0 pin."
            FAILED=1
          fi
          if BUN_PIN=$(grep -E "^[[:space:]]*bun-version:" .github/workflows/wrapper-ci.yml | head -1 | sed -E "s/.*bun-version:[[:space:]]*['\"]?([^'\"[:space:]]+).*/\1/"); then
            if DOC_BUN=$(bun_doc_divergence "$BUN_PIN" CLAUDE.md docs/dev-setup.md); then
              if [ -n "$DOC_BUN" ]; then
                echo "SELF-TEST FAILED: a prose document names a Bun version the repo does not pin:"
                printf '%s\n' "$DOC_BUN" | sed 's/^/    /'
                FAILED=1
              else
                echo "  ok — CLAUDE.md and docs/dev-setup.md name the Bun version the repo actually pins"
              fi
            else
              echo "SELF-TEST FAILED: bun_doc_divergence could not find a Bun version in CLAUDE.md or docs/dev-setup.md."
              FAILED=1
            fi
          else
            echo "SELF-TEST FAILED: could not read bun-version from the workflow."
            FAILED=1
          fi

          # scripts/e2e-container.sh included: it is the THIRD place this
          # version is written and was the only one no gate read, which is how
          # it kept an `npm install -g bun@^1.3` long after the pin moved.
          if LIVE_BUN=$(bun_version_divergence .github/workflows/wrapper-ci.yml frontend/Dockerfile backoffice/Dockerfile scripts/e2e-container.sh); then
            if [ -n "$LIVE_BUN" ]; then
              echo "SELF-TEST FAILED: the Bun the wrapper installs is not the Bun the apps are built with:"
              printf '%s\n' "$LIVE_BUN" | sed 's/^/    /'
              FAILED=1
            else
              echo "  ok — setup-bun and both Dockerfile build stages pin the same Bun"
            fi
          else
            echo "SELF-TEST FAILED: bun_version_divergence could not run against the committed tree."
            FAILED=1
          fi

          rm -rf "$FIXTURE"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Every guard rejected its known-bad fixture."

      # -----------------------------------------------------------------------
      # (g) Stack-consistency grep: confirm no stale stack tokens exist
      #     (MySQL, Laravel 12, Sanctum in non-design contexts, Horizon,
      #     pnpm/yarn/npm in the Nuxt apps).
      # -----------------------------------------------------------------------
      - name: Stack token consistency check
        run: |
          . ./scripts/ci-guards.sh

          echo "Checking for stale stack tokens..."
          FAIL=0

          # MySQL/MariaDB outside design.md (where it's mentioned as rejected
          # alternative). `scan_mysql` from scripts/ci-guards.sh carries the
          # include list, the exclude-dirs and the legitimate-hit filters, so the
          # self-test in (f) exercises the rule as written rather than a
          # one-include shorthand of it.
          HITS=$(scan_mysql .)
          if [ -n "$HITS" ]; then
            echo "ERROR: MySQL/MariaDB reference found outside design.md:"
            echo "$HITS"
            FAIL=1
          fi

          # The invariant the check above only approximates: which driver the
          # stack actually SELECTS. Grepping for a forbidden word says nothing
          # about configuration — Laravel's stock config mentions every driver
          # it supports and always will.
          if ! compose_pins_pgsql docker-compose.yml; then
            echo "ERROR: docker-compose.yml does not pin DB_CONNECTION to pgsql."
            FAIL=1
          fi

          # Laravel 12 (we're on 13). `scan_laravel12` from
          # scripts/ci-guards.sh — it uses -l so the exclusions filter PATHS,
          # which the self-test's old copy did not reproduce.
          HITS=$(scan_laravel12 .)
          if [ -n "$HITS" ]; then
            echo "ERROR: Laravel 12 reference found:"
            echo "$HITS"
            FAIL=1
          fi

          # Sanctum — only allowed as "NOT Sanctum" in design/docs.
          # `scan_sanctum` from scripts/ci-guards.sh, exercised by (f) above in
          # both directions: it must catch the manifest and must tolerate the
          # standards' own wording.
          #
          # composer.json/lock are included deliberately: the dependency manifest
          # is the ONE place laravel/sanctum would ever actually appear, and it
          # was excluded — so the strongest auth rule in the standards had a
          # guard blind to the only file that could break it.
          HITS=$(scan_sanctum .)
          if [ -n "$HITS" ]; then
            echo "ERROR: Sanctum reference found outside 'NOT Sanctum' contexts:"
            echo "$HITS"
            FAIL=1
          fi

          # Horizon stays uninstalled. Ratified 2026-07-28 and stated in CLAUDE.md:
          # workers run Laravel's native queue:work + schedule:work — the compose
          # `worker` and `scheduler` services named in (a) — and Horizon "is
          # deferred, NOT installed — do not assume it exists".
          #
          # Guarded because it is the kind of decision that gets quietly undone:
          # somebody reaches for a queue dashboard, composer require succeeds,
          # and a ratified architectural choice is reversed by a convenience.
          # Adopting it later is an additive change with a proposal, not a
          # dependency somebody added on a Tuesday.
          HITS=$(scan_horizon .)
          if [ -n "$HITS" ]; then
            echo "ERROR: laravel/horizon is installed. It is DEFERRED by ratified decision (CLAUDE.md)."
            echo "$HITS"
            FAIL=1
          fi

          # Bun-only, in the Nuxt apps. (legacy-demo keeps its npm toolchain and
          # is excluded by not being passed in.)
          #
          # `scan_bun_only` from scripts/ci-guards.sh. It searched for
          # "pnpm\|yarn" — two of the five banned tools — and never looked at
          # Markdown. Both READMEs shipped `npm install` as the first instruction
          # a new developer read, while this check stayed green.
          #
          # No carve-outs. The one hit this found was `npm install -g bun` in the
          # submodules' own CI, and the right answer was to fix that — they now
          # use oven-sh/setup-bun@v2, as this workflow already did. Excluding a
          # violation by name protects nothing and leaves a hole open.
          HITS=$(scan_bun_only frontend/ backoffice/ scripts/)
          if [ -n "$HITS" ]; then
            echo "ERROR: non-Bun package manager command in frontend/backoffice (Bun-only projects):"
            echo "$HITS"
            FAIL=1
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo "No stale stack tokens found."
          else
            exit 1
          fi

      # -----------------------------------------------------------------------
      # (h) docs/version-catalog.md matches reality, in both directions.
      #
      #     docs/version-catalog.md's own rules section says the table and
      #     reality "are checked against each other" — nothing checked that
      #     until this step. It replaced the archived D25 design section,
      #     which itself had drifted (three bare-major tags that step (a)'s
      #     own `tag_pinned` would reject, sitting beside Dockerfiles already
      #     pinned to a patch) precisely because nothing enforced it there
      #     either. A manual check done once is not a gate.
      #
      #     Reality is the source of truth for what is USED (every Dockerfile
      #     FROM base image across api/, frontend/, backoffice/, plus every
      #     image `docker compose config` declares); the catalog is the
      #     source of truth for what is ALLOWED. Both directions are build
      #     failures, same doctrine as scripts/framework-known-gaps.txt,
      #     scripts/framework-competency-gaps.txt and
      #     scripts/framework-crossrole-baseline.txt above:
      #
      #       * a tag bumped in a Dockerfile or docker-compose.yml, with the
      #         catalog row not updated in the same commit -> fail
      #       * a catalog row for an image that is no longer used anywhere
      #         (dropped, renamed) -> fail
      #
      #     Local build-only tags (beai-api:local, beai-frontend:local,
      #     beai-backoffice:local) are excluded — they are built FROM the
      #     three Dockerfiles this step already reads, and a row pinning
      #     "whatever was just built" asserts nothing.
      #
      #     `catalog_dockerfile_images` (scripts/ci-guards.sh) reuses
      #     `df_guard`'s own stage-exclusion helpers, so a multi-stage
      #     `FROM builder AS runtime` is read as a reference to an earlier
      #     STAGE, never reported as a missing catalog row.
      # -----------------------------------------------------------------------
      - name: Verify docs/version-catalog.md matches reality (both directions)
        run: |
          . ./scripts/ci-guards.sh

          FAIL=0

          if [ ! -f docs/version-catalog.md ]; then
            echo "ERROR: docs/version-catalog.md not found. There is no catalog to check reality against."
            exit 1
          fi

          # `docker compose config` failing outright is not "nothing to
          # check" — it is the guard failing to RUN. Captured via if/else,
          # not `cmd; STATUS=$?` on separate lines, for the same reason
          # documented at steps (a), (b) and (d)'s call sites: this
          # `run:` block executes under `bash -e`, and a bare
          # nonzero-exiting command outside an `if` condition aborts the
          # step before its status is ever read.
          COMPOSE_ERR=$(mktemp)
          if COMPOSE_CONFIG=$(docker compose config 2>"$COMPOSE_ERR"); then
            rm -f "$COMPOSE_ERR"
          else
            echo "ERROR: 'docker compose config' failed. Image references cannot be verified against a"
            echo "  config that does not parse — this is a guard that FAILED TO RUN, not a pass."
            sed 's/^/  /' "$COMPOSE_ERR"
            rm -f "$COMPOSE_ERR"
            exit 1
          fi

          # USED, side 1 — Dockerfile FROM bases. Existence is checked
          # explicitly, even though `catalog_dockerfile_images` itself
          # fails closed on a missing file (same as `df_guard`): a silently
          # empty contribution from a missing Dockerfile would read as
          # "that app has no base image", not "could not be checked".
          USED_IMAGES=""
          for DF in api/Dockerfile frontend/Dockerfile backoffice/Dockerfile; do
            if [ ! -f "$DF" ]; then
              echo "ERROR: $DF not found. The catalog check cannot verify what it cannot read."
              exit 1
            fi
            if ! DF_IMAGES=$(catalog_dockerfile_images "$DF"); then
              echo "ERROR: could not read FROM lines from $DF."
              exit 1
            fi
            USED_IMAGES=$(printf '%s\n%s' "$USED_IMAGES" "$DF_IMAGES")
          done

          # USED, side 2 — compose image: references, local build tags
          # excluded by `compose_declared_images`.
          USED_IMAGES=$(printf '%s\n%s' "$USED_IMAGES" "$(compose_declared_images "$COMPOSE_CONFIG")")

          # USED, side 3 — images a SCRIPT pins for `docker run`.
          #
          # Without this the gate's "reality" is three Dockerfiles and compose,
          # while the repo also pins the 3.45GB Playwright image from
          # scripts/e2e-container.sh. That left the tag in a state where BOTH
          # directions fail: catalogued, Direction 2 reports it as no longer
          # used; uncatalogued, Direction 1 reports it as uncatalogued. The
          # self-test in (f) was widened first and this gate was not — a check
          # proven against a definition the real gate does not share, which is
          # the same defect one level up.
          if ! SCRIPT_IMAGES=$(script_pinned_images scripts); then
            echo "ERROR: could not read scripts/ for the image refs it pins."
            exit 1
          fi
          USED_IMAGES=$(printf '%s\n%s' "$USED_IMAGES" "$SCRIPT_IMAGES")

          # Deduplicated, non-blank, one per line. `worker` and `scheduler`
          # build the same image as `api` (beai-api:local, already
          # excluded above); `php:8.5.8-fpm-alpine` appears in both
          # api/Dockerfile stages. Neither should be asked about twice.
          USED_IMAGES=$(printf '%s\n' "$USED_IMAGES" | grep -v '^$' | sort -u)

          # Minimum-evidence guard, same shape as step (a)'s
          # `compose_image_refs_present`: zero image references found is not
          # a clean result, it is this guard failing to run.
          USED_COUNT=$(printf '%s\n' "$USED_IMAGES" | grep -c . || true)
          if [ "$USED_COUNT" -eq 0 ]; then
            echo "ERROR: found ZERO image references across the 3 Dockerfiles and docker-compose.yml."
            echo "  There is no evidence to check here, so this is a guard that FAILED TO RUN — not a pass."
            exit 1
          fi
          echo "Images actually used ($USED_COUNT, local build tags excluded):"
          printf '%s\n' "$USED_IMAGES" | sed 's/^/  /'

          # CATALOG side. `version_catalog_images` fails closed on a
          # missing file (already checked above, guarded again anyway: a
          # guard must never read "could not run" as "nothing declared").
          if ! CATALOG_IMAGES=$(version_catalog_images docs/version-catalog.md); then
            echo "ERROR: could not read docs/version-catalog.md."
            exit 1
          fi
          CATALOG_COUNT=$(printf '%s\n' "$CATALOG_IMAGES" | grep -c . || true)
          if [ "$CATALOG_COUNT" -eq 0 ]; then
            echo "ERROR: docs/version-catalog.md declares ZERO images under 'Docker base images'."
            echo "  The heading text or the table format may have changed under this guard — this is"
            echo "  a guard that FAILED TO RUN, not a catalog with nothing to check."
            exit 1
          fi
          echo "Images the catalog declares ($CATALOG_COUNT):"
          printf '%s\n' "$CATALOG_IMAGES" | sed 's/^/  /'

          # Direction 1 — used, but not cataloged. A tag bumped in a
          # Dockerfile or docker-compose.yml without updating the row in
          # the same commit.
          MISSING=$(image_set_difference "$USED_IMAGES" "$CATALOG_IMAGES")
          if [ -n "$MISSING" ]; then
            echo "ERROR: the following image(s) are used but not declared in docs/version-catalog.md:"
            printf '%s\n' "$MISSING" | sed 's/^/  /'
            echo "  Add a row for each, in the same commit that bumped it."
            FAIL=1
          fi

          # Direction 2 — cataloged, but no longer used anywhere. A row
          # left behind after an image was dropped or renamed — the same
          # note-outliving-its-fact defect as a stale known-gaps or
          # baseline entry in step (d) above, applied to this file.
          STALE=$(image_set_difference "$CATALOG_IMAGES" "$USED_IMAGES")
          if [ -n "$STALE" ]; then
            echo "ERROR: the following image(s) are declared in docs/version-catalog.md but are no longer used anywhere:"
            printf '%s\n' "$STALE" | sed 's/^/  /'
            echo "  Delete the row — the catalog is asserting a fact that is no longer true."
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "docs/version-catalog.md matches reality: every used image tag is cataloged, and every cataloged tag is used."
