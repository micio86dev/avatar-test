---
# BEAI — wrapper Taskfile
# Requires: go-task >= 3.0 (https://taskfile.dev)
# Install: brew install go-task  (macOS) | see docs/dev-setup.md for other platforms
version: "3"

vars:
  # Path to the wrapper docker-compose file.
  COMPOSE_FILE: "{{.ROOT_DIR}}/docker-compose.yml"

tasks:

  # ---------------------------------------------------------------------------
  # Infrastructure lifecycle
  # ---------------------------------------------------------------------------

  up:
    desc: "Start local dev infra (postgres, redis, mailpit) in detached mode"
    cmds:
      # The service list is NOT redundant with the desc — it is what makes the
      # desc true. Bare `docker compose up -d` starts all EIGHT services in
      # docker-compose.yml, which means building beai-api:local,
      # beai-frontend:local and beai-backoffice:local plus running `worker` and
      # `scheduler`. A task called `up`, documented as starting three infra
      # containers, was building three application images nobody asked for.
      #
      # Infra is the right scope for this task. Everything downstream assumes
      # it: `test:api` says "requires postgres + redis healthy" and then runs
      # `php artisan test` on the HOST, and `test:frontend` runs `bun run
      # test:unit` on the host too. The containerised apps are for compose-level
      # verification, not for the inner development loop, so paying their build
      # cost on every `task up` buys nothing and hides the fast path.
      #
      # Need the whole stack (app containers, worker, scheduler)? That is a
      # different intent, so ask for it explicitly:
      #   docker compose -f docker-compose.yml up -d
      - docker compose -f "{{.COMPOSE_FILE}}" up -d postgres redis mailpit

  down:
    desc: "Stop and remove local dev infra containers (volumes are preserved)"
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" down

  # ---------------------------------------------------------------------------
  # Submodule management
  #
  # api, frontend and backoffice are real git submodules, declared in .gitmodules
  # with remote URLs and each tracking its own `develop` branch. The wrapper pins
  # one commit per submodule; `git clone --recursive` (or `submodules:init`)
  # restores exactly those pins.
  # ---------------------------------------------------------------------------

  submodules:init:
    desc: "Initialise and clone all git submodules at their pinned commits"
    cmds:
      - git submodule update --init --recursive

  submodules:update:
    desc: "Advance each submodule to the tip of its tracking branch (MOVES the pins)"
    cmds:
      # This is the one mutating task in the group. `--remote` resolves each
      # submodule against its `branch` in .gitmodules (develop) rather than the
      # commit the wrapper currently pins, so it deliberately moves the pointers
      # OFF the release tags they usually sit on. Nothing is committed here: the
      # wrapper is left with a dirty submodule diff for you to review and commit
      # explicitly, because re-pinning the superproject is a release decision,
      # not a side effect of syncing.
      - git submodule update --remote --merge
      - cmd: |
          echo
          echo "Submodule pointers moved. Review, then commit them in the wrapper:"
          echo
          git submodule status
          echo
          echo "  git add api frontend backoffice"
          echo "  git commit -m 'chore(submodules): bump pointers'"
        silent: true

  submodules:sync:
    desc: "Sync submodule URLs from .gitmodules into .git/config"
    cmds:
      # `sync` only rewrites the recorded URLs; it never fetches. The follow-up
      # `update` is what makes a URL change actually take effect on disk, which
      # is the whole reason you would run this task after a remote is renamed.
      - git submodule sync --recursive
      - git submodule update --init --recursive

  submodules:status:
    desc: "Show submodule pointer freshness (ahead/behind tracking branch)"
    cmds:
      - git submodule status --recursive
      - cmd: |
          echo
          echo "Freshness against each tracking branch:"
          # `git submodule status` reports the pinned SHA and nearest tag, but says
          # nothing about how stale that pin is — which is what this task claims to
          # answer. Getting that requires asking the remote, so this fetches.
          git submodule foreach --quiet '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch" 2>/dev/null || echo develop)
            if ! git fetch --quiet origin "$branch" 2>/dev/null; then
              echo "  $name: origin unreachable — showing local state only"
              exit 0
            fi
            behind=$(git rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo "?")
            ahead=$(git rev-list --count FETCH_HEAD..HEAD 2>/dev/null || echo "?")
            echo "  $name: $(git describe --tags --always) — $behind behind / $ahead ahead of origin/$branch"
          '
        silent: true

  # ---------------------------------------------------------------------------
  # Per-app test runners
  # These delegate to each app's own test suite.
  # Prereq: task up (infra must be healthy for api integration tests).
  # ---------------------------------------------------------------------------

  test:api:
    desc: "Run the api Pest test suite (requires postgres + redis healthy)"
    dir: api
    cmds:
      - php artisan test --parallel

  test:frontend:
    desc: "Run the frontend Vitest unit suite (host) + Playwright E2E (pinned container)"
    cmds:
      - (cd frontend && bun run test:unit)
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" frontend

  test:backoffice:
    desc: "Run the backoffice Vitest unit suite (host) + Playwright E2E (pinned container)"
    cmds:
      - (cd backoffice && bun run test:unit)
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" backoffice

  # E2E in the pinned Playwright container — same env as CI, so the committed
  # -linux screenshot baselines match deterministically (visual regression 100% green).
  e2e:frontend:
    desc: "Run frontend Playwright E2E in the pinned Playwright container (matches CI)"
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" frontend

  e2e:backoffice:
    desc: "Run backoffice Playwright E2E in the pinned Playwright container (matches CI)"
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" backoffice

  e2e:update:
    desc: "Regenerate ALL Playwright screenshot baselines (both apps) in the pinned container"
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" frontend --update-snapshots
      - bash "{{.ROOT_DIR}}/scripts/e2e-container.sh" backoffice --update-snapshots

  # ---------------------------------------------------------------------------
  # OpenAPI client sync (C11 D13)
  #
  # Each app's `scripts/check-client-drift.sh` only re-derives `types/api.ts`
  # from that app's COMMITTED `openapi.json` snapshot — nothing copies the
  # freshly-exported `api/openapi.json` into the consumers, so a green drift
  # check can still hide a stale snapshot against the live API. This task
  # closes that gap: export -> copy -> regenerate the typed clients.
  #
  # BOTH consumers, not just backoffice. The wrapper's Cross-Stack Consistency
  # job requires `openapi.json` to be identical in api/, frontend/ AND
  # backoffice/, so syncing only one of them turns the next added endpoint into
  # a red `main` — which is exactly how it failed after `GET /m2m/abilities`
  # landed. The frontend calls none of the admin endpoints; it carries the spec
  # because the gate treats all three repos as one contract.
  #
  # DB-DRIVER SENSITIVE (generated-client-truth-and-session-safety, apply
  # verification): `php artisan scramble:export` reads `api/.env`, and this
  # repo's committed `.env` defaults to `DB_CONNECTION=sqlite`. Running this
  # task against sqlite produces a WRONG export — SQLite-versus-Postgres JSON
  # column introspection differs, regressing `AvatarTemplateResource.config`/
  # `persona` and `Admin/SessionReviewResource`'s integer fields, none of
  # which this change touched. CI is pinned to Postgres
  # (`pgvector/pgvector:0.8.0-pg17`) so this cannot ship silently, but a
  # developer who runs `task openapi:sync` locally against the default `.env`
  # gets a phantom CI failure on fields this task didn't touch, and can burn
  # real time chasing it. Before running this task, confirm `DB_CONNECTION`
  # resolves to `pgsql` for the `api` process — e.g. run it against the same
  # Postgres service `api/.github/workflows/ci.yml` uses
  # (`DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432
  # DB_DATABASE=beai_test ... task openapi:sync`), never the default sqlite
  # `.env` as-is.
  # ---------------------------------------------------------------------------

  openapi:sync:
    desc: "Export the API's OpenAPI spec, sync it into frontend and backoffice, and regenerate the typed clients"
    dir: api
    # A precondition, not a comment. Under sqlite this task produces a WRONG
    # export — JSON columns introspect differently, so `config`, `persona` and
    # several integer fields come back with the wrong type — and it does it
    # silently, leaving three committed snapshots that all agree with each
    # other and disagree with the API. CI is pinned to Postgres so it cannot
    # ship, which is exactly what makes it expensive: the failure surfaces as a
    # phantom CI red on a machine that looked fine. The note above this block
    # said so already; a note is something you read after losing the hour.
    #
    # `config:show`, not `tinker --execute`. Both answer the same question, but
    # tinker boots a full PsySH REPL to evaluate one expression, and its output
    # contract is whatever the REPL decides to print — which has moved between
    # Laravel majors. `config:show` is a first-class command whose entire job is
    # printing a config key (Laravel 11+; this repo is on laravel/framework
    # v13.20). Verified on both counts here: it exists, it is measurably cheaper,
    # and it exits non-zero on a key that does not resolve.
    #
    # Matched with a regex rather than an equality test because the command
    # renders a two-column row — ` database.default .. pgsql ` — whose dot
    # leader width follows the terminal. `[[:space:].]+` absorbs any leader, and
    # anchoring the value at end-of-line means `pgsql` has to BE the value, not
    # merely appear somewhere in it. Confirmed against real output at both the
    # default and COLUMNS=200 widths.
    preconditions:
      - sh: 'php artisan config:show database.default --no-ansi 2>/dev/null | grep -qE "^[[:space:]]*database\.default[[:space:].]+pgsql[[:space:]]*$"'
        msg: "openapi:sync requires DB_CONNECTION=pgsql — sqlite silently produces a wrong export. Point DB_* at Postgres and retry."
    cmds:
      - php artisan scramble:export
      - cp "{{.ROOT_DIR}}/api/openapi.json" "{{.ROOT_DIR}}/frontend/openapi.json"
      - cp "{{.ROOT_DIR}}/api/openapi.json" "{{.ROOT_DIR}}/backoffice/openapi.json"
      - (cd "{{.ROOT_DIR}}/frontend" && bun run codegen)
      - (cd "{{.ROOT_DIR}}/backoffice" && bun run codegen)

  test:load:
    desc: "Run K6 load tests against local docker-compose stack (never Railway). Prereq: task up"
    dir: api
    cmds:
      # Reports saved to docs/load-testing/ (gitignored raw files — README is committed)
      - k6 run --summary-export=../docs/load-testing/baseline-report.json tests/k6/scenarios/baseline.js
      - k6 run --summary-export=../docs/load-testing/stress-report.json tests/k6/scenarios/stress.js
      - k6 run --summary-export=../docs/load-testing/spike-report.json tests/k6/scenarios/spike.js
